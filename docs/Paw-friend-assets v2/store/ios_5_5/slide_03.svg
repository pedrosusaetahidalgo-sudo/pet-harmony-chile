<!-- slide_03.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1242 2208" role="img" aria-label="App Store Slide 03 · Ficha compartible" width="1242" height="2208">
  <title>App Store Slide 03 · Ficha compartible</title>
  <desc>Slide 3 de iOS 5.5" mostrando PDF oficial compartible de la ficha médica + canal WhatsApp.</desc>
  <defs><radialGradient id="g03" cx="15%" cy="15%" r="110%"><stop offset="0%" stop-color="#047857"/><stop offset="100%" stop-color="#10b981"/></radialGradient></defs>
  <rect width="1242" height="2208" fill="url(#g03)"/>

  <!-- Decorative dots pattern -->
  <g fill="#ffffff" opacity="0.08">
    <circle cx="150" cy="180" r="4"/>
    <circle cx="1080" cy="220" r="5"/>
    <circle cx="90" cy="380" r="3"/>
    <circle cx="1120" cy="450" r="3"/>
  </g>

  <!-- Headline (Fredoka 600, 96px, white) -->
  <text x="621" y="320" text-anchor="middle" font-family="Fredoka, sans-serif"
        font-weight="600" font-size="96" fill="#ffffff" letter-spacing="-2">Comparte la ficha en 1 click</text>

  <!-- Subhead (Plus Jakarta Sans 500, 44px) -->
  <text x="621" y="410" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif"
        font-weight="500" font-size="40" fill="#ffffff" fill-opacity="0.88">PDF oficial + link 30 días. Tu vet lo recibe al toque.</text>

  <!-- Phone mockup iPhone 14 style - centered -->
  <g transform="translate(321, 540)">
    <rect x="0" y="0" width="600" height="1220" rx="85" fill="#1a102b"/>
    <rect x="18" y="18" width="564" height="1184" rx="73" fill="#ffffff"/>
    <!-- Dynamic island -->
    <rect x="235" y="48" width="130" height="28" rx="14" fill="#1a102b"/>
    
    <!-- Header emerald -->
    <rect x="18" y="18" width="564" height="130" rx="73" fill="#10b981"/>
    <rect x="18" y="110" width="564" height="40" fill="#10b981"/>
    <text x="300" y="95" text-anchor="middle" font-family="Fredoka, sans-serif"
          font-weight="600" font-size="28" fill="#ffffff">Ficha médica · Kai</text>

    <!-- PDF preview card -->
    <rect x="40" y="180" width="520" height="620" rx="18" fill="#ffffff" stroke="#e9d5ff"/>
    <!-- PDF header -->
    <rect x="40" y="180" width="520" height="90" rx="18" fill="#9333ea"/>
    <rect x="40" y="240" width="520" height="30" fill="#9333ea"/>
    <g transform="translate(80, 210)">
      <rect x="0" y="0" width="50" height="50" rx="11" fill="#ffffff"/>
      <g transform="translate(25, 27) scale(0.06)"><ellipse cx="340" cy="430" rx="155" ry="135" fill="#9333ea"/>
<ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)" fill="#9333ea"/>
<ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)" fill="#9333ea"/>
<ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)" fill="#9333ea"/>
<ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)" fill="#9333ea"/></g>
    </g>
    <text x="150" y="235" font-family="Fredoka, sans-serif" font-weight="600" font-size="24" fill="#ffffff">paw friend</text>
    <text x="150" y="258" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="14" fill="#ffffff" fill-opacity="0.85">Ficha médica · PDF oficial</text>

    <!-- Pet data block -->
    <text x="68" y="305" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" letter-spacing="3" fill="#9333ea">DATOS DEL PELUDO</text>
    <text x="68" y="340" font-family="Fredoka, sans-serif" font-weight="600" font-size="28" fill="#1a102b">Kai</text>
    <text x="68" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="16" fill="#4b3b66">Pastor suizo · 3 años · 32.5 kg</text>

    <!-- Vaccines section -->
    <text x="68" y="420" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" letter-spacing="3" fill="#047857">VACUNAS AL DÍA</text>
    <g transform="translate(68, 440)">
      <circle cx="10" cy="10" r="9" fill="#10b981"/>
      <path d="M 5 10 L 9 14 L 15 7" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="30" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="16" fill="#1a102b">Rabia · mar 2026</text>
    </g>
    <g transform="translate(68, 475)">
      <circle cx="10" cy="10" r="9" fill="#10b981"/>
      <path d="M 5 10 L 9 14 L 15 7" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="30" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="16" fill="#1a102b">Sextuple · feb 2026</text>
    </g>
    <g transform="translate(68, 510)">
      <circle cx="10" cy="10" r="9" fill="#10b981"/>
      <path d="M 5 10 L 9 14 L 15 7" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="30" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="16" fill="#1a102b">Antiparasitario · abr 2026</text>
    </g>

    <!-- Medical history row -->
    <rect x="68" y="560" width="464" height="1" fill="#e9d5ff"/>
    <text x="68" y="595" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" letter-spacing="3" fill="#be185d">HISTORIAL RECIENTE</text>
    <text x="68" y="625" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="15" fill="#4b3b66">28 feb · Chequeo anual (Dra. Muñoz)</text>
    <text x="68" y="650" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="15" fill="#4b3b66">15 mar · Vacuna Rabia (Clínica Cafati)</text>

    <!-- CTA big gold -->
    <rect x="68" y="700" width="464" height="72" rx="36" fill="#eab308"/>
    <text x="300" y="745" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="24" fill="#1a102b">Compartir PDF</text>

  </g>

  <!-- WhatsApp icon flotante con arrow -->
<g transform="translate(1020, 1000)">
  <circle cx="0" cy="0" r="50" fill="#25D366"/>
  <path d="M -18 -18 Q -25 -8 -20 0 L -22 12 L -10 8 Q -5 12 2 10 Q 15 6 15 -5 Q 12 -18 -2 -20 Q -14 -20 -18 -18 Z" fill="#ffffff"/>
</g>
<path d="M 1000 1080 L 1030 1120 L 1020 1115 L 1025 1135 M 1030 1120 L 1005 1135" stroke="#eab308" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Pill gold inferior -->
  <rect x="281" y="1870" width="680" height="100" rx="50" fill="#eab308"/>
  <text x="621" y="1932" text-anchor="middle" font-family="Fredoka, sans-serif"
        font-weight="600" font-size="36" fill="#1a102b">PDF + WhatsApp directo</text>

  <!-- Brand watermark bottom -->
  <text x="621" y="2090" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif"
        font-weight="700" font-size="22" letter-spacing="5" fill="#ffffff" fill-opacity="0.7">PAWFRIEND.CL</text>
</svg>
