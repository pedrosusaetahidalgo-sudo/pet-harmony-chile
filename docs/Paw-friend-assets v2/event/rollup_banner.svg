<!-- rollup_banner.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 2000" role="img" aria-label="Paw Friend Roll-up Banner" width="850" height="2000">
  <title>Paw Friend Roll-up Banner</title>
  <desc>Roll-up banner 85×200cm con isotipo hero, 3 bullets y CTA para eventos y ferias.</desc>
  <defs><linearGradient id="ru-bg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#2a1046" stop-opacity="1"/><stop offset="50%" stop-color="#581c87" stop-opacity="1"/><stop offset="100%" stop-color="#9333ea" stop-opacity="1"/></linearGradient><radialGradient id="ru-glow" cx="50%" cy="30%" r="40%"><stop offset="0%" stop-color="#eab308" stop-opacity="0.25"/><stop offset="100%" stop-color="#eab308" stop-opacity="0"/></radialGradient></defs>
  <rect width="850" height="2000" fill="url(#ru-bg)"/>
  <rect width="850" height="2000" fill="url(#ru-glow)"/>

  <!-- Sparkles decorativas -->
  <g fill="#ffffff" opacity="0.1">
    <circle cx="120" cy="350" r="4"/>
    <circle cx="720" cy="400" r="5"/>
    <circle cx="180" cy="1200" r="4"/>
    <circle cx="700" cy="1350" r="3"/>
    <circle cx="100" cy="1800" r="3"/>
    <circle cx="750" cy="1750" r="4"/>
  </g>

  <!-- Logo + wordmark top -->
  <g transform="translate(345, 180)">
    <rect x="0" y="0" width="160" height="160" rx="35" fill="#ffffff"/>
    <g transform="translate(80, 85) scale(0.2)"><ellipse cx="340" cy="430" rx="155" ry="135" fill="#9333ea"/>
<ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)" fill="#9333ea"/>
<ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)" fill="#9333ea"/>
<ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)" fill="#9333ea"/>
<ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)" fill="#9333ea"/></g>
  </g>
  <text x="425" y="410" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="64" fill="#ffffff">paw friend</text>

  <!-- Hero title -->
  <text x="425" y="650" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="80" fill="#ffffff">La ficha médica</text>
  <text x="425" y="740" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="80" fill="#fde68a">de tu mascota</text>
  <text x="425" y="820" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="500" font-size="48" fill="#ffffff" fill-opacity="0.85">Hecha en Chile.</text>

  <!-- Big isotype center -->
  <g transform="translate(225, 950)">
    <rect x="0" y="0" width="400" height="400" rx="88" fill="#ffffff" fill-opacity="0.1"/>
    <g transform="translate(200, 210) scale(0.5)"><ellipse cx="340" cy="430" rx="155" ry="135" fill="#ffffff"/>
<ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)" fill="#ffffff"/>
<ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)" fill="#ffffff"/>
<ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)" fill="#ffffff"/>
<ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)" fill="#ffffff"/></g>
  </g>

  <!-- 3 bullets features -->
  <g transform="translate(60, 1420)">
    <circle cx="30" cy="30" r="22" fill="#eab308"/>
    <path d="M 20 30 L 27 38 L 42 22" stroke="#1a102b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="75" y="40" font-family="Fredoka, sans-serif" font-weight="500" font-size="28" fill="#ffffff">Ficha médica 100% gratis</text>
  </g>
  <g transform="translate(60, 1490)">
    <circle cx="30" cy="30" r="22" fill="#eab308"/>
    <path d="M 20 30 L 27 38 L 42 22" stroke="#1a102b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="75" y="40" font-family="Fredoka, sans-serif" font-weight="500" font-size="28" fill="#ffffff">+50 vets en la Región Metropolitana</text>
  </g>
  <g transform="translate(60, 1560)">
    <circle cx="30" cy="30" r="22" fill="#eab308"/>
    <path d="M 20 30 L 27 38 L 42 22" stroke="#1a102b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="75" y="40" font-family="Fredoka, sans-serif" font-weight="500" font-size="28" fill="#ffffff">Disponible web + iOS + Android</text>
  </g>

  <!-- CTA box bottom -->
  <rect x="125" y="1680" width="600" height="140" rx="70" fill="#eab308"/>
  <text x="425" y="1740" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="36" fill="#1a102b">Descarga en</text>
  <text x="425" y="1790" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="44" fill="#1a102b">pawfriend.cl</text>

  <!-- Footer brand -->
  <text x="425" y="1920" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="14" fill="#ffffff" fill-opacity="0.6">SpA SUSAETA GARNHAM SOFTWARE ENGINEERING · RUT 78.328.659-9</text>
</svg>
