  <path d="M 100 10 C 170 10, 190 30, 190 100 C 190 170, 170 190, 100 190 C 30 190, 10 170, 10 100 C 10 30, 30 10, 100 10 Z" fill="url(#g56)"/>
  <!-- Escudo -->
  <path d="M 100 50 L 150 65 L 150 110 Q 150 145 100 160 Q 50 145 50 110 L 50 65 Z" fill="#ffffff"/>
