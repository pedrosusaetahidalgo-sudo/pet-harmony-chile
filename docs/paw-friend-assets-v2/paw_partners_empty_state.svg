<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <title>Paw Partners — Empty State</title>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3E8FF"/>
      <stop offset="60%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="shop1Body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="shop2Body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D1FAE5"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#skyGrad)"/>

  <!-- Warm sun glow -->
  <circle cx="400" cy="120" r="140" fill="url(#sun)"/>

  <!-- Ground line -->
  <line x1="40" y1="450" x2="760" y2="450" stroke="#065F46" stroke-width="1.5" opacity="0.3"/>

  <!-- Shop 1 (left - purple) -->
  <g transform="translate(80, 220)">
    <!-- Awning -->
    <path d="M 20 50 L 180 50 L 160 80 L 40 80 Z" fill="#9333EA"/>
    <path d="M 30 50 L 30 80 M 60 50 L 60 80 M 90 50 L 90 80 M 120 50 L 120 80 M 150 50 L 150 80 M 170 50 L 170 80" stroke="#7E22CE" stroke-width="1" opacity="0.4"/>
    <!-- Body -->
    <rect x="25" y="80" width="150" height="150" fill="url(#shop1Body)" rx="3"/>
    <!-- Roof sign -->
    <rect x="60" y="20" width="80" height="34" rx="4" fill="#FFFFFF" stroke="#9333EA" stroke-width="2"/>
    <text x="100" y="43" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="15" font-weight="700" fill="#9333EA" text-anchor="middle">PET SHOP</text>
    <!-- Door -->
    <rect x="80" y="145" width="40" height="85" rx="3" fill="#6B21A8"/>
    <circle cx="113" cy="190" r="2.5" fill="#FBBF24"/>
    <!-- Window -->
    <rect x="40" y="100" width="30" height="30" rx="2" fill="#FAF7FF" stroke="#7E22CE" stroke-width="1.5"/>
    <rect x="130" y="100" width="30" height="30" rx="2" fill="#FAF7FF" stroke="#7E22CE" stroke-width="1.5"/>
    <!-- Paw mini sign on door window -->
    <circle cx="55" cy="115" r="4" fill="#9333EA"/>
  </g>

  <!-- Shop 2 (right - emerald) -->
  <g transform="translate(540, 200)">
    <!-- Pitched roof -->
    <path d="M 10 70 L 100 20 L 190 70 Z" fill="#10B981"/>
    <!-- Body -->
    <rect x="25" y="70" width="150" height="180" fill="url(#shop2Body)" rx="3"/>
    <!-- Sign -->
    <rect x="45" y="85" width="110" height="32" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="100" y="107" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="14" font-weight="700" fill="#10B981" text-anchor="middle">CAFÉ PET</text>
    <!-- Door -->
    <rect x="80" y="165" width="40" height="85" rx="3" fill="#065F46"/>
    <circle cx="113" cy="210" r="2.5" fill="#FBBF24"/>
    <!-- Windows -->
    <rect x="40" y="130" width="30" height="26" rx="2" fill="#FAF7FF" stroke="#0F766E" stroke-width="1.5"/>
    <rect x="130" y="130" width="30" height="26" rx="2" fill="#FAF7FF" stroke="#0F766E" stroke-width="1.5"/>
    <!-- Chimney -->
    <rect x="130" y="25" width="15" height="30" fill="#065F46"/>
  </g>

  <!-- Dotted road between shops -->
  <g>
    <!-- Main dashed path -->
    <path d="M 280 450 Q 400 440 520 450" stroke="#9333EA" stroke-width="3" stroke-linecap="round" stroke-dasharray="4,12" fill="none" opacity="0.55"/>
  </g>

  <!-- Paw prints walking along the road (from left shop toward right shop) -->
  <g fill="#9333EA" opacity="0.7">
    <!-- Paw 1 -->
    <g transform="translate(300 470) scale(0.045) rotate(8 512 420)">
      <ellipse cx="512" cy="510" rx="155" ry="135"/>
      <ellipse cx="372" cy="350" rx="55" ry="68" transform="rotate(-22 372 350)"/>
      <ellipse cx="460" cy="260" rx="50" ry="62" transform="rotate(-10 460 260)"/>
      <ellipse cx="564" cy="260" rx="50" ry="62" transform="rotate(10 564 260)"/>
      <ellipse cx="652" cy="350" rx="55" ry="68" transform="rotate(22 652 350)"/>
    </g>
    <!-- Paw 2 -->
    <g transform="translate(360 460) scale(0.05) rotate(-5 512 420)">
      <ellipse cx="512" cy="510" rx="155" ry="135"/>
      <ellipse cx="372" cy="350" rx="55" ry="68" transform="rotate(-22 372 350)"/>
      <ellipse cx="460" cy="260" rx="50" ry="62" transform="rotate(-10 460 260)"/>
      <ellipse cx="564" cy="260" rx="50" ry="62" transform="rotate(10 564 260)"/>
      <ellipse cx="652" cy="350" rx="55" ry="68" transform="rotate(22 652 350)"/>
    </g>
    <!-- Paw 3 (center - larger, prominent) -->
    <g transform="translate(395 448) scale(0.06) rotate(3 512 420)" opacity="1.0">
      <ellipse cx="512" cy="510" rx="155" ry="135" fill="#10B981"/>
      <ellipse cx="372" cy="350" rx="55" ry="68" transform="rotate(-22 372 350)" fill="#10B981"/>
      <ellipse cx="460" cy="260" rx="50" ry="62" transform="rotate(-10 460 260)" fill="#10B981"/>
      <ellipse cx="564" cy="260" rx="50" ry="62" transform="rotate(10 564 260)" fill="#10B981"/>
      <ellipse cx="652" cy="350" rx="55" ry="68" transform="rotate(22 652 350)" fill="#10B981"/>
    </g>
    <!-- Paw 4 -->
    <g transform="translate(438 462) scale(0.05) rotate(8 512 420)">
      <ellipse cx="512" cy="510" rx="155" ry="135"/>
      <ellipse cx="372" cy="350" rx="55" ry="68" transform="rotate(-22 372 350)"/>
      <ellipse cx="460" cy="260" rx="50" ry="62" transform="rotate(-10 460 260)"/>
      <ellipse cx="564" cy="260" rx="50" ry="62" transform="rotate(10 564 260)"/>
      <ellipse cx="652" cy="350" rx="55" ry="68" transform="rotate(22 652 350)"/>
    </g>
    <!-- Paw 5 -->
    <g transform="translate(490 470) scale(0.045) rotate(-4 512 420)">
      <ellipse cx="512" cy="510" rx="155" ry="135"/>
      <ellipse cx="372" cy="350" rx="55" ry="68" transform="rotate(-22 372 350)"/>
      <ellipse cx="460" cy="260" rx="50" ry="62" transform="rotate(-10 460 260)"/>
      <ellipse cx="564" cy="260" rx="50" ry="62" transform="rotate(10 564 260)"/>
      <ellipse cx="652" cy="350" rx="55" ry="68" transform="rotate(22 652 350)"/>
    </g>
  </g>

  <!-- Copy -->
  <text x="400" y="520" font-family="Fredoka, 'Nunito', ui-rounded, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1A102B" text-anchor="middle" letter-spacing="-0.5">Aún no hay Paw Partners en tu comuna</text>
  <text x="400" y="560" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="18" font-weight="500" fill="#065F46" text-anchor="middle" letter-spacing="-0.2">¿Conoces un negocio que quiera sumarse? Recomiéndalo 💚</text>
</svg>
