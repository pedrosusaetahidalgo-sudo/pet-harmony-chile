  <path d="M 140 107.8 C 134.8 104.4, 134.0 100.4, 138.0 101.8 C 139.2 103.0, 140 103.8, 140 104.6 C 140 103.8, 140.8 103.0, 142.0 101.8 C 146.0 100.4, 145.2 104.4, 140 107.8 Z" fill="#fbbf24"/>
