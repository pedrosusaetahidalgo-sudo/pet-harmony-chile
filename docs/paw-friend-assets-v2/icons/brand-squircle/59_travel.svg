<!-- 59_travel.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Viaje con mascota" width="200" height="200">
  <title>Viaje con mascota</title>
  <desc>Maleta con asa, esquinas reforzadas y etiqueta gold. Ícono 59 para viaje con mascota Paw Friend.</desc>
  <defs><linearGradient id="g59" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#047857" stop-opacity="1"/><stop offset="100%" stop-color="#10b981" stop-opacity="1"/></linearGradient></defs>
  <path d="M 100 10 C 170 10, 190 30, 190 100 C 190 170, 170 190, 100 190 C 30 190, 10 170, 10 100 C 10 30, 30 10, 100 10 Z" fill="url(#g59)"/>
  <!-- Maleta cuerpo -->
  <rect x="50" y="70" width="100" height="90" rx="8" fill="#ffffff"/>
  <!-- Asa arriba -->
  <path d="M 82 70 L 82 55 Q 82 48 90 48 L 110 48 Q 118 48 118 55 L 118 70"
        stroke="#ffffff" stroke-width="4" fill="none" stroke-linejoin="round"/>
  <!-- Esquinas reforzadas -->
  <rect x="50" y="70" width="15" height="15" fill="#047857"/>
  <rect x="135" y="70" width="15" height="15" fill="#047857"/>
  <rect x="50" y="145" width="15" height="15" fill="#047857"/>
  <rect x="135" y="145" width="15" height="15" fill="#047857"/>
  <!-- Pata negative space centro -->
  <ellipse cx="100" cy="122.4" rx="9.9" ry="8.2" fill="url(#g59)"/><ellipse cx="91.2" cy="112.5" rx="3.3" ry="4.4" transform="rotate(-22 91.2 112.5)" fill="url(#g59)"/><ellipse cx="96.7" cy="107.5" rx="3.0" ry="3.9" transform="rotate(-10 96.7 107.5)" fill="url(#g59)"/><ellipse cx="103.3" cy="107.5" rx="3.0" ry="3.9" transform="rotate(10 103.3 107.5)" fill="url(#g59)"/><ellipse cx="108.8" cy="112.5" rx="3.3" ry="4.4" transform="rotate(22 108.8 112.5)" fill="url(#g59)"/>
  <!-- Etiqueta gold colgando -->
  <rect x="118" y="54" width="14" height="18" rx="2" fill="#fbbf24"/>
  <line x1="118" y1="52" x2="125" y2="48" stroke="#fbbf24" stroke-width="2"/>
</svg>
