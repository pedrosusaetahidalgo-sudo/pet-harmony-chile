<!-- 58_birthday.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Cumpleaños y aniversario" width="200" height="200">
  <title>Cumpleaños y aniversario</title>
