<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <title>Paw Voices — Instagram Square Post</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCE7F3"/>
      <stop offset="60%" stop-color="#FFF7FB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <clipPath id="squircleClip">
      <path d="M 512 120 C 712 120, 812 220, 812 420 C 812 620, 712 720, 512 720 C 312 720, 212 620, 212 420 C 212 220, 312 120, 512 120 Z"/>
    </clipPath>
    <mask id="heartMask">
      <rect x="-200" y="-200" width="1400" height="1400" fill="white"/>
      <path d="M 512 560 C 504 550, 490 540, 482 530 C 474 520, 477 505, 490 502 C 499 500, 507 505, 512 512 C 517 505, 525 500, 534 502 C 547 505, 550 520, 542 530 C 534 540, 520 550, 512 560 Z" fill="black"/>
    </mask>
    <clipPath id="squircleClipSmall">
      <path d="M 212 120 L 812 120 L 812 720 L 212 720 Z"/>
    </clipPath>
  </defs>

  <rect width="1080" height="1080" fill="url(#bgGrad)"/>

  <!-- Paw watermark BEHIND (20% opacity, very large, offset to bottom-right) -->
  <g opacity="0.12" transform="translate(100 580) scale(1.4)">
    <ellipse cx="512" cy="510" rx="155" ry="135" fill="#9333EA"/>
    <ellipse cx="372" cy="350" rx="55" ry="68" transform="rotate(-22 372 350)" fill="#9333EA"/>
    <ellipse cx="460" cy="260" rx="50" ry="62" transform="rotate(-10 460 260)" fill="#9333EA"/>
    <ellipse cx="564" cy="260" rx="50" ry="62" transform="rotate(10 564 260)" fill="#9333EA"/>
    <ellipse cx="652" cy="350" rx="55" ry="68" transform="rotate(22 652 350)" fill="#9333EA"/>
  </g>

  <!-- Squircle principal 540px centrado arriba at (270, 80) -->
  <g transform="translate(79.6 -28) scale(0.9)">
    <path d="M 512 120 C 712 120, 812 220, 812 420 C 812 620, 712 720, 512 720 C 312 720, 212 620, 212 420 C 212 220, 312 120, 512 120 Z" fill="url(#tileGrad)"/>
    <g clip-path="url(#squircleClip)">
      <ellipse cx="512" cy="510" rx="155" ry="135" fill="#FFFFFF" mask="url(#heartMask)"/>
      <ellipse cx="372" cy="350" rx="55" ry="68" transform="rotate(-22 372 350)" fill="#FFFFFF"/>
      <ellipse cx="460" cy="260" rx="50" ry="62" transform="rotate(-10 460 260)" fill="#FFFFFF"/>
      <ellipse cx="564" cy="260" rx="50" ry="62" transform="rotate(10 564 260)" fill="#FFFFFF"/>
      <ellipse cx="652" cy="350" rx="55" ry="68" transform="rotate(22 652 350)" fill="#FFFFFF"/>
      <g stroke="#FFFFFF" fill="none" stroke-linecap="round" stroke-width="18">
        <path d="M 706 275 A 30 30 0 0 1 727 296"/>
        <path d="M 712 251 A 55 55 0 0 1 751 290"/>
        <path d="M 719 227 A 80 80 0 0 1 775 283"/>
      </g>
    </g>
  </g>

  <!-- Bottom copy area -->
  <!-- Headline slot -->
  <text x="540" y="780" font-family="Fredoka, 'Nunito', ui-rounded, system-ui, sans-serif" font-size="68" font-weight="700" fill="#1A102B" text-anchor="middle" letter-spacing="-2">Tus peludos tienen</text>
  <text x="540" y="860" font-family="Fredoka, 'Nunito', ui-rounded, system-ui, sans-serif" font-size="68" font-weight="700" fill="#9333EA" text-anchor="middle" letter-spacing="-2">historias</text>

  <!-- Subtitle -->
  <text x="540" y="935" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="34" font-weight="500" fill="#6B21A8" text-anchor="middle" letter-spacing="-0.5">Amplifícalas con Paw Voices</text>

  <!-- Brand footer -->
  <g transform="translate(540, 1010)">
    <text font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="26" font-weight="600" fill="#9333EA" text-anchor="middle" letter-spacing="3">PAWFRIEND.CL</text>
  </g>
</svg>
