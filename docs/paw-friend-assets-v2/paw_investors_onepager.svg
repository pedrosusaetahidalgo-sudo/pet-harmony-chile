  <text x="180" y="3400" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="22" font-weight="600" fill="#1A102B" letter-spacing="2">PAW FOUNDER · 2026</text>
  <text x="1240" y="3400" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="22" font-weight="500" fill="#7E22CE" text-anchor="middle" letter-spacing="2">pawfriend.cl/pitch-deck</text>
  <text x="2300" y="3400" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="22" font-weight="500" fill="#EAB308" text-anchor="end" letter-spacing="4">CONFIDENTIAL</text>
