    <text x="440" y="140" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="96" font-weight="700" fill="#1A102B" text-anchor="middle" letter-spacing="-3">USD [ XXX ]K</text>
    <text x="440" y="210" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="28" font-weight="500" fill="#4C1D95" text-anchor="middle" letter-spacing="2">RONDA SEED · PRE-SEED</text>
    <line x1="120" y1="260" x2="760" y2="260" stroke="#EAB308" stroke-width="1" opacity="0.5"/>
    <text x="40" y="310" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="22" font-weight="500" fill="#1A102B" letter-spacing="-0.2">· [ % ] producto &amp; equipo técnico</text>
    <text x="40" y="350" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="22" font-weight="500" fill="#1A102B" letter-spacing="-0.2">· [ % ] GTM &amp; adquisición</text>
    <text x="40" y="390" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="22" font-weight="500" fill="#1A102B" letter-spacing="-0.2">· [ % ] operación &amp; runway</text>
