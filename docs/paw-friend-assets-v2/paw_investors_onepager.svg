  <text x="180" y="1340" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="26" font-weight="500" fill="#4C1D95" letter-spacing="-0.3" font-style="italic">[ Tu problema aquí — dolor concreto, con dato ]</text>
  <line x1="180" y1="1390" x2="340" y2="1390" stroke="#EAB308" stroke-width="2"/>
  <text x="180" y="1450" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="22" font-weight="500" fill="#1A102B" letter-spacing="-0.2">· [ pain point concreto 1 ]</text>
  <text x="180" y="1500" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="22" font-weight="500" fill="#1A102B" letter-spacing="-0.2">· [ pain point concreto 2 ]</text>
  <text x="180" y="1550" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="22" font-weight="500" fill="#1A102B" letter-spacing="-0.2">· [ pain point concreto 3 ]</text>
