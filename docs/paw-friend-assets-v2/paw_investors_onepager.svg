    <text x="0" y="50" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="20" font-weight="500" fill="#065F46" letter-spacing="2">CLÍNICAS B2B</text>
  </g>
  <g transform="translate(180, 2740)">
    <text x="0" y="0" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="56" font-weight="700" fill="#10B981" letter-spacing="-1">[ XX% ]</text>
    <text x="0" y="50" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="20" font-weight="500" fill="#065F46" letter-spacing="2">RETENCIÓN 30D</text>
  </g>
  <g transform="translate(540, 2740)">
    <text x="0" y="0" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="56" font-weight="700" fill="#10B981" letter-spacing="-1">[ XX ]</text>
    <text x="0" y="50" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="20" font-weight="500" fill="#065F46" letter-spacing="2">PAW PARTNERS</text>
  </g>

