  <!-- Gold hairline around squircle (480×480 at 1000, 180) - squircle bounds 1000-1480 × 180-660 -->
  <path d="M 1240 176 C 1400 176, 1484 260, 1484 420 C 1484 580, 1400 664, 1240 664 C 1080 664, 996 580, 996 420 C 996 260, 1080 176, 1240 176 Z" fill="none" stroke="#EAB308" stroke-width="4" opacity="0.9" transform="translate(-2.13 -3.2) scale(1.008)" transform-origin="1240 420"/>

  <!-- Squircle 480×480 at (1000, 180) -->
  <g transform="translate(830.4 84) scale(0.8)">
    <path d="M 512 120 C 712 120, 812 220, 812 420 C 812 620, 712 720, 512 720 C 312 720, 212 620, 212 420 C 212 220, 312 120, 512 120 Z" fill="url(#tileGrad)"/>
    <g clip-path="url(#squircleClip)">
