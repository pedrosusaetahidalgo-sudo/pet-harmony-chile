  <text x="1240" y="770" font-family="Fredoka, 'Nunito', ui-rounded, system-ui, sans-serif" font-size="74" font-weight="700" text-anchor="middle" letter-spacing="-2">
    <tspan fill="#FFFFFF">Paw Friend</tspan><tspan fill="#EAB308"> · Inversión</tspan>
