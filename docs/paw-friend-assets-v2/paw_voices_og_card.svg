<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Paw Voices — Social OG Card</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF7FB"/>
      <stop offset="100%" stop-color="#FDF2F8"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <clipPath id="squircleClip">
      <path d="M 512 120 C 712 120, 812 220, 812 420 C 812 620, 712 720, 512 720 C 312 720, 212 620, 212 420 C 212 220, 312 120, 512 120 Z"/>
    </clipPath>
    <mask id="heartMask">
      <rect x="-200" y="-200" width="1400" height="1400" fill="white"/>
      <path d="M 512 560 C 504 550, 490 540, 482 530 C 474 520, 477 505, 490 502 C 499 500, 507 505, 512 512 C 517 505, 525 500, 534 502 C 547 505, 550 520, 542 530 C 534 540, 520 550, 512 560 Z" fill="black"/>
    </mask>
    <radialGradient id="violetBlob">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldBlob">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <ellipse cx="1050" cy="140" rx="280" ry="200" fill="url(#violetBlob)"/>
  <ellipse cx="1150" cy="560" rx="260" ry="200" fill="url(#goldBlob)"/>

  <!-- Border soft -->
  <rect x="20" y="20" width="1160" height="590" rx="32" fill="none" stroke="#F9D3EB" stroke-width="2"/>

  <!-- Squircle 240px at (60, 195) -->
  <g transform="translate(-24.8 147) scale(0.4)">
    <path d="M 512 120 C 712 120, 812 220, 812 420 C 812 620, 712 720, 512 720 C 312 720, 212 620, 212 420 C 212 220, 312 120, 512 120 Z" fill="url(#tileGrad)"/>
    <g clip-path="url(#squircleClip)">
      <ellipse cx="512" cy="510" rx="155" ry="135" fill="#FFFFFF" mask="url(#heartMask)"/>
      <ellipse cx="372" cy="350" rx="55" ry="68" transform="rotate(-22 372 350)" fill="#FFFFFF"/>
      <ellipse cx="460" cy="260" rx="50" ry="62" transform="rotate(-10 460 260)" fill="#FFFFFF"/>
      <ellipse cx="564" cy="260" rx="50" ry="62" transform="rotate(10 564 260)" fill="#FFFFFF"/>
      <ellipse cx="652" cy="350" rx="55" ry="68" transform="rotate(22 652 350)" fill="#FFFFFF"/>
      <g stroke="#FFFFFF" fill="none" stroke-linecap="round" stroke-width="18">
        <path d="M 706 275 A 30 30 0 0 1 727 296"/>
        <path d="M 712 251 A 55 55 0 0 1 751 290"/>
        <path d="M 719 227 A 80 80 0 0 1 775 283"/>
      </g>
    </g>
  </g>

  <!-- Brand label arriba -->
  <text x="360" y="250" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="22" font-weight="600" fill="#9333EA" letter-spacing="3">PAW FRIEND · SUB-BRAND</text>

  <!-- Main title -->
  <text x="360" y="330" font-family="Fredoka, 'Nunito', ui-rounded, system-ui, sans-serif" font-size="72" font-weight="700" fill="#1A102B" letter-spacing="-2">Paw Voıces</text>
  <circle cx="485" cy="275" r="7" fill="url(#dotGrad)"/>

  <!-- Subtitle -->
  <text x="360" y="390" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="40" font-weight="500" fill="#6B21A8" letter-spacing="-1">Creadores peludos</text>

  <!-- Descriptor line -->
  <text x="360" y="440" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="22" font-weight="400" fill="#7E22CE" letter-spacing="-0.3">Las historias reales detrás de cada peludo</text>

  <!-- Footer URL -->
  <g transform="translate(60, 555)">
    <rect x="0" y="0" width="12" height="28" rx="6" fill="url(#tileGrad)"/>
    <text x="28" y="22" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="22" font-weight="600" fill="#1A102B" letter-spacing="-0.3">pawfriend.cl/paw-voices</text>
  </g>
</svg>
