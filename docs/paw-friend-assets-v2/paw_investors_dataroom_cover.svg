<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Paw Friend — Data Room Cover</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0618"/>
      <stop offset="50%" stop-color="#1A102B"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A102B"/><stop offset="50%" stop-color="#9333EA"/><stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <radialGradient id="greenAccent" cx="0.85" cy="0.88" r="0.28">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.5"/><stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldWhisper" cx="0.85" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.15"/><stop offset="100%" stop-color="#EAB308" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="squircleClip">
      <path d="M 512 120 C 712 120, 812 220, 812 420 C 812 620, 712 720, 512 720 C 312 720, 212 620, 212 420 C 212 220, 312 120, 512 120 Z"/>
    </clipPath>
    <mask id="arrowMask">
      <rect x="-200" y="-200" width="1400" height="1400" fill="white"/>
      <path d="M 512 488 L 558 534 L 530 534 L 530 572 L 494 572 L 494 534 L 466 534 Z" fill="black"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#goldWhisper)"/>

  <!-- Gold hairline frame (executive border) -->
  <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" stroke="#EAB308" stroke-width="2.5" opacity="0.8"/>
  <rect x="32" y="32" width="1136" height="566" rx="10" fill="none" stroke="#EAB308" stroke-width="1" opacity="0.35"/>

  <!-- Gold hairline around squircle (240×240 at 900, 195) -->
  <path d="M 1020 193 C 1044 193, 1052 201, 1052 225 C 1052 249, 1044 257, 1020 257 C 996 257, 988 249, 988 225 C 988 201, 996 193, 1020 193 Z" fill="none" stroke="#EAB308" stroke-width="3" opacity="0.9" transform="translate(-0.64 -0.96) scale(1.0083)" transform-origin="1020 225"/>

  <!-- Squircle 240×240 right-aligned at (900, 195) -->
  <g transform="translate(815.2 147) scale(0.4)">
    <path d="M 512 120 C 712 120, 812 220, 812 420 C 812 620, 712 720, 512 720 C 312 720, 212 620, 212 420 C 212 220, 312 120, 512 120 Z" fill="url(#tileGrad)"/>
    <g clip-path="url(#squircleClip)">
      <rect x="212" y="120" width="600" height="600" fill="url(#greenAccent)"/>
      <ellipse cx="512" cy="510" rx="155" ry="135" fill="#FFFFFF" mask="url(#arrowMask)"/>
      <ellipse cx="372" cy="350" rx="55" ry="68" transform="rotate(-22 372 350)" fill="#FFFFFF"/>
      <ellipse cx="460" cy="260" rx="50" ry="62" transform="rotate(-10 460 260)" fill="#FFFFFF"/>
      <ellipse cx="564" cy="260" rx="50" ry="62" transform="rotate(10 564 260)" fill="#FFFFFF"/>
      <ellipse cx="652" cy="350" rx="55" ry="68" transform="rotate(22 652 350)" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Left copy -->
  <text x="80" y="180" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="20" font-weight="600" fill="#EAB308" letter-spacing="6">PAW FRIEND · PITCH</text>

  <!-- Main title: "Data Room · Paw Friend" -->
  <text x="80" y="280" font-family="Fredoka, 'Nunito', ui-rounded, system-ui, sans-serif" font-size="76" font-weight="700" fill="#FFFFFF" letter-spacing="-2">Data Room</text>
  <text x="80" y="355" font-family="Fredoka, 'Nunito', ui-rounded, system-ui, sans-serif" font-size="44" font-weight="500" fill="#EAB308" letter-spacing="-1">· Paw Friend</text>

  <!-- Subtitle (English, for international VCs) -->
  <line x1="80" y1="420" x2="260" y2="420" stroke="#EAB308" stroke-width="2"/>
  <text x="80" y="465" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="24" font-weight="600" fill="#EAB308" letter-spacing="4">CONFIDENTIAL</text>
  <text x="80" y="500" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="20" font-weight="500" fill="#FFFFFF" opacity="0.75" letter-spacing="-0.2">for invitees only · no reenviar este enlace</text>

  <!-- Green micro-dot bottom-left (health mission whisper) -->
  <g transform="translate(80, 560)">
    <circle cx="0" cy="0" r="5" fill="#10B981"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.5"/>
    <text x="24" y="5" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="14" font-weight="500" fill="#10B981" letter-spacing="3">MISIÓN · BIENESTAR ANIMAL</text>
  </g>

  <!-- Footer right -->
  <text x="1120" y="560" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="14" font-weight="500" fill="#EAB308" text-anchor="end" opacity="0.7" letter-spacing="3">v.2026.01</text>
</svg>
