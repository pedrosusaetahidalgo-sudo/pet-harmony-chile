<!-- 06_paw_cards.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1242 2688" role="img" aria-label="Paw Cards coleccionables" width="1242" height="2688">
  <title>Paw Cards coleccionables</title>
  <desc>App Store screenshot 6.5" slide 06 — Paw Cards con rarezas y QR.</desc>
  <defs><radialGradient id="ios6bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#fef3c7" stop-opacity="1"/><stop offset="50%" stop-color="#faf5ff" stop-opacity="1"/><stop offset="100%" stop-color="#9333ea" stop-opacity="1"/></radialGradient></defs>
  <rect width="1242" height="2688" fill="url(#ios6bg)"/>
  <!-- Status bar safe area -->
  <rect width="1242" height="80" fill="#1a102b" opacity="0.04"/>
  <rect x="0" y="2608" width="1242" height="80" fill="#1a102b" opacity="0.04"/>
  <!-- Eyebrow pill -->
  <rect x="360" y="180" width="520" height="70" rx="35"
        fill="#ffffff" fill-opacity="0.6" stroke="#9333ea" stroke-opacity="0.35" stroke-width="2"/>
  <text x="621" y="226" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif"
        font-weight="800" font-size="22" letter-spacing="6" fill="#b45309">PAW CARDS · COLECCIONABLES</text>
  <text x="621" y="440" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="112" fill="#1a102b">Cada mascota tiene</text>
  <text x="621" y="570" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="112" fill="#eab308">su Paw Card</text>
  <text x="621" y="700" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="112" fill="#1a102b">única.</text>

  <text x="621" y="820" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif"
        font-weight="500" font-size="38" fill="#4b3b66">Crea, colecciona y comparte cartas de tus peludos.</text>
  <!-- Phone mockup iPhone 15 Pro style -->
  <g transform="translate(301, 900)">
    <rect x="0" y="0" width="640" height="1560" rx="90" fill="#1a102b"/>
    <rect x="20" y="20" width="600" height="1520" rx="75" fill="#ffffff"/>
    <!-- Dynamic island -->
    <rect x="250" y="45" width="140" height="32" rx="16" fill="#1a102b"/>
    
    <!-- Header purple -->
    <rect x="20" y="20" width="600" height="150" rx="75" fill="#9333ea"/>
    <rect x="20" y="100" width="600" height="70" fill="#9333ea"/>
    <text x="320" y="145" text-anchor="middle" font-family="Fredoka, sans-serif"
          font-weight="600" font-size="38" fill="#ffffff">Paw Cards</text>
    <!-- Card centered (holo) -->
    <defs>
      <linearGradient id="ios6holo" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ec4899"/>
        <stop offset="33%" stop-color="#eab308"/>
        <stop offset="66%" stop-color="#10b981"/>
        <stop offset="100%" stop-color="#9333ea"/>
      </linearGradient>
    </defs>
    <rect x="140" y="300" width="360" height="520" rx="30" fill="url(#ios6holo)" opacity="0.25"/>
    <rect x="150" y="310" width="340" height="500" rx="26" fill="#ffffff"/>
    <!-- Photo placeholder -->
    <rect x="175" y="335" width="290" height="280" rx="20" fill="#f3e8ff"/>
    <g transform="translate(320, 475) scale(1.6)">
      <ellipse cx="0" cy="10" rx="18" ry="15" fill="#9333ea"/>
      <ellipse cx="-16" cy="-5" rx="6" ry="8" transform="rotate(-22 -16 -5)" fill="#9333ea"/>
      <ellipse cx="-6" cy="-14" rx="5.5" ry="7" transform="rotate(-10 -6 -14)" fill="#9333ea"/>
      <ellipse cx="6" cy="-14" rx="5.5" ry="7" transform="rotate(10 6 -14)" fill="#9333ea"/>
      <ellipse cx="16" cy="-5" rx="6" ry="8" transform="rotate(22 16 -5)" fill="#9333ea"/>
    </g>
    <!-- Name -->
    <text x="320" y="675" text-anchor="middle" font-family="Fredoka, sans-serif"
          font-weight="600" font-size="36" fill="#1a102b">Kai</text>
    <!-- Rarity badge gold -->
    <rect x="200" y="705" width="240" height="40" rx="20" fill="#eab308"/>
    <text x="320" y="733" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif"
          font-weight="800" font-size="18" letter-spacing="3" fill="#b45309">LEGENDARIA</text>
    <!-- QR -->
    <rect x="265" y="770" width="110" height="110" rx="8" fill="#1a102b"/>
    <g fill="#ffffff">
      <rect x="275" y="780" width="22" height="22"/>
      <rect x="343" y="780" width="22" height="22"/>
      <rect x="275" y="848" width="22" height="22"/>
      <rect x="307" y="812" width="8" height="8"/>
      <rect x="325" y="820" width="8" height="8"/>
      <rect x="315" y="835" width="8" height="8"/>
    </g>
    <!-- CTA button -->
    <rect x="140" y="1100" width="360" height="70" rx="35" fill="#9333ea"/>
    <text x="320" y="1145" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif"
          font-weight="800" font-size="24" fill="#ffffff">Ver colección</text>
  </g>
</svg>
