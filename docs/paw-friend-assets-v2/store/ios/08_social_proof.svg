<!-- 08_social_proof.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1242 2688" role="img" aria-label="Social proof stats y testimonials" width="1242" height="2688">
  <title>Social proof stats y testimonials</title>
  <desc>App Store screenshot 6.5" slide 08 — 3 stat cards + 3 testimonial chips.</desc>
  <defs><radialGradient id="ios8bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#ecfdf5" stop-opacity="1"/><stop offset="100%" stop-color="#f3e8ff" stop-opacity="1"/></radialGradient></defs>
  <rect width="1242" height="2688" fill="url(#ios8bg)"/>
  <!-- Status bar safe area -->
  <rect width="1242" height="80" fill="#1a102b" opacity="0.04"/>
  <rect x="0" y="2608" width="1242" height="80" fill="#1a102b" opacity="0.04"/>
  <!-- Eyebrow pill -->
  <rect x="360" y="180" width="520" height="70" rx="35"
        fill="#ffffff" fill-opacity="0.6" stroke="#9333ea" stroke-opacity="0.35" stroke-width="2"/>
  <text x="621" y="226" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif"
        font-weight="800" font-size="22" letter-spacing="6" fill="#047857">LA COMUNIDAD CRECE</text>
  <text x="621" y="440" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="112" fill="#1a102b">+1.000 mascotas</text>
  <text x="621" y="570" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="112" fill="#10b981">+50 vets</text>
  <text x="621" y="700" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="112" fill="#1a102b">en 30 días.</text>

  <text x="621" y="820" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif"
        font-weight="500" font-size="38" fill="#4b3b66">Crecemos junto a ti, tu peludo y tu vet.</text>
  <!-- Phone mockup iPhone 15 Pro style -->
  <g transform="translate(301, 900)">
    <rect x="0" y="0" width="640" height="1560" rx="90" fill="#1a102b"/>
    <rect x="20" y="20" width="600" height="1520" rx="75" fill="#ffffff"/>
    <!-- Dynamic island -->
    <rect x="250" y="45" width="140" height="32" rx="16" fill="#1a102b"/>
    
    <!-- Header emerald -->
    <rect x="20" y="20" width="600" height="150" rx="75" fill="#10b981"/>
    <rect x="20" y="100" width="600" height="70" fill="#10b981"/>
    <text x="320" y="145" text-anchor="middle" font-family="Fredoka, sans-serif"
          font-weight="600" font-size="38" fill="#ffffff">Comunidad Paw Friend</text>
    <!-- 3 stat cards -->
    <g transform="translate(55, 220)">
      <rect x="0" y="0" width="175" height="175" rx="18" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
      <text x="88" y="80" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="54" fill="#9333ea">1.000</text>
      <text x="88" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16" fill="#4b3b66">mascotas</text>
    </g>
    <g transform="translate(240, 220)">
      <rect x="0" y="0" width="160" height="175" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
      <text x="80" y="80" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="54" fill="#047857">+50</text>
      <text x="80" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16" fill="#4b3b66">vets activos</text>
    </g>
    <g transform="translate(410, 220)">
      <rect x="0" y="0" width="175" height="175" rx="18" fill="#fef3c7" stroke="#eab308" stroke-width="1" stroke-opacity="0.3"/>
      <text x="88" y="80" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="54" fill="#b45309">4.8★</text>
      <text x="88" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16" fill="#4b3b66">rating</text>
    </g>
    <!-- Testimonial chips -->
    <g transform="translate(55, 460)">
      <rect x="0" y="0" width="530" height="105" rx="14" fill="#ffffff" stroke="#e9d5ff" stroke-width="1"/>
      <circle cx="40" cy="52" r="24" fill="#9333ea"/>
      <text x="40" y="60" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#ffffff">P</text>
      <text x="80" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" fill="#1a102b">Paloma · dueña</text>
      <text x="80" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-style="italic" font-size="16" fill="#4b3b66">"Por fin tengo todo en un lugar."</text>
    </g>
    <g transform="translate(55, 585)">
      <rect x="0" y="0" width="530" height="105" rx="14" fill="#ffffff" stroke="#e9d5ff" stroke-width="1"/>
      <circle cx="40" cy="52" r="24" fill="#eab308"/>
      <text x="40" y="60" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#b45309">S</text>
      <text x="80" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" fill="#1a102b">Sofía · dueña</text>
      <text x="80" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-style="italic" font-size="16" fill="#4b3b66">"Mis vets acá trabajan súper bien."</text>
    </g>
    <g transform="translate(55, 710)">
      <rect x="0" y="0" width="530" height="105" rx="14" fill="#ffffff" stroke="#e9d5ff" stroke-width="1"/>
      <circle cx="40" cy="52" r="24" fill="#10b981"/>
      <text x="40" y="60" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#ffffff">M</text>
      <text x="80" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" fill="#1a102b">Dra. Muñoz · vet</text>
      <text x="80" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-style="italic" font-size="16" fill="#4b3b66">"Pacientes llegan con historial completo."</text>
    </g>
    <!-- Bottom CTA -->
    <rect x="55" y="860" width="530" height="80" rx="40" fill="#9333ea"/>
    <text x="320" y="912" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif"
          font-weight="800" font-size="26" fill="#ffffff">Sumate gratis</text>
  </g>
</svg>
