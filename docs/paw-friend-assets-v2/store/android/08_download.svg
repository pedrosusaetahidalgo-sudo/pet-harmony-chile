  <defs><radialGradient id="and8" cx="50%" cy="40%" r="75%"><stop offset="0%" stop-color="#faf5ff"/><stop offset="100%" stop-color="#fef3c7"/></radialGradient></defs>
  <rect width="1080" height="1920" fill="url(#and8)"/>
  <rect x="290" y="170" width="500" height="54" rx="27" fill="#9333ea"/>
  <text x="540" y="206" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif"
