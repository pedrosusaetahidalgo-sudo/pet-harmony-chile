      <polygon points="6,3 7,5 9,5 7.5,7 8,9 6,8 4,9 4.5,7 3,5 5,5" fill="#ffffff"/>
      <text x="52" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#ffffff" fill-opacity="0.75">Hecho con amor en Chile</text>
