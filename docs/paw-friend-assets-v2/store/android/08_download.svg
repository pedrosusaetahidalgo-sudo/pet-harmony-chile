      <text x="70" y="55" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="12" fill="#ffffff" fill-opacity="0.7">mascotas</text>

      <text x="240" y="30" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="36" fill="#fde68a">+50</text>
