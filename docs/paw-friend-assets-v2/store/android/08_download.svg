<!-- 08_download.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-label="Android slide 08 · Download CTA" width="1080" height="1920">
  <title>Android slide 08 · Download CTA</title>
