      <circle cx="520" cy="180" r="4"/>
      <circle cx="120" cy="550" r="3"/>
      <circle cx="480" cy="700" r="3"/>
      <circle cx="60" cy="900" r="4"/>
      <circle cx="540" cy="980" r="3"/>
    </g>

    <!-- Mega isotipo hero -->
    <g transform="translate(300, 380)">
      <rect x="-140" y="-140" width="280" height="280" rx="62" fill="#ffffff"/>
      <g transform="translate(0, 5) scale(0.35)">
