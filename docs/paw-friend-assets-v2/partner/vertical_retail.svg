<!-- vertical_retail.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-label="Paw Friend Partner Kit · Retail &amp; Pet shop" width="1080" height="1350">
  <title>Paw Friend Partner Kit · Retail &amp; Pet shop</title>
  <desc>Partner kit card para vertical retail. Value proposition + CTA + contacto.</desc>
  <defs><linearGradient id="prt2-retail" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ec4899" stop-opacity="1"/><stop offset="100%" stop-color="#2a1046" stop-opacity="1"/></linearGradient></defs>
  <rect width="1080" height="1350" fill="url(#prt2-retail)"/>

  <!-- Header brand -->
  <rect x="60" y="80" width="260" height="64" rx="32" fill="#ffffff"/>
  <g transform="translate(98, 112)">
    <rect x="-20" y="-20" width="40" height="40" rx="9" fill="#ec4899"/>
    <g transform="translate(0, 2) scale(0.04)"><ellipse cx="340" cy="430" rx="155" ry="135" fill="#ffffff"/>
<ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)" fill="#ffffff"/>
<ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)" fill="#ffffff"/>
<ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)" fill="#ffffff"/>
<ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)" fill="#ffffff"/></g>
  </g>
  <text x="145" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#ec4899">Paw Friend</text>

  <!-- Vertical tag -->
  <rect x="760" y="80" width="260" height="64" rx="32" fill="#eab308"/>
  <text x="890" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" letter-spacing="4" fill="#1a102b">RETAIL</text>

  <!-- Title -->
  <text x="540" y="270" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="72" fill="#ffffff">Retail &amp; Pet shop</text>
  <text x="540" y="340" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="28" fill="#ffffff" fill-opacity="0.85">Tiendas físicas y e-commerce</text>

  <!-- Icon hero squircle -->
  <g transform="translate(390, 450)">
    <rect x="0" y="0" width="300" height="300" rx="65" fill="#ffffff" fill-opacity="0.12"/>
    <g transform="translate(50, 50) scale(1.0)">
      <path d="M 100 10 C 170 10, 190 30, 190 100 C 190 170, 170 190, 100 190 C 30 190, 10 170, 10 100 C 10 30, 30 10, 100 10 Z" fill="#ffffff" fill-opacity="0.2"/>
      <!-- Gift/box icon -->
         <rect x="55" y="90" width="90" height="65" fill="#ffffff"/>
         <rect x="95" y="90" width="10" height="65" fill="#be185d"/>
         <rect x="55" y="115" width="90" height="10" fill="#be185d"/>
         <path d="M 100 90 L 82 65 Q 70 62 70 78 Q 70 88 88 90 L 100 90 L 112 90 Q 130 88 130 78 Q 130 62 118 65 Z" fill="#ffffff"/>
    </g>
  </g>

  <!-- Value prop -->
  <rect x="80" y="820" width="920" height="180" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="110" y="865" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" letter-spacing="3" fill="#eab308">POR QUÉ SUMARTE</text>
  <text x="110" y="910" font-family="Fredoka, sans-serif" font-weight="500" font-size="24" fill="#ffffff">Promos segmentadas por tipo de mascota. Pop-ups en directorio vet y ho</text>
  <text x="110" y="945" font-family="Fredoka, sans-serif" font-weight="500" font-size="24" fill="#ffffff">me digital.</text>

  <!-- CTA -->
  <rect x="340" y="1080" width="400" height="90" rx="45" fill="#ffffff"/>
  <text x="540" y="1135" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="26" fill="#ec4899">Conversemos →</text>

  <!-- Footer -->
  <text x="540" y="1230" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="14" fill="#ffffff" fill-opacity="0.65">pedrosusaeta@pawfriend.cl · pawfriend.cl</text>
  <text x="540" y="1260" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#ffffff" fill-opacity="0.5">SpA SUSAETA GARNHAM SOFTWARE ENGINEERING · RUT 78.328.659-9</text>
