<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" width="680" height="680" role="img" aria-label="Paw Friend icon gold variant">
  <title>Paw Friend · Icon gold (Paw Member / celebración)</title>
  <desc>Variante premium del isotipo con gradient purple-gold. Reservada para momentos de celebración, badge Paw Member y hero moments.</desc>
  <defs>
    <linearGradient id="gold-main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9333EA"/>
      <stop offset="0.55" stop-color="#D946EF"/>
      <stop offset="1" stop-color="#EAB308"/>
    </linearGradient>
    <clipPath id="squircle-gold">
