      <path d="M 340 480 C 332 470, 318 460, 310 450 C 302 440, 305 425, 318 422 C 327 420, 335 425, 340 432 C 345 425, 353 420, 362 422 C 375 425, 378 440, 370 450 C 362 460, 348 470, 340 480 Z" fill="black"/>
    </mask>
  </defs>
  <path d="M 340 40 C 540 40, 640 140, 640 340 C 640 540, 540 640, 340 640 C 140 640, 40 540, 40 340 C 40 140, 140 40, 340 40 Z" fill="url(#gold-main)"/>
  <g clip-path="url(#squircle-gold)">
    <ellipse cx="340" cy="430" rx="155" ry="135" fill="#FFFFFF" mask="url(#heart-mask-gold)"/>
    <ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)" fill="#FFFFFF"/>
    <ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)" fill="#FFFFFF"/>
    <ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)" fill="#FFFFFF"/>
    <ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)" fill="#FFFFFF"/>
  </g>
</svg>
