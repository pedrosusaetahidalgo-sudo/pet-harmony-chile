<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <title>Paw Voices — Email Header Strip</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="pawColor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <clipPath id="squircleClip">
      <path d="M 512 120 C 712 120, 812 220, 812 420 C 812 620, 712 720, 512 720 C 312 720, 212 620, 212 420 C 212 220, 312 120, 512 120 Z"/>
    </clipPath>
    <mask id="heartMask">
      <rect x="-200" y="-200" width="1400" height="1400" fill="white"/>
      <path d="M 512 560 C 504 550, 490 540, 482 530 C 474 520, 477 505, 490 502 C 499 500, 507 505, 512 512 C 517 505, 525 500, 534 502 C 547 505, 550 520, 542 530 C 534 540, 520 550, 512 560 Z" fill="black"/>
    </mask>
  </defs>

  <!-- Full-width gradient bg -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>

  <!-- Subtle radial ambient on right -->
  <radialGradient id="softRight" cx="0.85" cy="0.5" r="0.6">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="360" fill="url(#softRight)"/>

  <!-- White squircle 180px at (90, 90) - paw en violeta/pink para contraste sobre white -->
  <g transform="translate(26.4 54) scale(0.3)">
    <path d="M 512 120 C 712 120, 812 220, 812 420 C 812 620, 712 720, 512 720 C 312 720, 212 620, 212 420 C 212 220, 312 120, 512 120 Z" fill="#FFFFFF"/>
    <g clip-path="url(#squircleClip)">
      <ellipse cx="512" cy="510" rx="155" ry="135" fill="url(#pawColor)" mask="url(#heartMask)"/>
      <ellipse cx="372" cy="350" rx="55" ry="68" transform="rotate(-22 372 350)" fill="url(#pawColor)"/>
      <ellipse cx="460" cy="260" rx="50" ry="62" transform="rotate(-10 460 260)" fill="url(#pawColor)"/>
      <ellipse cx="564" cy="260" rx="50" ry="62" transform="rotate(10 564 260)" fill="url(#pawColor)"/>
      <ellipse cx="652" cy="350" rx="55" ry="68" transform="rotate(22 652 350)" fill="url(#pawColor)"/>
      <g stroke="#9333EA" fill="none" stroke-linecap="round" stroke-width="18">
        <path d="M 706 275 A 30 30 0 0 1 727 296"/>
        <path d="M 712 251 A 55 55 0 0 1 751 290"/>
        <path d="M 719 227 A 80 80 0 0 1 775 283"/>
      </g>
    </g>
  </g>

  <!-- Wordmark white on gradient -->
  <text x="310" y="180" font-family="Fredoka, 'Nunito', ui-rounded, system-ui, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF" letter-spacing="-2">Paw Voıces</text>
  <circle cx="437" cy="130" r="9" fill="#FFFFFF"/>
  <circle cx="437" cy="130" r="6" fill="#FBBF24"/>

  <!-- Descriptor -->
  <text x="310" y="230" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="26" font-weight="500" fill="#FFFFFF" opacity="0.9" letter-spacing="0.5">Creadores peludos · Paw Friend</text>

  <!-- Gold hairline bottom 4px -->
  <rect x="0" y="356" width="1200" height="4" fill="#FBBF24"/>
</svg>
