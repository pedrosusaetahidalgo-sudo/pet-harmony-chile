<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <title>Paw Friend · Inversión — Section Divider</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A102B"/>
      <stop offset="70%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A102B"/><stop offset="50%" stop-color="#9333EA"/><stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <radialGradient id="greenAccent" cx="0.85" cy="0.88" r="0.28">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.5"/><stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="0.1" cy="0.9" r="0.4">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.2"/><stop offset="100%" stop-color="#EAB308" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="squircleClip">
      <path d="M 512 120 C 712 120, 812 220, 812 420 C 812 620, 712 720, 512 720 C 312 720, 212 620, 212 420 C 212 220, 312 120, 512 120 Z"/>
    </clipPath>
    <mask id="arrowMask">
      <rect x="-200" y="-200" width="1400" height="1400" fill="white"/>
      <path d="M 512 488 L 558 534 L 530 534 L 530 572 L 494 572 L 494 534 L 466 534 Z" fill="black"/>
    </mask>
  </defs>

  <rect width="2560" height="1440" fill="url(#bgGrad)"/>
  <rect width="2560" height="1440" fill="url(#goldGlow)"/>

  <!-- Mini squircle top-right 120px at (2400, 80) -->
  <path d="M 2400 76 C 2462 76, 2484 98, 2484 160 C 2484 222, 2462 244, 2400 244 C 2338 244, 2316 222, 2316 160 C 2316 98, 2338 76, 2400 76 Z" fill="none" stroke="#EAB308" stroke-width="2" opacity="0.9"/>

  <g transform="translate(2357.6 56) scale(0.2)">
    <path d="M 512 120 C 712 120, 812 220, 812 420 C 812 620, 712 720, 512 720 C 312 720, 212 620, 212 420 C 212 220, 312 120, 512 120 Z" fill="url(#tileGrad)"/>
    <g clip-path="url(#squircleClip)">
      <rect x="212" y="120" width="600" height="600" fill="url(#greenAccent)"/>
      <ellipse cx="512" cy="510" rx="155" ry="135" fill="#FFFFFF" mask="url(#arrowMask)"/>
      <ellipse cx="372" cy="350" rx="55" ry="68" transform="rotate(-22 372 350)" fill="#FFFFFF"/>
      <ellipse cx="460" cy="260" rx="50" ry="62" transform="rotate(-10 460 260)" fill="#FFFFFF"/>
      <ellipse cx="564" cy="260" rx="50" ry="62" transform="rotate(10 564 260)" fill="#FFFFFF"/>
      <ellipse cx="652" cy="350" rx="55" ry="68" transform="rotate(22 652 350)" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Section number marker left -->
  <rect x="160" y="620" width="6" height="180" fill="#EAB308"/>

  <!-- SECTION N label in gold 40pt -->
  <text x="220" y="680" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="40" font-weight="600" fill="#EAB308" letter-spacing="10">SECCIÓN 01</text>
  <text x="220" y="725" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="22" font-weight="500" fill="#EAB308" opacity="0.7" letter-spacing="4">SECTION ONE · EN</text>

  <!-- Big section title white 120pt -->
  <text x="220" y="900" font-family="Fredoka, 'Nunito', ui-rounded, system-ui, sans-serif" font-size="160" font-weight="700" fill="#FFFFFF" letter-spacing="-5">[ Título de sección ]</text>

  <!-- Subtitle / English pair -->
  <text x="220" y="970" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="36" font-weight="500" fill="#FFFFFF" opacity="0.55" letter-spacing="-0.5">[ English subtitle slot for international VCs ]</text>

  <!-- Bottom gold hairline accent -->
  <line x1="220" y1="1330" x2="520" y2="1330" stroke="#EAB308" stroke-width="2"/>
  <text x="220" y="1380" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="20" font-weight="500" fill="#EAB308" opacity="0.7" letter-spacing="4">PAW FRIEND · INVERSIÓN</text>
</svg>
