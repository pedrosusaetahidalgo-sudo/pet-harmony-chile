<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <title>Paw Vets — IG "Control Pendiente"</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FDFA"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="amberPlus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/><stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <clipPath id="squircleClip">
      <path d="M 512 120 C 712 120, 812 220, 812 420 C 812 620, 712 720, 512 720 C 312 720, 212 620, 212 420 C 212 220, 312 120, 512 120 Z"/>
    </clipPath>
    <mask id="crossMask">
      <rect x="-200" y="-200" width="1400" height="1400" fill="white"/>
      <path d="M 506 510 H 518 V 524 H 532 V 536 H 518 V 550 H 506 V 536 H 492 V 524 H 506 Z" fill="black"/>
    </mask>
  </defs>

  <rect width="1080" height="1080" fill="url(#bgGrad)"/>

  <!-- "CONTROL PENDIENTE" badge top -->
  <g transform="translate(540, 70)">
    <rect x="-180" y="0" width="360" height="44" rx="22" fill="#0F766E"/>
    <text x="0" y="30" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="5">CONTROL PENDIENTE</text>
  </g>

  <!-- Small Paw Vets squircle top center (160px at x=460, y=140) -->
  <g transform="translate(403.46 97.33) scale(0.2667)">
    <path d="M 512 120 C 712 120, 812 220, 812 420 C 812 620, 712 720, 512 720 C 312 720, 212 620, 212 420 C 212 220, 312 120, 512 120 Z" fill="url(#tileGrad)"/>
    <g clip-path="url(#squircleClip)">
      <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.55">
        <path d="M 250 540 Q 250 695, 390 715"/>
        <circle cx="390" cy="715" r="11" stroke-width="4" fill="#FFFFFF" fill-opacity="0.15"/>
      </g>
      <ellipse cx="512" cy="510" rx="155" ry="135" fill="#FFFFFF" mask="url(#crossMask)"/>
      <ellipse cx="372" cy="350" rx="55" ry="68" transform="rotate(-22 372 350)" fill="#FFFFFF"/>
      <ellipse cx="460" cy="260" rx="50" ry="62" transform="rotate(-10 460 260)" fill="#FFFFFF"/>
      <ellipse cx="564" cy="260" rx="50" ry="62" transform="rotate(10 564 260)" fill="#FFFFFF"/>
      <ellipse cx="652" cy="350" rx="55" ry="68" transform="rotate(22 652 350)" fill="#FFFFFF"/>
      <circle cx="755" cy="190" r="14" fill="#9333EA"/>
      <circle cx="755" cy="190" r="22" fill="none" stroke="#9333EA" stroke-width="3" opacity="0.4"/>
    </g>
  </g>

  <!-- BG paw (just shapes) at 20% behind the + -->
  <g opacity="0.2">
    <g transform="translate(163.4 190) scale(0.833)">
      <ellipse cx="512" cy="510" rx="155" ry="135" fill="#F59E0B"/>
      <ellipse cx="372" cy="350" rx="55" ry="68" transform="rotate(-22 372 350)" fill="#F59E0B"/>
      <ellipse cx="460" cy="260" rx="50" ry="62" transform="rotate(-10 460 260)" fill="#F59E0B"/>
      <ellipse cx="564" cy="260" rx="50" ry="62" transform="rotate(10 564 260)" fill="#F59E0B"/>
      <ellipse cx="652" cy="350" rx="55" ry="68" transform="rotate(22 652 350)" fill="#F59E0B"/>
    </g>
  </g>

  <!-- Big amber "+" 280px centered at (540, 540) -->
  <g>
    <rect x="400" y="510" width="280" height="60" rx="10" fill="url(#amberPlus)"/>
    <rect x="510" y="400" width="60" height="280" rx="10" fill="url(#amberPlus)"/>
  </g>

  <!-- Copy primary -->
  <text x="540" y="820" font-family="Fredoka, 'Nunito', ui-rounded, system-ui, sans-serif" font-size="56" font-weight="700" fill="#064E3B" text-anchor="middle" letter-spacing="-1.5">Agenda tu control</text>
  <!-- Copy secondary -->
  <text x="540" y="890" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="30" font-weight="500" fill="#065F46" text-anchor="middle" letter-spacing="-0.5">Tu vet te espera en Paw Friend</text>

  <!-- Footer -->
  <text x="540" y="1000" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="22" font-weight="600" fill="#0F766E" text-anchor="middle" letter-spacing="4">PAWFRIEND.CL/PARA-VETERINARIOS</text>
</svg>
