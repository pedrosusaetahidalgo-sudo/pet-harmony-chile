<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Paw Partners — Social OG Card</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7FDFB"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/><stop offset="50%" stop-color="#14B8A6"/><stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="0.2" cy="0.2" r="0.55">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.55"/><stop offset="60%" stop-color="#9333EA" stop-opacity="0.1"/><stop offset="100%" stop-color="#9333EA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetOrb">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.18"/><stop offset="100%" stop-color="#9333EA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dotGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9333EA"/><stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <clipPath id="squircleClip">
      <path d="M 512 120 C 712 120, 812 220, 812 420 C 812 620, 712 720, 512 720 C 312 720, 212 620, 212 420 C 212 220, 312 120, 512 120 Z"/>
    </clipPath>
    <mask id="heartMask">
      <rect x="-200" y="-200" width="1400" height="1400" fill="white"/>
      <path d="M 512 560 C 504 550, 490 540, 482 530 C 474 520, 477 505, 490 502 C 499 500, 507 505, 512 512 C 517 505, 525 500, 534 502 C 547 505, 550 520, 542 530 C 534 540, 520 550, 512 560 Z" fill="black"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <ellipse cx="1050" cy="140" rx="280" ry="200" fill="url(#violetOrb)"/>

  <!-- ⇄ arrows ambient bg (full-width) -->
  <g stroke="#10B981" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.15">
    <path d="M 1130 310 L 360 310"/>
    <path d="M 390 295 L 360 310 L 390 325"/>
    <path d="M 360 350 L 1130 350"/>
    <path d="M 1100 335 L 1130 350 L 1100 365"/>
  </g>

  <rect x="20" y="20" width="1160" height="590" rx="32" fill="none" stroke="#CFFCE0" stroke-width="2"/>

  <!-- Squircle 240px at (60, 195) -->
  <g transform="translate(-24.8 147) scale(0.4)">
    <path d="M 512 120 C 712 120, 812 220, 812 420 C 812 620, 712 720, 512 720 C 312 720, 212 620, 212 420 C 212 220, 312 120, 512 120 Z" fill="url(#tileGrad)"/>
    <g clip-path="url(#squircleClip)">
      <rect x="212" y="120" width="600" height="600" fill="url(#violetGlow)"/>
      <g stroke="#FFFFFF" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.38">
        <path d="M 744 455 L 280 455"/>
        <path d="M 305 438 L 280 455 L 305 472"/>
        <path d="M 280 575 L 744 575"/>
        <path d="M 719 558 L 744 575 L 719 592"/>
      </g>
      <ellipse cx="512" cy="510" rx="155" ry="135" fill="#FFFFFF" mask="url(#heartMask)"/>
      <ellipse cx="372" cy="350" rx="55" ry="68" transform="rotate(-22 372 350)" fill="#FFFFFF"/>
      <ellipse cx="460" cy="260" rx="50" ry="62" transform="rotate(-10 460 260)" fill="#FFFFFF"/>
      <ellipse cx="564" cy="260" rx="50" ry="62" transform="rotate(10 564 260)" fill="#FFFFFF"/>
      <ellipse cx="652" cy="350" rx="55" ry="68" transform="rotate(22 652 350)" fill="#FFFFFF"/>
    </g>
  </g>

  <text x="360" y="240" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="22" font-weight="600" fill="#10B981" letter-spacing="4">PAW FRIEND · SUB-BRAND</text>

  <!-- Main title "Paw Partners" with violet dot on "a" of Partners -->
  <text x="360" y="320" font-family="Fredoka, 'Nunito', ui-rounded, system-ui, sans-serif" font-size="68" font-weight="700" fill="#10B981" letter-spacing="-2">Paw Partners</text>
  <circle cx="516" cy="272" r="9" fill="url(#dotGrad)"/>

  <!-- Subtitle -->
  <text x="360" y="390" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="36" font-weight="500" fill="#065F46" letter-spacing="-1">Red de aliados chilenos</text>

  <text x="360" y="440" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="22" font-weight="400" fill="#0F766E" letter-spacing="-0.2">Tiendas, restaurantes, seguros y más — todo para tu peludo</text>

  <g transform="translate(60, 555)">
    <rect x="0" y="0" width="12" height="28" rx="6" fill="url(#tileGrad)"/>
    <text x="28" y="22" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="22" font-weight="600" fill="#1A102B" letter-spacing="-0.3">pawfriend.cl/paw-partners</text>
  </g>
</svg>
