    <!--
      Content Security Policy (CSP) — defensive XSS hardening.
      2026-04-30: cierra hallazgo amarillo del production readiness doc.

      Decisiones:
      - default-src 'self': bloquea cualquier recurso no listado abajo
      - script-src 'self' 'unsafe-inline': inline scripts necesarios para el
        SPA redirect handler + Vite import.meta. 'unsafe-eval' NO incluido
        (Vite produccion no lo necesita).
      - connect-src: Supabase + Flow + PostHog + Sentry + Anthropic
        (b2b-api edge fn) + GitHub Pages dominios + apis usadas
      - img-src 'self' data: blob: https:: imagenes pet upload + assets externos
      - frame-src: Flow checkout + YouTube embeds (futuro Paw Voices)
      - upgrade-insecure-requests: forzar HTTPS para todo

      Si rompe algo en prod, hay que ajustar la directiva relevante.
      Test en dev: navegador devtools console mostrara CSP violations.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://us.i.posthog.com https://us-assets.i.posthog.com https://www.googletagmanager.com https://connect.facebook.net https://*.firebase.com https://*.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://gwailbjlvevkhwcrovfd.supabase.co wss://gwailbjlvevkhwcrovfd.supabase.co https://www.flow.cl https://us.i.posthog.com https://us-assets.i.posthog.com https://*.sentry.io https://*.ingest.sentry.io https://*.firebase.com https://*.googleapis.com https://api.anthropic.com https://www.facebook.com; frame-src 'self' https://www.flow.cl https://www.youtube.com https://player.vimeo.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://www.flow.cl; upgrade-insecure-requests" />

  <body>
    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <div id="root"></div>
  </body>
