<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1242 2688" width="1242" height="2688" role="img" aria-label="App Store screenshot 1 — Hero ficha PDF">
  <title>App Store iPhone 6.5" · Slide 1 hero · Ficha PDF</title>
  <desc>Screenshot template 1242×2688 para App Store iOS. Slide 1: hero con tagline principal y mockup de ficha.</desc>
  <defs>
    <radialGradient id="as1-bg" cx="0.5" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.4" stop-color="#f3e8ff"/>
      <stop offset="1" stop-color="#581c87"/>
    </radialGradient>
    <linearGradient id="as1-title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="as1-phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1046"/>
      <stop offset="1" stop-color="#581c87"/>
    </linearGradient>
  </defs>
  <rect width="1242" height="2688" fill="url(#as1-bg)"/>
  <!-- iPhone status bar safe area (top 80px) -->
  <rect x="0" y="0" width="1242" height="80" fill="rgba(255,255,255,0.08)"/>
  <!-- Eyebrow -->
  <g transform="translate(621 220)">
    <rect x="-180" y="-30" width="360" height="60" rx="30" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <circle cx="-140" cy="0" r="10" fill="#eab308"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="22" fill="#ffffff" letter-spacing="6">PAW FRIEND · HECHO EN CHILE</text>
  </g>
  <!-- Title -->
  <text x="621" y="440" text-anchor="middle" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="112" fill="#1a102b" letter-spacing="-4">La ficha médica</text>
  <text x="621" y="570" text-anchor="middle" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="112" letter-spacing="-4">
    <tspan fill="#1a102b">de tu mascota,</tspan>
  </text>
  <text x="621" y="700" text-anchor="middle" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="112" fill="#9333ea" letter-spacing="-4">siempre contigo.</text>
  <!-- Subtitle -->
  <text x="621" y="820" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="38" fill="#4b3b66">Descarga el PDF en 1 click. Gratis, para siempre.</text>
  <!-- iPhone mockup -->
  <g transform="translate(621 1700)">
    <!-- Phone body -->
    <rect x="-340" y="-820" width="680" height="1560" rx="90" fill="url(#as1-phone)"/>
    <rect x="-310" y="-780" width="620" height="1480" rx="58" fill="#ffffff"/>
    <!-- Notch / dynamic island -->
    <rect x="-90" y="-800" width="180" height="28" rx="14" fill="#1a102b"/>
    <!-- Screen content: ficha -->
    <rect x="-290" y="-740" width="580" height="140" rx="32" fill="#9333ea"/>
    <text x="-260" y="-680" font-family="'Fredoka',sans-serif" font-weight="600" font-size="42" fill="#ffffff">Ficha · Kai</text>
    <text x="-260" y="-640" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="24" fill="rgba(255,255,255,0.85)">Pastor suizo · 4 años · 32 kg</text>
    <circle cx="240" cy="-670" r="50" fill="#ffffff"/>
    <ellipse cx="240" cy="-654" rx="22" ry="17" fill="#9333ea"/>
    <ellipse cx="210" cy="-690" rx="8" ry="12" transform="rotate(-18 210 -690)" fill="#9333ea"/>
    <ellipse cx="227" cy="-706" rx="7" ry="10" transform="rotate(-6 227 -706)" fill="#9333ea"/>
    <ellipse cx="253" cy="-706" rx="7" ry="10" transform="rotate(6 253 -706)" fill="#9333ea"/>
    <ellipse cx="270" cy="-690" rx="8" ry="12" transform="rotate(18 270 -690)" fill="#9333ea"/>
    <!-- Vaccines card -->
    <rect x="-290" y="-570" width="580" height="180" rx="28" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
    <text x="-260" y="-530" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="20" fill="#047857" letter-spacing="3">VACUNAS AL DÍA</text>
    <circle cx="-230" cy="-470" r="22" fill="#10b981"/>
    <path d="M-240 -470 L-232 -462 L-218 -478" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="-185" y="-462" font-family="'Fredoka',sans-serif" font-weight="600" font-size="30" fill="#047857">Séxtuple · 15 mar 2026</text>
    <text x="-185" y="-430" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="22" fill="#047857" opacity=".7">Próximo refuerzo: mar 2027</text>
    <!-- Next control card -->
    <rect x="-290" y="-360" width="580" height="160" rx="28" fill="#fef3c7" stroke="#eab308" stroke-width="3"/>
    <text x="-260" y="-320" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="20" fill="#b45309" letter-spacing="3">PRÓXIMO CONTROL</text>
    <text x="-260" y="-270" font-family="'Fredoka',sans-serif" font-weight="600" font-size="42" fill="#b45309">En 14 días</text>
    <text x="-260" y="-230" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="22" fill="#78350f">Antiparasitario interno</text>
    <!-- Download CTA -->
    <rect x="-200" y="-160" width="400" height="110" rx="55" fill="#9333ea"/>
    <text x="0" y="-88" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="32" fill="#ffffff">DESCARGAR PDF</text>
    <!-- Bottom nav -->
    <rect x="-310" y="620" width="620" height="90" fill="#faf5ff"/>
    <line x1="-310" y1="620" x2="310" y2="620" stroke="#e9d5ff" stroke-width="1"/>
    <g font-family="'Plus Jakarta Sans',sans-serif" font-weight="600" font-size="14" fill="#9333ea">
      <circle cx="-220" cy="660" r="14" fill="#9333ea"/>
      <circle cx="-110" cy="660" r="10" fill="none" stroke="#9333ea" stroke-width="2"/>
      <circle cx="0" cy="660" r="10" fill="none" stroke="#9333ea" stroke-width="2"/>
      <circle cx="110" cy="660" r="10" fill="none" stroke="#9333ea" stroke-width="2"/>
      <circle cx="220" cy="660" r="10" fill="none" stroke="#9333ea" stroke-width="2"/>
    </g>
    <!-- Home indicator -->
    <rect x="-70" y="700" width="140" height="4" rx="2" fill="#1a102b" opacity=".3"/>
  </g>
  <!-- iPhone bottom safe area (last 80px) -->
  <rect x="0" y="2608" width="1242" height="80" fill="rgba(255,255,255,0.08)"/>
</svg>
