<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1242 2208" width="1242" height="2208" role="img" aria-label="App Store 5.5 inch screenshot 1 hero">
  <title>App Store iPhone 5.5" · Slide 1 hero · Ficha PDF</title>
  <desc>Screenshot 1242×2208 para iPhone 8 Plus y anteriores. Variante 5.5" de la slide hero de App Store.</desc>
  <defs>
    <radialGradient id="as55-bg" cx="0.5" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.4" stop-color="#f3e8ff"/>
      <stop offset="1" stop-color="#581c87"/>
    </radialGradient>
    <linearGradient id="as55-phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1046"/>
      <stop offset="1" stop-color="#581c87"/>
    </linearGradient>
  </defs>
  <rect width="1242" height="2208" fill="url(#as55-bg)"/>
  <rect x="0" y="0" width="1242" height="70" fill="rgba(255,255,255,0.08)"/>
  <!-- Eyebrow -->
  <g transform="translate(621 180)">
    <rect x="-180" y="-28" width="360" height="56" rx="28" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <circle cx="-140" cy="0" r="9" fill="#eab308"/>
    <text x="10" y="7" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="20" fill="#ffffff" letter-spacing="5">PAW FRIEND · HECHO EN CHILE</text>
  </g>
  <!-- Title -->
  <text x="621" y="370" text-anchor="middle" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="96" fill="#1a102b" letter-spacing="-3.5">La ficha médica</text>
  <text x="621" y="480" text-anchor="middle" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="96" fill="#1a102b" letter-spacing="-3.5">de tu mascota,</text>
  <text x="621" y="590" text-anchor="middle" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="96" fill="#9333ea" letter-spacing="-3.5">siempre contigo.</text>
  <text x="621" y="680" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="34" fill="#4b3b66">Descarga el PDF en 1 click · Gratis, para siempre.</text>
  <!-- iPhone 5.5" mockup (iPhone 6/7/8 Plus style with bezels + home button) -->
  <g transform="translate(621 1400)">
    <rect x="-320" y="-720" width="640" height="1440" rx="70" fill="url(#as55-phone)"/>
    <rect x="-290" y="-620" width="580" height="1240" rx="6" fill="#ffffff"/>
    <!-- Speaker -->
    <rect x="-40" y="-670" width="80" height="8" rx="4" fill="#4b3b66"/>
    <!-- Camera -->
    <circle cx="-90" cy="-666" r="6" fill="#4b3b66"/>
    <!-- Home button -->
    <circle cx="0" cy="660" r="38" fill="none" stroke="#4b3b66" stroke-width="3"/>
    <!-- Screen content -->
    <rect x="-270" y="-590" width="540" height="130" rx="30" fill="#9333ea"/>
    <text x="-240" y="-525" font-family="'Fredoka',sans-serif" font-weight="600" font-size="40" fill="#ffffff">Ficha · Kai</text>
    <text x="-240" y="-485" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="22" fill="rgba(255,255,255,0.85)">Pastor suizo · 4 años · 32 kg</text>
    <circle cx="220" cy="-515" r="48" fill="#ffffff"/>
    <ellipse cx="220" cy="-500" rx="20" ry="16" fill="#9333ea"/>
    <ellipse cx="192" cy="-540" rx="8" ry="11" transform="rotate(-18 192 -540)" fill="#9333ea"/>
    <ellipse cx="208" cy="-556" rx="7" ry="10" transform="rotate(-6 208 -556)" fill="#9333ea"/>
    <ellipse cx="232" cy="-556" rx="7" ry="10" transform="rotate(6 232 -556)" fill="#9333ea"/>
    <ellipse cx="248" cy="-540" rx="8" ry="11" transform="rotate(18 248 -540)" fill="#9333ea"/>
    <!-- Vaccines card -->
    <rect x="-270" y="-430" width="540" height="170" rx="26" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
    <text x="-240" y="-390" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="19" fill="#047857" letter-spacing="3">VACUNAS AL DÍA</text>
    <circle cx="-210" cy="-330" r="22" fill="#10b981"/>
    <path d="M-220 -330 L-213 -322 L-200 -338" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="-170" y="-322" font-family="'Fredoka',sans-serif" font-weight="600" font-size="28" fill="#047857">Séxtuple · 15 mar 2026</text>
    <text x="-170" y="-290" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="20" fill="#047857" opacity=".7">Próximo refuerzo: mar 2027</text>
    <!-- Next control card -->
    <rect x="-270" y="-230" width="540" height="150" rx="26" fill="#fef3c7" stroke="#eab308" stroke-width="3"/>
    <text x="-240" y="-190" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="19" fill="#b45309" letter-spacing="3">PRÓXIMO CONTROL</text>
    <text x="-240" y="-140" font-family="'Fredoka',sans-serif" font-weight="600" font-size="38" fill="#b45309">En 14 días</text>
    <text x="-240" y="-105" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="20" fill="#78350f">Antiparasitario interno</text>
    <!-- CTA -->
    <rect x="-180" y="-50" width="360" height="100" rx="50" fill="#9333ea"/>
    <text x="0" y="15" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="28" fill="#ffffff">DESCARGAR PDF</text>
    <!-- Bottom nav (iOS 5.5") -->
    <rect x="-290" y="540" width="580" height="80" fill="#faf5ff"/>
    <line x1="-290" y1="540" x2="290" y2="540" stroke="#e9d5ff" stroke-width="1"/>
    <circle cx="-200" cy="580" r="13" fill="#9333ea"/>
    <circle cx="-100" cy="580" r="9" fill="none" stroke="#9333ea" stroke-width="2"/>
    <circle cx="0" cy="580" r="9" fill="none" stroke="#9333ea" stroke-width="2"/>
    <circle cx="100" cy="580" r="9" fill="none" stroke="#9333ea" stroke-width="2"/>
    <circle cx="200" cy="580" r="9" fill="none" stroke="#9333ea" stroke-width="2"/>
  </g>
  <rect x="0" y="2138" width="1242" height="70" fill="rgba(255,255,255,0.08)"/>
