<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-label="Play Store screenshot 1 hero">
  <title>Play Store Android · Slide 1 hero</title>
  <desc>Screenshot Android portrait 1080×1920 para Play Store. Slide 1: hero principal.</desc>
  <defs>
    <radialGradient id="ps1-bg" cx="0.5" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.4" stop-color="#f3e8ff"/>
      <stop offset="1" stop-color="#581c87"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#ps1-bg)"/>
  <g transform="translate(540 190)">
    <rect x="-200" y="-28" width="400" height="56" rx="28" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <circle cx="-160" cy="0" r="9" fill="#eab308"/>
    <text x="10" y="7" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="20" fill="#ffffff" letter-spacing="6">PAW FRIEND · HECHO EN CHILE</text>
  </g>
  <text x="540" y="360" text-anchor="middle" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="92" fill="#1a102b" letter-spacing="-3">La ficha médica</text>
  <text x="540" y="470" text-anchor="middle" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="92" fill="#1a102b" letter-spacing="-3">de tu mascota,</text>
  <text x="540" y="580" text-anchor="middle" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="92" fill="#9333ea" letter-spacing="-3">siempre contigo.</text>
  <text x="540" y="680" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="32" fill="#4b3b66">Descarga el PDF en 1 click · Gratis</text>
  <!-- Android phone mockup -->
  <g transform="translate(540 1290)">
    <rect x="-280" y="-580" width="560" height="1140" rx="54" fill="#2a1046"/>
    <rect x="-260" y="-560" width="520" height="1100" rx="32" fill="#ffffff"/>
    <!-- Android top bar (status) -->
    <rect x="-260" y="-560" width="520" height="40" fill="#9333ea"/>
    <!-- Main content -->
    <rect x="-240" y="-500" width="480" height="120" rx="24" fill="#9333ea"/>
    <text x="-215" y="-448" font-family="'Fredoka',sans-serif" font-weight="600" font-size="36" fill="#ffffff">Ficha · Kai</text>
    <text x="-215" y="-418" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="20" fill="rgba(255,255,255,0.85)">Pastor suizo · 4 años</text>
    <circle cx="180" cy="-440" r="40" fill="#ffffff"/>
    <ellipse cx="180" cy="-427" rx="18" ry="14" fill="#9333ea"/>
    <ellipse cx="156" cy="-458" rx="6" ry="10" transform="rotate(-18 156 -458)" fill="#9333ea"/>
    <ellipse cx="171" cy="-470" rx="5" ry="9" transform="rotate(-6 171 -470)" fill="#9333ea"/>
    <ellipse cx="189" cy="-470" rx="5" ry="9" transform="rotate(6 189 -470)" fill="#9333ea"/>
    <ellipse cx="204" cy="-458" rx="6" ry="10" transform="rotate(18 204 -458)" fill="#9333ea"/>
    <!-- Vaccines -->
    <rect x="-240" y="-350" width="480" height="150" rx="24" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
    <text x="-215" y="-315" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="16" fill="#047857" letter-spacing="3">VACUNAS AL DÍA</text>
    <circle cx="-190" cy="-263" r="18" fill="#10b981"/>
    <path d="M-198 -263 L-192 -258 L-183 -270" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="-160" y="-257" font-family="'Fredoka',sans-serif" font-weight="600" font-size="24" fill="#047857">Séxtuple · 15 mar 2026</text>
    <text x="-160" y="-230" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="18" fill="#047857" opacity=".7">Próximo refuerzo: mar 2027</text>
    <!-- Next control -->
    <rect x="-240" y="-170" width="480" height="130" rx="24" fill="#fef3c7" stroke="#eab308" stroke-width="2.5"/>
    <text x="-215" y="-135" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="16" fill="#b45309" letter-spacing="3">PRÓXIMO CONTROL</text>
    <text x="-215" y="-95" font-family="'Fredoka',sans-serif" font-weight="600" font-size="34" fill="#b45309">En 14 días</text>
    <text x="-215" y="-65" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="18" fill="#78350f">Antiparasitario interno</text>
    <!-- CTA -->
    <rect x="-160" y="-10" width="320" height="80" rx="40" fill="#9333ea"/>
    <text x="0" y="43" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="24" fill="#ffffff">DESCARGAR PDF</text>
    <!-- Nav bar android -->
    <rect x="-260" y="460" width="520" height="80" fill="#faf5ff"/>
    <line x1="-260" y1="460" x2="260" y2="460" stroke="#e9d5ff" stroke-width="1"/>
    <circle cx="-180" cy="500" r="12" fill="#9333ea"/>
    <circle cx="-90" cy="500" r="9" fill="none" stroke="#9333ea" stroke-width="2"/>
    <circle cx="0" cy="500" r="9" fill="none" stroke="#9333ea" stroke-width="2"/>
    <circle cx="90" cy="500" r="9" fill="none" stroke="#9333ea" stroke-width="2"/>
    <circle cx="180" cy="500" r="9" fill="none" stroke="#9333ea" stroke-width="2"/>
  </g>
