<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Onboarding add pet">
  <title>Agrega tu primer peludo</title>
  <desc>Cámara apuntando a un peludo con botón + flotando, metáfora de agregar mascota.</desc>
  <defs>
    <linearGradient id="oa-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3e8ff"/><stop offset="1" stop-color="#fef3c7"/></linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#oa-bg)" rx="24"/>
  <!-- Phone frame -->
  <rect x="120" y="60" width="160" height="280" rx="24" fill="#1a102b"/>
  <rect x="128" y="88" width="144" height="220" rx="8" fill="#ffffff"/>
  <!-- Top notch -->
  <rect x="175" y="66" width="50" height="8" rx="4" fill="#4b3b66"/>
  <!-- Camera viewfinder rectangle -->
  <rect x="140" y="100" width="120" height="160" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Pet silhouette inside viewfinder -->
  <g transform="translate(200 195)">
    <ellipse cx="0" cy="20" rx="32" ry="28" fill="#9333ea"/>
    <ellipse cx="0" cy="-12" rx="26" ry="22" fill="#9333ea"/>
    <ellipse cx="-18" cy="-24" rx="7" ry="12" transform="rotate(-18 -18 -24)" fill="#7e22ce"/>
    <ellipse cx="18" cy="-24" rx="7" ry="12" transform="rotate(18 18 -24)" fill="#7e22ce"/>
    <circle cx="-8" cy="-12" r="2.5" fill="#ffffff"/>
    <circle cx="8" cy="-12" r="2.5" fill="#ffffff"/>
    <ellipse cx="0" cy="-5" rx="3" ry="2" fill="#1a102b"/>
  </g>
  <!-- Shutter button -->
  <circle cx="200" cy="290" r="18" fill="#ffffff" stroke="#9333ea" stroke-width="3"/>
  <circle cx="200" cy="290" r="12" fill="#ec4899"/>
  <!-- Floating + bubble -->
  <circle cx="310" cy="100" r="32" fill="url(#oa-bg)" stroke="#9333ea" stroke-width="3"/>
  <line x1="310" y1="85" x2="310" y2="115" stroke="#9333ea" stroke-width="5" stroke-linecap="round"/>
  <line x1="295" y1="100" x2="325" y2="100" stroke="#9333ea" stroke-width="5" stroke-linecap="round"/>
  <!-- Paws decoration -->
  <g transform="translate(60 330)" opacity=".7">
    <ellipse cx="0" cy="10" rx="7" ry="5" fill="#ec4899"/>
    <ellipse cx="-6" cy="2" rx="2.5" ry="3.5" transform="rotate(-18 -6 2)" fill="#ec4899"/>
    <ellipse cx="-2" cy="-3" rx="2" ry="2.5" transform="rotate(-6 -2 -3)" fill="#ec4899"/>
    <ellipse cx="2" cy="-3" rx="2" ry="2.5" transform="rotate(6 2 -3)" fill="#ec4899"/>
    <ellipse cx="6" cy="2" rx="2.5" ry="3.5" transform="rotate(18 6 2)" fill="#ec4899"/>
  </g>
  <g transform="translate(340 310)" opacity=".7">
    <ellipse cx="0" cy="10" rx="7" ry="5" fill="#eab308"/>
    <ellipse cx="-6" cy="2" rx="2.5" ry="3.5" transform="rotate(-18 -6 2)" fill="#eab308"/>
    <ellipse cx="-2" cy="-3" rx="2" ry="2.5" transform="rotate(-6 -2 -3)" fill="#eab308"/>
    <ellipse cx="2" cy="-3" rx="2" ry="2.5" transform="rotate(6 2 -3)" fill="#eab308"/>
    <ellipse cx="6" cy="2" rx="2.5" ry="3.5" transform="rotate(18 6 2)" fill="#eab308"/>
  </g>
</svg>
