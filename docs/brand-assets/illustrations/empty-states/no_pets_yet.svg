<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Sin mascotas todavía">
  <title>Sin mascotas todavía</title>
  <defs>
    <radialGradient id="nps-bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#nps-bg)"/>
  <ellipse cx="200" cy="260" rx="80" ry="10" fill="#9333EA" opacity=".15"/>
  <!-- Cartoon dog -->
  <g transform="translate(200 170)">
    <!-- body -->
    <ellipse cx="0" cy="20" rx="60" ry="46" fill="#eab308"/>
    <!-- head -->
    <circle cx="-10" cy="-30" r="42" fill="#fde047"/>
    <!-- ears -->
    <ellipse cx="-42" cy="-44" rx="14" ry="22" transform="rotate(-25 -42 -44)" fill="#eab308"/>
    <ellipse cx="22" cy="-44" rx="14" ry="22" transform="rotate(25 22 -44)" fill="#eab308"/>
    <!-- snout -->
    <ellipse cx="-2" cy="-18" rx="14" ry="10" fill="#fff"/>
    <ellipse cx="-2" cy="-22" rx="4" ry="3" fill="#1a102b"/>
    <!-- eyes -->
    <circle cx="-22" cy="-36" r="4" fill="#1a102b"/>
    <circle cx="6" cy="-36" r="4" fill="#1a102b"/>
    <circle cx="-21" cy="-37" r="1.5" fill="#fff"/>
    <circle cx="7" cy="-37" r="1.5" fill="#fff"/>
    <!-- smile -->
    <path d="M -6 -16 Q -2 -12 2 -16" fill="none" stroke="#1a102b" stroke-width="2" stroke-linecap="round"/>
    <!-- tail -->
    <path d="M 56 0 Q 80 -20 78 -40" fill="none" stroke="#eab308" stroke-width="14" stroke-linecap="round"/>
    <!-- waving paw -->
    <ellipse cx="44" cy="-46" rx="10" ry="14" transform="rotate(30 44 -46)" fill="#fde047"/>
  </g>
  <!-- Sparkles -->
  <g fill="#9333EA">
    <path d="M 80 70 L 84 78 L 92 82 L 84 86 L 80 94 L 76 86 L 68 82 L 76 78 Z" opacity=".5"/>
    <path d="M 320 100 L 322 106 L 328 108 L 322 110 L 320 116 L 318 110 L 312 108 L 318 106 Z" opacity=".4"/>
  </g>
  <!-- Plus dotted circle hint -->
  <g transform="translate(310 230)">
    <circle r="22" fill="none" stroke="#9333EA" stroke-width="2" stroke-dasharray="3 3" opacity=".5"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#9333EA" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#9333EA" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
