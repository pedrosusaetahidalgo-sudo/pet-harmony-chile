<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Empty state: no vets nearby">
  <title>No hay vets cerca aún · Empty state directorio</title>
  <desc>Pin de mapa mirando alrededor buscando resultados.</desc>
  <defs>
    <linearGradient id="nv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#f3e8ff"/>
    </linearGradient>
    <radialGradient id="nv-map" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#nv-bg)" rx="20"/>
  <!-- Map grid -->
  <g opacity=".3" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="300"/>
  </g>
  <!-- Map center highlight -->
  <ellipse cx="200" cy="170" rx="120" ry="80" fill="url(#nv-map)"/>
  <!-- Pin -->
  <g transform="translate(200 130)">
    <path d="M0 -40 C-25 -40, -40 -22, -40 0 C-40 25, 0 65, 0 65 C0 65, 40 25, 40 0 C40 -22, 25 -40, 0 -40 Z" fill="#10b981"/>
    <circle cx="0" cy="-5" r="20" fill="#ffffff"/>
    <!-- Eyes looking sideways (searching) -->
    <circle cx="-5" cy="-5" r="4" fill="#1a102b"/>
    <circle cx="9" cy="-5" r="4" fill="#1a102b"/>
    <circle cx="-4" cy="-5" r="1.2" fill="#ffffff"/>
    <circle cx="10" cy="-5" r="1.2" fill="#ffffff"/>
    <!-- Eyebrows raised -->
    <path d="M-12 -16 L-2 -14" stroke="#1a102b" stroke-width="2" stroke-linecap="round"/>
    <path d="M14 -14 L4 -16" stroke="#1a102b" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Question mark floating -->
  <text x="265" y="100" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="700" font-size="36" fill="#10b981">?</text>
  <!-- Sparkles -->
  <path d="M100 100 l2 4 4 1 -3 3 1 4 -4 -2 -4 2 1 -4 -3 -3 4 -1 z" fill="#eab308" opacity=".7"/>
  <path d="M310 220 l2 4 4 1 -3 3 1 4 -4 -2 -4 2 1 -4 -3 -3 4 -1 z" fill="#eab308" opacity=".7"/>
</svg>
