<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Sin vets cercanos">
  <title>Sin vets cercanos</title>
  <rect width="400" height="300" fill="#faf5ff"/>
  <!-- Map grid -->
  <g stroke="#9333EA" stroke-width="1" opacity=".2">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
  </g>
  <ellipse cx="200" cy="240" rx="50" ry="6" fill="#9333EA" opacity=".18"/>
  <!-- Big pin with face -->
  <g transform="translate(200 130)">
    <path d="M 0 -60 C -30 -60, -50 -38, -50 -10 C -50 26, 0 90, 0 90 C 0 90, 50 26, 50 -10 C 50 -38, 30 -60, 0 -60 Z" fill="#9333EA"/>
    <circle cx="0" cy="-12" r="28" fill="#fff"/>
    <!-- Looking eyes -->
    <circle cx="-12" cy="-14" r="6" fill="#fff"/>
    <circle cx="12" cy="-14" r="6" fill="#fff"/>
    <circle cx="-9" cy="-12" r="3" fill="#1a102b"/>
    <circle cx="15" cy="-12" r="3" fill="#1a102b"/>
    <!-- Confused mouth -->
    <path d="M -8 -2 Q 0 2 8 -2" fill="none" stroke="#1a102b" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Question marks -->
  <g fill="#9333EA" font-family="Fredoka, sans-serif" font-weight="600">
    <text x="120" y="80" font-size="28" opacity=".5">?</text>
    <text x="290" y="100" font-size="32" opacity=".6">?</text>
  </g>
</svg>
