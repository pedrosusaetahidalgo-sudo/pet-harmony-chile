<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Sin feed">
  <title>Sin feed</title>
  <rect width="400" height="300" fill="#faf5ff"/>
  <ellipse cx="200" cy="260" rx="100" ry="8" fill="#9333EA" opacity=".15"/>
  <!-- Big chat bubble -->
  <g transform="translate(200 150)">
    <path d="M -90 -40 Q -90 -70 -60 -70 L 60 -70 Q 90 -70 90 -40 L 90 30 Q 90 50 70 50 L -20 50 L -40 70 L -36 50 L -60 50 Q -90 50 -90 30 Z" fill="#fff" stroke="#9333EA" stroke-width="3"/>
    <circle cx="-30" cy="-10" r="6" fill="#9333EA"/>
    <circle cx="0" cy="-10" r="6" fill="#9333EA" opacity=".7"/>
    <circle cx="30" cy="-10" r="6" fill="#9333EA" opacity=".4"/>
  </g>
  <!-- Small bubble accent -->
  <g transform="translate(110 230)">
    <circle r="14" fill="#fde047" opacity=".6"/>
    <circle cx="-10" cy="6" r="6" fill="#fde047" opacity=".4"/>
  </g>
</svg>
