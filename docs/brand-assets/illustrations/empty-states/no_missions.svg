<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Empty state: no missions yet">
  <title>Sin misiones activas · Empty state</title>
  <desc>Trofeo brillante esperando que empieces tu primera misión.</desc>
  <defs>
    <linearGradient id="nm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#faf5ff"/>
    </linearGradient>
    <linearGradient id="nm-trophy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#nm-bg)" rx="20"/>
  <!-- Base pedestal -->
  <rect x="160" y="230" width="80" height="20" rx="4" fill="#9333ea"/>
  <rect x="155" y="240" width="90" height="18" rx="4" fill="#7e22ce"/>
  <!-- Trophy stem -->
  <rect x="190" y="200" width="20" height="35" rx="4" fill="url(#nm-trophy)"/>
  <!-- Cup body -->
  <path d="M140 80 L260 80 L250 190 C250 205, 220 215, 200 215 C180 215, 150 205, 150 190 Z" fill="url(#nm-trophy)"/>
  <!-- Handles -->
  <path d="M140 90 C115 90, 100 110, 100 130 C100 150, 115 170, 145 170" fill="none" stroke="url(#nm-trophy)" stroke-width="8" stroke-linecap="round"/>
  <path d="M260 90 C285 90, 300 110, 300 130 C300 150, 285 170, 255 170" fill="none" stroke="url(#nm-trophy)" stroke-width="8" stroke-linecap="round"/>
  <!-- Star on trophy -->
  <path d="M200 125 l5 12 13 1 -10 9 3 13 -11 -7 -11 7 3 -13 -10 -9 13 -1 z" fill="#ffffff"/>
  <!-- Shimmer highlights -->
  <path d="M155 95 C158 120, 158 160, 162 180" stroke="#ffffff" stroke-width="3" fill="none" opacity=".6" stroke-linecap="round"/>
  <!-- Sparkles -->
  <path d="M80 75 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#eab308"/>
  <path d="M315 190 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#eab308"/>
  <path d="M340 70 l2 4 4 1 -3 3 1 4 -4 -2 -4 2 1 -4 -3 -3 4 -1 z" fill="#eab308" opacity=".7"/>
  <path d="M60 200 l2 4 4 1 -3 3 1 4 -4 -2 -4 2 1 -4 -3 -3 4 -1 z" fill="#eab308" opacity=".7"/>
</svg>
