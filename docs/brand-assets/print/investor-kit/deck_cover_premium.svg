    <radialGradient id="inv-bg-3" cx="0.7" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="inv-base" x1="0" y1="0" x2="1" y2="1">
