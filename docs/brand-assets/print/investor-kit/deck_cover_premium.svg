    <text x="0" y="0" font-family="'Plus Jakarta Sans',sans-serif" font-weight="600" font-size="16" fill="rgba(255,255,255,0.65)" letter-spacing="3" text-anchor="start" transform="scale(-1 1)">pawfriend.cl · Deck investor · 2026</text>
