    </mask>
    <linearGradient id="inv-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9333ea"/>
      <stop offset="0.55" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#inv-base)"/>
  <rect width="1920" height="1080" fill="url(#inv-bg-1)"/>
  <rect width="1920" height="1080" fill="url(#inv-bg-2)"/>
  <rect width="1920" height="1080" fill="url(#inv-bg-3)"/>
  <!-- Dot pattern overlay -->
