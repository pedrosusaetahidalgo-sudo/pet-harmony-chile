    <circle cx="1200" cy="180" r="2"/><circle cx="1500" cy="240" r="2"/><circle cx="1700" cy="160" r="2"/>
    <circle cx="300" cy="480" r="2"/><circle cx="600" cy="520" r="2"/><circle cx="1300" cy="460" r="2"/>
    <circle cx="1600" cy="500" r="2"/><circle cx="150" cy="780" r="2"/><circle cx="450" cy="820" r="2"/>
    <circle cx="1450" cy="780" r="2"/><circle cx="1750" cy="820" r="2"/>
  </g>
  <!-- Logo mark floating -->
