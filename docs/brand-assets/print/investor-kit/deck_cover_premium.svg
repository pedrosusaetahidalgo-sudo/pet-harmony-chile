    <ellipse cx="858" cy="525" rx="40" ry="50" transform="rotate(-22 858 525)" fill="#ffffff"/>
    <ellipse cx="925" cy="460" rx="37" ry="46" transform="rotate(-10 925 460)" fill="#ffffff"/>
    <ellipse cx="995" cy="460" rx="37" ry="46" transform="rotate(10 995 460)" fill="#ffffff"/>
    <ellipse cx="1062" cy="525" rx="40" ry="50" transform="rotate(22 1062 525)" fill="#ffffff"/>
  </g>
  <!-- Eyebrow top -->
