    <rect x="0" y="0" width="360" height="54" rx="27" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    <circle cx="28" cy="27" r="8" fill="#eab308"/>
    <text x="52" y="34" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="4">PAW FRIEND · HECHO EN CHILE</text>
