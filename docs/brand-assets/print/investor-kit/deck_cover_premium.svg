<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Investor deck cover premium">
  <title>Investor Deck Cover · Paw Friend premium</title>
  <desc>Cover 1920×1080 para decks investor. Gradient cinematográfico purple→fuchsia→gold con mark central flotante.</desc>
  <defs>
    <radialGradient id="inv-bg-1" cx="0.25" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#9333ea" stop-opacity=".85"/>
      <stop offset="1" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="inv-bg-2" cx="0.8" cy="0.25" r="0.45">
      <stop offset="0" stop-color="#eab308" stop-opacity=".7"/>
