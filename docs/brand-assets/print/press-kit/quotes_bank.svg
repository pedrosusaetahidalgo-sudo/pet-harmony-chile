<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" width="1240" height="1754" role="img" aria-label="Paw Friend quotes bank A4">
  <title>Paw Friend · Quotes Bank</title>
  <desc>Banco de frases oficiales autorizadas del founder Paw Friend para uso editorial / prensa.</desc>
  <defs>
    <linearGradient id="qb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.5" stop-color="#f3e8ff"/>
      <stop offset="1" stop-color="#fdf2f8"/>
    </linearGradient>
  </defs>
  <rect width="1240" height="1754" fill="url(#qb-bg)"/>
  <!-- Header -->
  <g transform="translate(80 80)">
    <text x="0" y="20" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="12" fill="#9333ea" letter-spacing="6">QUOTES BANK · PAW FRIEND</text>
    <text x="0" y="72" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="54" fill="#1a102b" letter-spacing="-1.5">Frases oficiales del founder</text>
    <text x="0" y="112" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="15" fill="#4b3b66">Autorizadas para uso editorial sin consulta previa. Versión 2026-04-19.</text>
  </g>

  <!-- Quote 1 -->
  <g transform="translate(80 240)">
    <rect x="0" y="0" width="1080" height="210" rx="20" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <rect x="0" y="0" width="6" height="210" fill="#9333ea"/>
    <text x="44" y="46" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="11" fill="#9333ea" letter-spacing="3">SOBRE LA MISIÓN</text>
    <text x="44" y="100" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="500" font-style="italic" font-size="26" fill="#1a102b" letter-spacing="-.3">
      <tspan x="44" dy="0">"Paw Friend es mi carta de amor a cada perro, cada gato,</tspan>
      <tspan x="44" dy="38">y a cada dueño que se ha sentido solo en una sala de</tspan>
      <tspan x="44" dy="38">urgencia veterinaria."</tspan>
    </text>
  </g>

  <!-- Quote 2 -->
  <g transform="translate(80 480)">
    <rect x="0" y="0" width="1080" height="180" rx="20" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <rect x="0" y="0" width="6" height="180" fill="#eab308"/>
    <text x="44" y="46" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="11" fill="#b45309" letter-spacing="3">SOBRE EL MODELO "GRATIS PARA SIEMPRE"</text>
    <text x="44" y="100" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="500" font-style="italic" font-size="24" fill="#1a102b" letter-spacing="-.3">
      <tspan x="44" dy="0">"El dueño de mascota no paga ni un peso. Nunca. Lo que</tspan>
      <tspan x="44" dy="34">sostiene Paw Friend viene de veterinarios que quieren crecer,</tspan>
      <tspan x="44" dy="34">empresas que patrocinan y quienes deciden donar."</tspan>
    </text>
  </g>

  <!-- Quote 3 -->
  <g transform="translate(80 690)">
    <rect x="0" y="0" width="1080" height="200" rx="20" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <rect x="0" y="0" width="6" height="200" fill="#10b981"/>
    <text x="44" y="46" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="11" fill="#047857" letter-spacing="3">SOBRE LA INTELIGENCIA ARTIFICIAL</text>
    <text x="44" y="100" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="500" font-style="italic" font-size="24" fill="#1a102b" letter-spacing="-.3">
      <tspan x="44" dy="0">"Una persona con IA construyó en 2 meses lo que un equipo</tspan>
      <tspan x="44" dy="34">de 5 expertos tardaría 2 años. La IA no reemplaza al</tspan>
      <tspan x="44" dy="34">ingeniero — lo multiplica por 15."</tspan>
    </text>
  </g>

  <!-- Quote 4 -->
  <g transform="translate(80 920)">
    <rect x="0" y="0" width="1080" height="180" rx="20" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <rect x="0" y="0" width="6" height="180" fill="#ec4899"/>
    <text x="44" y="46" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="11" fill="#be185d" letter-spacing="3">SOBRE HECHO EN CHILE</text>
    <text x="44" y="100" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="500" font-style="italic" font-size="24" fill="#1a102b" letter-spacing="-.3">
      <tspan x="44" dy="0">"Paw Friend no es un experimento de Silicon Valley. Es un</tspan>
      <tspan x="44" dy="34">producto home-made chileno, construido con disciplina técnica</tspan>
      <tspan x="44" dy="34">y amor por los peludos."</tspan>
    </text>
  </g>

  <!-- Quote 5 -->
  <g transform="translate(80 1130)">
    <rect x="0" y="0" width="1080" height="180" rx="20" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <rect x="0" y="0" width="6" height="180" fill="#0ea5e9"/>
    <text x="44" y="46" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="11" fill="#0369a1" letter-spacing="3">SOBRE EL VETERINARIO DE BARRIO</text>
    <text x="44" y="100" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="500" font-style="italic" font-size="24" fill="#1a102b" letter-spacing="-.3">
      <tspan x="44" dy="0">"Los programas para clínicas grandes (QVET, VetPraxis) no</tspan>
      <tspan x="44" dy="34">publican precios ni sirven a clínicas chicas. Nosotros somos</tspan>
      <tspan x="44" dy="34">el único que sí."</tspan>
    </text>
  </g>

  <!-- Attribution footer -->
  <g transform="translate(80 1380)">
    <rect x="0" y="0" width="1080" height="240" rx="20" fill="#1a102b"/>
    <text x="40" y="46" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="12" fill="#fde68a" letter-spacing="4">ATRIBUCIÓN</text>
    <text x="40" y="90" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="26" fill="#ffffff">
      <tspan x="40" dy="0">— Paw Founder, fundador de Paw Friend.</tspan>
    </text>
    <text x="40" y="140" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="14" fill="rgba(255,255,255,0.85)">
      <tspan x="40" dy="0">Todas las frases de este documento son autorizadas para uso editorial sin consulta previa.</tspan>
      <tspan x="40" dy="22">Si necesitas una frase sobre un tema específico no cubierto aquí, escribir a</tspan>
      <tspan x="40" dy="22">pedrosusaeta@pawfriend.cl.</tspan>
    </text>
    <text x="40" y="220" font-family="'JetBrains Mono',monospace" font-weight="500" font-size="11" fill="rgba(255,255,255,0.55)">pawfriend.cl · SpA 78.328.659-9 · Versión 2026-04-19</text>
  </g>
</svg>
