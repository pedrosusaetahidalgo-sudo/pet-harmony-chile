<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1250" width="600" height="1250" role="img" aria-label="Pixel 8 portrait mockup">
  <title>Google Pixel 8 · Portrait · Obsidian</title>
  <desc>Mockup vectorial de Google Pixel 8 portrait. Screenshot placeholder editable.</desc>
  <defs>
    <linearGradient id="px-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1f23"/>
      <stop offset="1" stop-color="#0a0a0e"/>
    </linearGradient>
    <linearGradient id="px-bezel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#44444a"/>
      <stop offset="0.08" stop-color="#0a0a0e"/>
      <stop offset="0.92" stop-color="#0a0a0e"/>
      <stop offset="1" stop-color="#44444a"/>
    </linearGradient>
  </defs>
  <!-- Outer body -->
  <rect x="30" y="30" width="540" height="1180" rx="58" fill="url(#px-body)"/>
  <rect x="32" y="32" width="536" height="1176" rx="56" fill="none" stroke="url(#px-bezel)" stroke-width="3" opacity=".6"/>
  <!-- Inner frame -->
  <rect x="44" y="44" width="512" height="1152" rx="46" fill="#000000"/>
  <!-- Screen placeholder -->
  <rect x="46" y="46" width="508" height="1148" rx="44" fill="#faf5ff" stroke="#9333ea" stroke-width="2" stroke-dasharray="8,6" opacity=".8"/>
  <text x="300" y="615" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="18" fill="#9333ea" letter-spacing="4">SCREENSHOT AQUÍ</text>
  <text x="300" y="645" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="14" fill="#9333ea" opacity=".7">1080 × 2400 (6.2")</text>
  <!-- Punch-hole camera centered -->
  <circle cx="300" cy="78" r="12" fill="#0a0a0e"/>
  <circle cx="300" cy="78" r="6" fill="#1a1a22"/>
  <!-- Side buttons -->
  <rect x="566" y="250" width="4" height="60" rx="2" fill="#44444a"/>
  <rect x="566" y="330" width="4" height="100" rx="2" fill="#44444a"/>
  <!-- Distinctive camera bar top (Pixel signature) -->
  <rect x="60" y="60" width="480" height="28" rx="14" fill="#2a2a32" opacity=".3"/>
  <ellipse cx="300" cy="1225" rx="260" ry="8" fill="#000000" opacity=".25"/>
</svg>
