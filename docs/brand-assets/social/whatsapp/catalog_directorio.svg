<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="WA catalog — directorio">
  <title>WA catalog directorio</title>
  <rect width="1080" height="1080" fill="#faf5ff"/>
  <rect x="40" y="40" width="1000" height="900" rx="32" fill="#fff" stroke="#e9d5ff" stroke-width="3"/>
  <text x="540" y="160" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="500" font-size="22" fill="#10b981" letter-spacing="3">DIRECTORIO VETS</text>
  <text x="540" y="226" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="60" fill="#1a102b" letter-spacing="-2">Encuentra tu vet</text>
  <text x="540" y="284" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="60" fill="#10b981" letter-spacing="-2">en tu barrio</text>
  <!-- Map -->
  <g transform="translate(140 380)">
    <rect width="800" height="440" rx="20" fill="#e9d5ff"/>
    <g stroke="#9333EA" stroke-width="2" opacity=".4" fill="none">
