      <circle cx="680" cy="120" r="16"/>
      <circle cx="640" cy="380" r="12"/>
      <circle cx="240" cy="380" r="11"/>
    </g>
    <!-- Featured pin -->
    <g transform="translate(420 220)">
      <circle r="60" fill="#9333EA" opacity=".15"/>
      <circle r="44" fill="#9333EA" opacity=".25"/>
      <path d="M 0 -36 C -18 -36, -32 -24, -32 -8 C -32 14, 0 50, 0 50 C 0 50, 32 14, 32 -8 C 32 -24, 18 -36, 0 -36 Z" fill="#9333EA"/>
