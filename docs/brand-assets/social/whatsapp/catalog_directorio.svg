  <text x="540" y="888" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="20" fill="#10b981">Reseñas reales · horarios · WhatsApp directo</text>
  <g transform="translate(60 1020)">
