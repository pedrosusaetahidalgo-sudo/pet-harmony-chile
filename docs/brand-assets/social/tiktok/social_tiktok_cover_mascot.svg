<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-label="TikTok cover — mascot">
  <title>TikTok cover mascot</title>
  <defs>
    <radialGradient id="ttm" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#ttm)"/>
  <!-- Big mascot dog silhouette centered -->
  <g transform="translate(540 1000)">
    <ellipse cx="0" cy="380" rx="240" ry="20" fill="#000" opacity=".25"/>
    <!-- body -->
    <ellipse cx="0" cy="180" rx="240" ry="200" fill="#fde047"/>
    <!-- head -->
    <circle cx="-30" cy="-100" r="180" fill="#fde047"/>
    <!-- ears -->
    <path d="M -190 -190 L -170 -300 L -130 -200 Z" fill="#eab308"/>
    <path d="M 110 -190 L 130 -300 L 70 -200 Z" fill="#eab308"/>
    <!-- snout -->
    <ellipse cx="-12" cy="-60" rx="60" ry="46" fill="#fff"/>
    <ellipse cx="-12" cy="-90" rx="18" ry="14" fill="#1a102b"/>
    <!-- eyes -->
    <circle cx="-90" cy="-130" r="14" fill="#1a102b"/>
    <circle cx="20" cy="-130" r="14" fill="#1a102b"/>
    <circle cx="-86" cy="-134" r="5" fill="#fff"/>
    <circle cx="24" cy="-134" r="5" fill="#fff"/>
    <!-- smile -->
    <path d="M -30 -38 Q -10 -22 10 -38" fill="none" stroke="#1a102b" stroke-width="6" stroke-linecap="round"/>
    <!-- tongue -->
    <path d="M -10 -32 Q -4 -22 0 -32 Z" fill="#ec4899"/>
  </g>
  <!-- Bottom CTA sticker -->
  <g transform="translate(540 1700)">
    <rect x="-300" y="-60" width="600" height="120" rx="60" fill="#fde047"/>
    <text y="16" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="44" fill="#581c87">Descargar gratis →</text>
  </g>
</svg>
