<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-label="Instagram Reel cover — Mascot spotlight">
  <title>IG Reel Cover · Mascot Spotlight</title>
  <desc>Cover 1080×1920 para reels. Silueta mascota grande centrada + copy sticker bottom.</desc>
  <defs>
    <linearGradient id="reel-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#581c87"/>
      <stop offset="0.5" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="reel-glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#eab308" stop-opacity=".45"/>
      <stop offset="1" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#reel-bg)"/>
  <rect width="1080" height="1920" fill="url(#reel-glow)"/>
  <!-- Safe area guides -->
  <line x1="0" y1="220" x2="1080" y2="220" stroke="rgba(255,255,255,0.05)" stroke-dasharray="6,6"/>
  <line x1="0" y1="1670" x2="1080" y2="1670" stroke="rgba(255,255,255,0.05)" stroke-dasharray="6,6"/>
  <!-- Mascot silhouette (big dog centered) -->
  <g transform="translate(540 950)">
    <!-- Halo ring -->
    <circle cx="0" cy="0" r="340" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3" stroke-dasharray="12,8"/>
    <circle cx="0" cy="0" r="320" fill="rgba(255,255,255,0.08)"/>
    <!-- Dog body -->
    <ellipse cx="0" cy="120" rx="180" ry="220" fill="#ffffff"/>
    <!-- Dog head -->
    <ellipse cx="0" cy="-60" rx="150" ry="140" fill="#ffffff"/>
    <!-- Ears -->
    <ellipse cx="-120" cy="-150" rx="40" ry="80" transform="rotate(-20 -120 -150)" fill="#ffffff"/>
    <ellipse cx="120" cy="-150" rx="40" ry="80" transform="rotate(20 120 -150)" fill="#ffffff"/>
    <!-- Inner ears (pink) -->
    <ellipse cx="-118" cy="-140" rx="22" ry="55" transform="rotate(-20 -118 -140)" fill="#ec4899"/>
    <ellipse cx="118" cy="-140" rx="22" ry="55" transform="rotate(20 118 -140)" fill="#ec4899"/>
    <!-- Eyes (closed smile — happy) -->
    <path d="M-55 -70 C-48 -78, -32 -78, -25 -70" stroke="#1a102b" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M25 -70 C32 -78, 48 -78, 55 -70" stroke="#1a102b" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Nose -->
    <ellipse cx="0" cy="-10" rx="22" ry="16" fill="#1a102b"/>
    <!-- Smile + tongue -->
    <path d="M-30 30 Q0 60, 30 30" stroke="#1a102b" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M-12 38 Q0 60, 12 38 Q0 50, -12 38 Z" fill="#ec4899"/>
    <!-- Stars floating -->
    <path d="M-230 -180 l6 14 14 2 -10 8 2 14 -12 -7 -12 7 2 -14 -10 -8 14 -2 z" fill="#eab308"/>
    <path d="M240 -200 l5 12 12 1 -9 7 2 12 -10 -6 -10 6 2 -12 -9 -7 12 -1 z" fill="#eab308"/>
  </g>
  <!-- Top title -->
  <text x="540" y="380" text-anchor="middle" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="78" fill="#ffffff" letter-spacing="-2">Conoce a Kai.</text>
  <!-- Bottom sticker CTA -->
  <g transform="translate(540 1510)">
    <rect x="-340" y="-60" width="680" height="120" rx="60" fill="#ffffff"/>
    <text x="0" y="-5" text-anchor="middle" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="42" fill="#1a102b">Su ficha médica</text>
    <text x="0" y="45" text-anchor="middle" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="42" fill="#9333ea">siempre al día →</text>
  </g>
  <!-- Brand watermark -->
  <g transform="translate(540 1620)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="22" fill="rgba(255,255,255,0.85)" letter-spacing="8">@PAWFRIEND.CL</text>
  </g>
</svg>
