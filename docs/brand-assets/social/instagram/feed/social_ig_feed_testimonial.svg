      <stop offset="0%" stop-color="#a855f7" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#igt)"/>
  <text x="80" y="220" font-family="Fredoka, sans-serif" font-weight="600" font-size="280" fill="#fde047" opacity=".25">"</text>
  <g transform="translate(120 380)">
