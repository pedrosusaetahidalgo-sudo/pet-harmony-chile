<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-label="IG story — quote">
  <title>IG story quote</title>
  <defs>
    <radialGradient id="sqb" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
    <radialGradient id="sqg" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sqg2" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#sqb)"/>
  <rect width="1080" height="1920" fill="url(#sqg)"/>
  <rect width="1080" height="1920" fill="url(#sqg2)"/>
  <text x="540" y="540" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="320" fill="#fde047" opacity=".25">"</text>
  <g transform="translate(540 920)" text-anchor="middle">
    <text font-family="Fredoka, sans-serif" font-weight="600" font-size="68" fill="#fff" letter-spacing="-1.5">
      <tspan x="0">Tu peludo no</tspan>
      <tspan x="0" dy="84">debería pagar</tspan>
      <tspan x="0" dy="84">por tener su</tspan>
      <tspan x="0" dy="84">historia clínica.</tspan>
    </text>
  </g>
  <text x="540" y="1480" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="22" fill="#fde047" letter-spacing="2">— Paw Founder</text>
</svg>
