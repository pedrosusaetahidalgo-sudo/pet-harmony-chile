<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" width="680" height="680">
  <title>Paw Friend App Icon</title>
  <desc>Logo principal de Paw Friend con squircle iOS y símbolo pata-corazón en negative space</desc>
  <defs>
    <clipPath id="squircle">
      <path d="M 340 40 C 540 40, 640 140, 640 340 C 640 540, 540 640, 340 640 C 140 640, 40 540, 40 340 C 40 140, 140 40, 340 40 Z"/>
    </clipPath>
    <mask id="heart-cutout">
      <rect width="680" height="680" fill="white"/>
      <path d="M 340 480 C 332 470, 318 460, 310 450 C 302 440, 305 425, 318 422 C 327 420, 335 425, 340 432 C 345 425, 353 420, 362 422 C 375 425, 378 440, 370 450 C 362 460, 348 470, 340 480 Z" fill="black"/>
    </mask>
  </defs>
  <path d="M 340 40 C 540 40, 640 140, 640 340 C 640 540, 540 640, 340 640 C 140 640, 40 540, 40 340 C 40 140, 140 40, 340 40 Z" fill="#0F172A"/>
  <g clip-path="url(#squircle)">
    <ellipse cx="340" cy="430" rx="155" ry="135" fill="#C084FC" mask="url(#heart-cutout)"/>
    <ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)" fill="#C084FC"/>
    <ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)" fill="#C084FC"/>
    <ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)" fill="#C084FC"/>
    <ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)" fill="#C084FC"/>
  </g>
</svg>