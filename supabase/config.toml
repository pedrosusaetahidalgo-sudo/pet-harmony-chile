# ── Edge Functions ──────────────────────────────────────────────
# Política (2026-04-20 — Auditoría top-tier P0):
#
#   verify_jwt = true  → funciones llamadas desde el frontend con
#                        `Authorization: Bearer <access_token>`.
#                        El gateway valida el JWT antes de invocar la fn,
#                        reduciendo surface de ataque (requests sin token
#                        nunca llegan al code path).
#
#   verify_jwt = false → webhooks externos (Flow), OAuth callbacks,
#                        crons pg_cron con service_role, y funciones
#                        invocadas service-to-service (ej. send-donation-thanks
#                        disparada desde flow-webhook).
#
# Historia: entre 2026-04-11 y 2026-04-19 TODAS estaban en false por una
# rotación de JWT secret que invalidaba tokens antiguos. Esos tokens ya
# expiraron (TTL 1h), así que reactivamos el gateway check en las fns que
# igual validaban internamente con supabase.auth.getUser(token).

# ═══════════════════════════════════════════════════════════════════════
# GRUPO A — verify_jwt = true (llamadas desde frontend con bearer)
# ═══════════════════════════════════════════════════════════════════════

# Pagos B2C / B2B (el user inicia el checkout desde la app)
[functions.flow-create-subscription]
verify_jwt = true

