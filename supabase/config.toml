verify_jwt = true

# Refactor Maestro Fase 1 §6.7 — Cron diario de follow-ups post-adopcion 30/90d.
# verify_jwt = false: la fn corre desde pg_cron, sin user. Usa SERVICE_ROLE_KEY.
[functions.send-adoption-followups]
verify_jwt = false

# Refactor Maestro Fase 1 2026-04-24 — Nose Print embedding (Pilar 1 Trinidad).
# verify_jwt = true: requiere user logueado para insertar nose_print en su pet.
# RLS valida que el pet sea del owner.
[functions.nose-print-embed]
verify_jwt = true

# Refactor Maestro Fase 1 2026-04-24 — Nose Print matching publico.
# verify_jwt = false: la pagina /nose-scan es publica para encontrar mascotas
# perdidas sin necesidad de login. La edge fn usa SECURITY DEFINER en el RPC
# match_nose_print y aplica consent gating segun lost_at.
[functions.nose-print-match]
verify_jwt = false

# Refactor Maestro Fase 2 §7.5 — API publica B2B con auth via X-Pawfriend-Api-Key.
# verify_jwt = false: la auth es la API key custom (header), no Supabase JWT.
# La edge fn verifica la key contra b2b_api_keys y aplica rate limit per-key.
[functions.b2b-api]
verify_jwt = false

# Refactor Maestro Fase 2 §2.8.3 — Email a dueño cuando alerta severity='high'.
# verify_jwt = false: corre desde pg_cron sin user. Usa SERVICE_ROLE_KEY
# para auth. Idempotente via email_sent_at.
[functions.notify-health-alerts]
verify_jwt = false

# Refactor Maestro §2.8.3 — Pipeline unificado de cascadas.
# Reemplaza 6 crones separados (5 RPCs + notify-emails) con 1 cron unico.
# verify_jwt = false: corre desde pg_cron sin user.
[functions.run-all-cascades]
verify_jwt = false

# Refactor Maestro §6.4 — Validar Paw Member para descuento en partner.
# verify_jwt = false: la auth es la API key del partner (X-Pawfriend-Api-Key),
