# ── Funciones IA con auth requerida ──────────────────────────────
# verify_jwt=true: el gateway de Supabase valida el JWT ANTES de
# invocar la función, ahorrando la invocación completa si no hay auth.

[functions.pet-assistant]
verify_jwt = true

[functions.breed-tips]
verify_jwt = true

[functions.medical-suggestions]
verify_jwt = true

[functions.moderate-service-promotion]
verify_jwt = true

[functions.generate-shelters]
verify_jwt = true

# ── Funciones médicas y pagos (auth requerida) ───────────────────

[functions.flow-create-subscription]
verify_jwt = true

[functions.generate-medical-summary]
verify_jwt = true

[functions.generate-medical-zip]
verify_jwt = true

# ── Google Calendar (auth requerida) ─────────────────────────────

[functions.google-calendar-oauth-init]
verify_jwt = true

[functions.google-calendar-sync]
verify_jwt = true

[functions.google-calendar-disconnect]
verify_jwt = true

# ── Funciones sin auth (callbacks externos, crons, SEO) ─────────

[functions.flow-webhook]
verify_jwt = false  # callback externo de Flow.cl, sin user context

[functions.google-calendar-callback]
verify_jwt = false  # callback de Google OAuth, sin user context

[functions.reminder-cron]
verify_jwt = false  # cron job, no user context

[functions.send-whatsapp-reminder]
verify_jwt = false  # llamada interna desde reminder-cron via service_role

[functions.generate-sitemap]
verify_jwt = false  # público, SEO

[functions.generate-weekly-owner-reports]
verify_jwt = false  # cron job, no user context

[functions.generate-weekly-vet-reports]
verify_jwt = false  # cron job, no user context
