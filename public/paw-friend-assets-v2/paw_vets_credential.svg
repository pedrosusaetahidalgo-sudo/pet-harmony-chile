<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <title>Paw Vets — Clinic Credential Card</title>
  <defs>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDFA"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <clipPath id="squircleClip">
      <path d="M 512 120 C 712 120, 812 220, 812 420 C 812 620, 712 720, 512 720 C 312 720, 212 620, 212 420 C 212 220, 312 120, 512 120 Z"/>
    </clipPath>
    <mask id="crossMask">
      <rect x="-200" y="-200" width="1400" height="1400" fill="white"/>
      <path d="M 506 510 H 518 V 524 H 532 V 536 H 518 V 550 H 506 V 536 H 492 V 524 H 506 Z" fill="black"/>
    </mask>
    <g id="pawWithCross">
      <ellipse cx="512" cy="510" rx="155" ry="135" fill="#FFFFFF" mask="url(#crossMask)"/>
      <ellipse cx="372" cy="350" rx="55" ry="68" transform="rotate(-22 372 350)" fill="#FFFFFF"/>
      <ellipse cx="460" cy="260" rx="50" ry="62" transform="rotate(-10 460 260)" fill="#FFFFFF"/>
      <ellipse cx="564" cy="260" rx="50" ry="62" transform="rotate(10 564 260)" fill="#FFFFFF"/>
      <ellipse cx="652" cy="350" rx="55" ry="68" transform="rotate(22 652 350)" fill="#FFFFFF"/>
    </g>
  </defs>

  <rect width="1200" height="800" fill="url(#paperGrad)"/>

  <!-- Watermark paw 5% (centered backdrop) -->
  <g opacity="0.05" transform="translate(88 232) scale(1.0)">
    <path d="M 512 120 C 712 120, 812 220, 812 420 C 812 620, 712 720, 512 720 C 312 720, 212 620, 212 420 C 212 220, 312 120, 512 120 Z" fill="#0F766E"/>
    <g clip-path="url(#squircleClip)">
      <ellipse cx="512" cy="510" rx="155" ry="135" fill="#0F766E"/>
      <ellipse cx="372" cy="350" rx="55" ry="68" transform="rotate(-22 372 350)" fill="#0F766E"/>
      <ellipse cx="460" cy="260" rx="50" ry="62" transform="rotate(-10 460 260)" fill="#0F766E"/>
      <ellipse cx="564" cy="260" rx="50" ry="62" transform="rotate(10 564 260)" fill="#0F766E"/>
      <ellipse cx="652" cy="350" rx="55" ry="68" transform="rotate(22 652 350)" fill="#0F766E"/>
    </g>
  </g>

  <!-- Clinical frame -->
  <rect x="30" y="30" width="1140" height="740" rx="18" fill="none" stroke="#0F766E" stroke-width="2.5" opacity="0.7"/>
  <rect x="45" y="45" width="1110" height="710" rx="12" fill="none" stroke="#0F766E" stroke-width="1" opacity="0.35"/>
  <!-- Corner accents -->
  <g stroke="#0F766E" stroke-width="2" fill="none" opacity="0.7">
    <circle cx="80" cy="80" r="3" fill="#0F766E"/>
    <circle cx="1120" cy="80" r="3" fill="#0F766E"/>
    <circle cx="80" cy="720" r="3" fill="#0F766E"/>
    <circle cx="1120" cy="720" r="3" fill="#0F766E"/>
  </g>

  <!-- Tier squircle 260px at (80, 100) -->
  <g transform="translate(-11.87 48) scale(0.4333)">
    <path d="M 512 120 C 712 120, 812 220, 812 420 C 812 620, 712 720, 512 720 C 312 720, 212 620, 212 420 C 212 220, 312 120, 512 120 Z" fill="url(#tileGrad)"/>
    <g clip-path="url(#squircleClip)">
      <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.55">
        <path d="M 250 540 Q 250 695, 390 715"/>
        <circle cx="390" cy="715" r="11" stroke-width="4" fill="#FFFFFF" fill-opacity="0.15"/>
      </g>
      <use href="#pawWithCross"/>
      <circle cx="755" cy="190" r="14" fill="#9333EA"/>
      <circle cx="755" cy="190" r="22" fill="none" stroke="#9333EA" stroke-width="3" opacity="0.4"/>
    </g>
  </g>

  <!-- Title section -->
  <text x="380" y="150" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="20" font-weight="600" fill="#10B981" letter-spacing="5">VETERINARIA CERTIFICADA</text>
  <text x="380" y="210" font-family="Fredoka, 'Nunito', ui-rounded, system-ui, sans-serif" font-size="48" font-weight="700" fill="#0F766E" letter-spacing="-1.5">Verificada en</text>
  <text x="380" y="270" font-family="Fredoka, 'Nunito', ui-rounded, system-ui, sans-serif" font-size="48" font-weight="700" fill="#064E3B" letter-spacing="-1.5">Paw Friend</text>

  <!-- Divider -->
  <line x1="380" y1="310" x2="700" y2="310" stroke="#10B981" stroke-width="1" opacity="0.4"/>

  <!-- Clinic info slots -->
  <text x="380" y="355" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="14" font-weight="600" fill="#065F46" letter-spacing="3">NOMBRE</text>
  <text x="380" y="400" font-family="Fredoka, 'Nunito', ui-rounded, system-ui, sans-serif" font-size="38" font-weight="700" fill="#1A102B" letter-spacing="-1" font-style="italic">[ Clínica Veterinaria ]</text>

  <text x="380" y="455" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="14" font-weight="600" fill="#065F46" letter-spacing="3">COMUNA · DIRECCIÓN</text>
  <text x="380" y="495" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="26" font-weight="500" fill="#064E3B" letter-spacing="-0.3" font-style="italic">[ Las Condes · Av. Principal 1234 ]</text>

  <!-- QR 200×200 at (900, 100) -->
  <g transform="translate(900, 100)">
    <rect x="-10" y="-10" width="220" height="220" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="200" fill="#FFFFFF"/>
    <!-- Fake QR pattern -->
    <g fill="#064E3B">
      <rect x="10" y="10" width="40" height="40"/><rect x="18" y="18" width="24" height="24" fill="#FFFFFF"/><rect x="24" y="24" width="12" height="12"/>
      <rect x="150" y="10" width="40" height="40"/><rect x="158" y="18" width="24" height="24" fill="#FFFFFF"/><rect x="164" y="24" width="12" height="12"/>
      <rect x="10" y="150" width="40" height="40"/><rect x="18" y="158" width="24" height="24" fill="#FFFFFF"/><rect x="24" y="164" width="12" height="12"/>
      <rect x="62" y="12" width="8" height="8"/><rect x="78" y="12" width="8" height="8"/><rect x="94" y="12" width="8" height="8"/><rect x="118" y="12" width="8" height="8"/>
      <rect x="62" y="28" width="8" height="8"/><rect x="86" y="28" width="8" height="8"/><rect x="110" y="28" width="8" height="8"/><rect x="130" y="28" width="8" height="8"/>
      <rect x="62" y="62" width="8" height="8"/><rect x="78" y="62" width="8" height="8"/><rect x="94" y="62" width="8" height="8"/><rect x="110" y="62" width="8" height="8"/><rect x="126" y="62" width="8" height="8"/><rect x="142" y="62" width="8" height="8"/><rect x="158" y="62" width="8" height="8"/>
      <rect x="70" y="78" width="8" height="8"/><rect x="86" y="78" width="8" height="8"/><rect x="102" y="78" width="8" height="8"/><rect x="126" y="78" width="8" height="8"/><rect x="150" y="78" width="8" height="8"/>
      <rect x="62" y="94" width="8" height="8"/><rect x="86" y="94" width="8" height="8"/><rect x="110" y="94" width="8" height="8"/><rect x="134" y="94" width="8" height="8"/><rect x="158" y="94" width="8" height="8"/>
      <rect x="70" y="110" width="8" height="8"/><rect x="94" y="110" width="8" height="8"/><rect x="118" y="110" width="8" height="8"/><rect x="142" y="110" width="8" height="8"/><rect x="166" y="110" width="8" height="8"/>
      <rect x="62" y="126" width="8" height="8"/><rect x="78" y="126" width="8" height="8"/><rect x="102" y="126" width="8" height="8"/><rect x="126" y="126" width="8" height="8"/><rect x="150" y="126" width="8" height="8"/>
      <rect x="70" y="142" width="8" height="8"/><rect x="86" y="142" width="8" height="8"/><rect x="110" y="142" width="8" height="8"/><rect x="134" y="142" width="8" height="8"/><rect x="158" y="142" width="8" height="8"/>
      <rect x="62" y="158" width="8" height="8"/><rect x="94" y="158" width="8" height="8"/><rect x="118" y="158" width="8" height="8"/><rect x="142" y="158" width="8" height="8"/><rect x="166" y="158" width="8" height="8"/>
      <rect x="70" y="174" width="8" height="8"/><rect x="86" y="174" width="8" height="8"/><rect x="102" y="174" width="8" height="8"/><rect x="126" y="174" width="8" height="8"/><rect x="150" y="174" width="8" height="8"/>
      <rect x="94" y="190" width="8" height="8"/><rect x="118" y="190" width="8" height="8"/><rect x="158" y="190" width="8" height="8"/>
    </g>
  </g>
  <text x="1000" y="340" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="14" font-weight="600" fill="#0F766E" text-anchor="middle" letter-spacing="2">ESCANEA PARA VER PERFIL</text>

  <!-- Divider bottom -->
  <line x1="100" y1="590" x2="1100" y2="590" stroke="#10B981" stroke-width="1" opacity="0.35"/>

  <!-- Signature left + date right -->
  <g transform="translate(100, 650)">
    <line x1="0" y1="0" x2="240" y2="0" stroke="#064E3B" stroke-width="1.5"/>
    <text x="120" y="30" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="18" font-weight="600" fill="#064E3B" text-anchor="middle">Paw Founder</text>
    <text x="120" y="52" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="14" font-weight="500" fill="#0F766E" text-anchor="middle" letter-spacing="0.3">PawFriend.cl</text>
  </g>

  <g transform="translate(860, 650)">
    <line x1="0" y1="0" x2="240" y2="0" stroke="#064E3B" stroke-width="1.5"/>
    <text x="120" y="30" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="18" font-weight="600" fill="#064E3B" text-anchor="middle">YYYY-MM-DD</text>
    <text x="120" y="52" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="14" font-weight="500" fill="#0F766E" text-anchor="middle" letter-spacing="3">FECHA</text>
  </g>

  <!-- Footer URL -->
  <text x="600" y="750" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="16" font-weight="600" fill="#0F766E" text-anchor="middle" letter-spacing="2">pawfriend.cl/veterinarios/[slug]</text>
</svg>
