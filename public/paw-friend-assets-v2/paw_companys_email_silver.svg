<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <title>Paw Company — SILVER — Email Header</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#581C87"/><stop offset="50%" stop-color="#9333EA"/><stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#581C87"/><stop offset="50%" stop-color="#9333EA"/><stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="metalTier" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/><stop offset="22%" stop-color="#64748B"/><stop offset="42%" stop-color="#CBD5E1"/><stop offset="50%" stop-color="#F8FAFC"/><stop offset="58%" stop-color="#CBD5E1"/><stop offset="78%" stop-color="#64748B"/><stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="softRight" cx="0.85" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <path id="outerSq" d="M 512 120 C 712 120, 812 220, 812 420 C 812 620, 712 720, 512 720 C 312 720, 212 620, 212 420 C 212 220, 312 120, 512 120 Z"/>
    <path id="innerSq" d="M 512 144 C 696 144, 788 236, 788 420 C 788 604, 696 696, 512 696 C 328 696, 236 604, 236 420 C 236 236, 328 144, 512 144 Z"/>
    <clipPath id="innerClip"><use href="#innerSq"/></clipPath>
    <mask id="heartMask">
      <rect x="-200" y="-200" width="1400" height="1400" fill="white"/>
      <path d="M 512 560 C 504 550, 490 540, 482 530 C 474 520, 477 505, 490 502 C 499 500, 507 505, 512 512 C 517 505, 525 500, 534 502 C 547 505, 550 520, 542 530 C 534 540, 520 550, 512 560 Z" fill="black"/>
    </mask>
    <g id="pawContent">
      <ellipse cx="512" cy="510" rx="155" ry="135" fill="#FFFFFF" mask="url(#heartMask)"/>
      <ellipse cx="372" cy="350" rx="55" ry="68" transform="rotate(-22 372 350)" fill="#FFFFFF"/>
      <ellipse cx="460" cy="260" rx="50" ry="62" transform="rotate(-10 460 260)" fill="#FFFFFF"/>
      <ellipse cx="564" cy="260" rx="50" ry="62" transform="rotate(10 564 260)" fill="#FFFFFF"/>
      <ellipse cx="652" cy="350" rx="55" ry="68" transform="rotate(22 652 350)" fill="#FFFFFF"/>
    </g>
  </defs>

  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#softRight)"/>

  <!-- Tier squircle 200px at (80, 80) -->
  <g transform="translate(9.34 40) scale(0.3333)">
    <use href="#outerSq" fill="url(#metalTier)"/>
    <use href="#innerSq" fill="url(#tileGrad)"/>
    <use href="#innerSq" fill="none" stroke="rgba(0,0,0,0.22)" stroke-width="1.5"/>
    <g clip-path="url(#innerClip)"><use href="#pawContent"/></g>
    <ellipse cx="360" cy="190" rx="160" ry="32" fill="white" fill-opacity="0.28" transform="rotate(-32 360 190)" clip-path="url(#innerClip)"/>
  </g>

  <!-- Wordmark white -->
  <text x="310" y="170" font-family="Fredoka, 'Nunito', ui-rounded, system-ui, sans-serif" font-size="58" font-weight="700" fill="#FFFFFF" letter-spacing="-2">Paw Companys</text>

  <!-- Tier-color pill -->
  <g transform="translate(310, 210)">
    <rect x="0" y="0" width="160" height="50" rx="25" fill="#F1F5F9"/>
    <text x="80" y="33" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="22" font-weight="700" fill="#1E293B" text-anchor="middle" letter-spacing="4">SILVER</text>
  </g>

  <!-- Gold hairline bottom -->
  <rect x="0" y="356" width="1200" height="4" fill="#FBBF24"/>
</svg>
