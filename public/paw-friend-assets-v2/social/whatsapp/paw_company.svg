<!-- paw_company.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="WhatsApp Catalog · Paw Companys" width="1080" height="1080">
  <title>WhatsApp Catalog · Paw Companys</title>
  <desc>Card Paw Companys (sponsors empresariales) para catalog WhatsApp Business.</desc>
  <defs><linearGradient id="bg-company" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f3e8ff" stop-opacity="1"/><stop offset="100%" stop-color="#fdf2f8" stop-opacity="1"/></linearGradient><linearGradient id="badge-company" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#9333ea" stop-opacity="1"/><stop offset="100%" stop-color="#581c87" stop-opacity="1"/></linearGradient></defs>
  <rect width="1080" height="1080" fill="url(#bg-company)"/>
  <!-- Header brand badge -->
  <rect x="60" y="80" width="260" height="64" rx="32" fill="#ffffff"/>
  <g transform="translate(96, 112)">
    <rect x="-18" y="-18" width="36" height="36" rx="8" fill="#9333ea"/>
    <!-- Paw mini interior -->
    <ellipse cx="0" cy="4" rx="5" ry="4" fill="#ffffff"/>
    <ellipse cx="-4" cy="-2" rx="1.8" ry="2.5" transform="rotate(-22)" fill="#ffffff"/>
    <ellipse cx="-1.5" cy="-5" rx="1.5" ry="2" transform="rotate(-10)" fill="#ffffff"/>
    <ellipse cx="1.5" cy="-5" rx="1.5" ry="2" transform="rotate(10)" fill="#ffffff"/>
    <ellipse cx="4" cy="-2" rx="1.8" ry="2.5" transform="rotate(22)" fill="#ffffff"/>
  </g>
  <text x="140" y="120" font-family="'Plus Jakarta Sans', sans-serif"
        font-weight="800" font-size="20" fill="#9333ea">Paw Friend</text>
  <!-- Price badge top right -->
  <rect x="760" y="80" width="260" height="64" rx="32" fill="#9333ea"/>
  <text x="890" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif"
        font-weight="800" font-size="22" fill="#ffffff">desde $49.900</text>
  <!-- Hero area white card -->
  <rect x="140" y="220" width="800" height="520" rx="40" fill="#ffffff"/>
  
  <g transform="translate(540, 480)">
    <rect x="-110" y="-110" width="220" height="220" rx="50" fill="url(#badge-company)"/>
    <!-- Edificio -->
    <rect x="-55" y="-60" width="110" height="95" rx="6" fill="#ffffff"/>
    <!-- Ventanas grid -->
    <rect x="-42" y="-48" width="14" height="14" rx="2" fill="#9333ea"/>
    <rect x="-22" y="-48" width="14" height="14" rx="2" fill="#9333ea"/>
    <rect x="-2"  y="-48" width="14" height="14" rx="2" fill="#9333ea"/>
    <rect x="18"  y="-48" width="14" height="14" rx="2" fill="#9333ea"/>
    <rect x="-42" y="-20" width="14" height="14" rx="2" fill="#9333ea"/>
    <rect x="-22" y="-20" width="14" height="14" rx="2" fill="#9333ea"/>
    <rect x="-2"  y="-20" width="14" height="14" rx="2" fill="#9333ea"/>
    <rect x="18"  y="-20" width="14" height="14" rx="2" fill="#9333ea"/>
    <!-- Puerta -->
    <rect x="-12" y="10" width="24" height="25" fill="#581c87"/>
    <!-- Tiers dots (bronze / silver / gold) -->
    <circle cx="-25" cy="60" r="8" fill="#cd7f32"/>
    <circle cx="0"   cy="60" r="8" fill="#c0c0c0"/>
    <circle cx="25"  cy="60" r="8" fill="#eab308"/>
    <text x="0" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif"
          font-weight="800" font-size="18" letter-spacing="5" fill="#ffffff">COMPANY</text>
  </g>
  <!-- Copy title -->
  <text x="540" y="830" text-anchor="middle" font-family="Fredoka, sans-serif"
        font-weight="600" font-size="62" fill="#1a102b">Paw Companys</text>
  <text x="540" y="895" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif"
        font-weight="500" font-size="26" fill="#4b3b66">Tu empresa, sponsor oficial.</text>
  <!-- CTA pill -->
  <rect x="290" y="955" width="500" height="80" rx="40" fill="#9333ea"/>
  <text x="540" y="1008" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif"
        font-weight="800" font-size="26" fill="#ffffff">Conversemos →</text>
</svg>
