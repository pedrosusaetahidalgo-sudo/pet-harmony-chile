<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <title>Paw Companys — Empty State</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3E8FF"/>
      <stop offset="100%" stop-color="#FAF7FF"/>
    </linearGradient>
    <linearGradient id="plaqueFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="shelfGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <radialGradient id="displaySpot" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0%" stop-color="#FCE7F3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FCE7F3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Soft display spotlight -->
  <rect width="800" height="600" fill="url(#displaySpot)"/>

  <!-- Confetti (purple + gold, scattered) -->
  <g opacity="0.85">
    <rect x="140" y="70" width="14" height="24" rx="3" fill="#9333EA" transform="rotate(22 147 82)"/>
    <rect x="660" y="90" width="14" height="24" rx="3" fill="#FBBF24" transform="rotate(-18 667 102)"/>
    <circle cx="200" cy="40" r="7" fill="#A78BFA"/>
    <circle cx="620" cy="50" r="8" fill="#FBBF24"/>
    <rect x="80" y="180" width="12" height="20" rx="3" fill="#FBBF24" transform="rotate(45 86 190)"/>
    <rect x="720" y="200" width="14" height="22" rx="3" fill="#9333EA" transform="rotate(-25 727 211)"/>
    <circle cx="60" cy="320" r="6" fill="#9333EA"/>
    <circle cx="740" cy="340" r="7" fill="#FBBF24"/>
    <rect x="530" y="30" width="10" height="18" rx="2" fill="#A78BFA" transform="rotate(15 535 39)"/>
    <rect x="260" y="20" width="12" height="20" rx="3" fill="#FBBF24" transform="rotate(-30 266 30)"/>
    <circle cx="130" cy="250" r="5" fill="#FBBF24"/>
    <circle cx="680" cy="270" r="5" fill="#9333EA"/>
  </g>

  <!-- Shelf / display base -->
  <rect x="80" y="420" width="640" height="8" fill="url(#shelfGrad)" opacity="0.7"/>
  <rect x="80" y="420" width="640" height="2" fill="#FBBF24" opacity="0.6"/>

  <!-- Shadow under shelf -->
  <ellipse cx="400" cy="440" rx="320" ry="8" fill="#9333EA" opacity="0.12"/>

  <!-- 3 empty plaque slots -->
  <!-- Slot 1 (Bronze size hint) -->
  <g transform="translate(120, 180)">
    <rect x="0" y="0" width="160" height="230" rx="14" fill="#FFFFFF" opacity="0.55"/>
    <rect x="0" y="0" width="160" height="230" rx="14" fill="none" stroke="#C4B5FD" stroke-width="2" stroke-dasharray="6,6"/>
    <!-- Placeholder squircle outline -->
    <rect x="30" y="30" width="100" height="100" rx="22" fill="none" stroke="#A78BFA" stroke-width="2" opacity="0.5"/>
    <text x="80" y="85" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="24" fill="#A78BFA" text-anchor="middle" opacity="0.7">?</text>
    <line x1="30" y1="160" x2="130" y2="160" stroke="#A78BFA" stroke-width="2" opacity="0.5"/>
    <line x1="50" y1="185" x2="110" y2="185" stroke="#A78BFA" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Slot 2 -->
  <g transform="translate(320, 180)">
    <rect x="0" y="0" width="160" height="230" rx="14" fill="#FFFFFF" opacity="0.55"/>
    <rect x="0" y="0" width="160" height="230" rx="14" fill="none" stroke="#C4B5FD" stroke-width="2" stroke-dasharray="6,6"/>
    <rect x="30" y="30" width="100" height="100" rx="22" fill="none" stroke="#A78BFA" stroke-width="2" opacity="0.5"/>
    <text x="80" y="85" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="24" fill="#A78BFA" text-anchor="middle" opacity="0.7">?</text>
    <line x1="30" y1="160" x2="130" y2="160" stroke="#A78BFA" stroke-width="2" opacity="0.5"/>
    <line x1="50" y1="185" x2="110" y2="185" stroke="#A78BFA" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Slot 3 -->
  <g transform="translate(520, 180)">
    <rect x="0" y="0" width="160" height="230" rx="14" fill="#FFFFFF" opacity="0.55"/>
    <rect x="0" y="0" width="160" height="230" rx="14" fill="none" stroke="#C4B5FD" stroke-width="2" stroke-dasharray="6,6"/>
    <rect x="30" y="30" width="100" height="100" rx="22" fill="none" stroke="#A78BFA" stroke-width="2" opacity="0.5"/>
    <text x="80" y="85" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="24" fill="#A78BFA" text-anchor="middle" opacity="0.7">?</text>
    <line x1="30" y1="160" x2="130" y2="160" stroke="#A78BFA" stroke-width="2" opacity="0.5"/>
    <line x1="50" y1="185" x2="110" y2="185" stroke="#A78BFA" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Copy -->
  <text x="400" y="500" font-family="Fredoka, 'Nunito', ui-rounded, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1A102B" text-anchor="middle" letter-spacing="-0.5">Aún no hay Paw Companys en esta categoría</text>
  <text x="400" y="540" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="18" font-weight="500" fill="#6B21A8" text-anchor="middle" letter-spacing="-0.2">Sé la primera empresa en sumarte a la comunidad</text>
</svg>
