<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Paw Vets — Social OG Card</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDFA"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <clipPath id="squircleClip">
      <path d="M 512 120 C 712 120, 812 220, 812 420 C 812 620, 712 720, 512 720 C 312 720, 212 620, 212 420 C 212 220, 312 120, 512 120 Z"/>
    </clipPath>
    <mask id="crossMask">
      <rect x="-200" y="-200" width="1400" height="1400" fill="white"/>
      <path d="M 506 510 H 518 V 524 H 532 V 536 H 518 V 550 H 506 V 536 H 492 V 524 H 506 Z" fill="black"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="1160" height="590" rx="32" fill="none" stroke="#A7F3D0" stroke-width="2"/>

  <!-- Squircle 240px at (60, 195) -->
  <g transform="translate(-24.8 147) scale(0.4)">
    <path d="M 512 120 C 712 120, 812 220, 812 420 C 812 620, 712 720, 512 720 C 312 720, 212 620, 212 420 C 212 220, 312 120, 512 120 Z" fill="url(#tileGrad)"/>
    <g clip-path="url(#squircleClip)">
      <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.55">
        <path d="M 250 540 Q 250 695, 390 715"/>
        <circle cx="390" cy="715" r="11" stroke-width="4" fill="#FFFFFF" fill-opacity="0.15"/>
      </g>
      <ellipse cx="512" cy="510" rx="155" ry="135" fill="#FFFFFF" mask="url(#crossMask)"/>
      <ellipse cx="372" cy="350" rx="55" ry="68" transform="rotate(-22 372 350)" fill="#FFFFFF"/>
      <ellipse cx="460" cy="260" rx="50" ry="62" transform="rotate(-10 460 260)" fill="#FFFFFF"/>
      <ellipse cx="564" cy="260" rx="50" ry="62" transform="rotate(10 564 260)" fill="#FFFFFF"/>
      <ellipse cx="652" cy="350" rx="55" ry="68" transform="rotate(22 652 350)" fill="#FFFFFF"/>
      <circle cx="755" cy="190" r="14" fill="#9333EA"/>
      <circle cx="755" cy="190" r="22" fill="none" stroke="#9333EA" stroke-width="3" opacity="0.4"/>
    </g>
  </g>

  <text x="360" y="230" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="22" font-weight="600" fill="#0F766E" letter-spacing="4">PAW FRIEND · SUB-BRAND</text>

  <!-- Brand title -->
  <text x="360" y="320" font-family="Fredoka, 'Nunito', ui-rounded, system-ui, sans-serif" font-size="72" font-weight="700" fill="#0F766E" letter-spacing="-2">Paw Vets</text>

  <!-- Teal pill -->
  <g transform="translate(360, 360)">
    <rect x="0" y="0" width="480" height="56" rx="28" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
    <text x="240" y="37" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="24" font-weight="700" fill="#0F766E" text-anchor="middle" letter-spacing="2">Nuevo veterinario verificado</text>
  </g>

  <text x="360" y="470" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="26" font-weight="500" fill="#064E3B" letter-spacing="-0.3">Ficha clínica digital, recordatorios de vacunas y control</text>
  <text x="360" y="505" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="26" font-weight="500" fill="#064E3B" letter-spacing="-0.3">— gratis para dueños y sus peludos</text>

  <g transform="translate(60, 555)">
    <rect x="0" y="0" width="12" height="28" rx="6" fill="url(#tileGrad)"/>
    <text x="28" y="22" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="22" font-weight="600" fill="#1A102B" letter-spacing="-0.3">pawfriend.cl/para-veterinarios</text>
  </g>
</svg>
