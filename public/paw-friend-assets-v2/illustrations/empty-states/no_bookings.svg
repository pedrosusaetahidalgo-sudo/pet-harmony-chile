<!-- no_bookings.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="No tienes reservas" width="400" height="300">
  <title>No tienes reservas</title>
  <desc>Empty state para agenda de reservas vacías en Paw Friend.</desc>
  <defs><linearGradient id="emp4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ecfdf5" stop-opacity="1"/><stop offset="100%" stop-color="#faf5ff" stop-opacity="1"/></linearGradient></defs>
  <rect width="400" height="300" fill="url(#emp4)"/>
  <!-- Agenda páginas -->
  <rect x="130" y="85" width="140" height="170" rx="6" fill="#ffffff" stroke="#4b3b66" stroke-width="1" opacity="0.9"/>
  <line x1="200" y1="85" x2="200" y2="255" stroke="#94889e" stroke-width="1" opacity="0.3"/>
  <!-- Líneas horizontales -->
  <line x1="145" y1="110" x2="185" y2="110" stroke="#94889e" stroke-width="1" opacity="0.3"/>
  <line x1="215" y1="110" x2="255" y2="110" stroke="#94889e" stroke-width="1" opacity="0.3"/>
  <line x1="145" y1="130" x2="185" y2="130" stroke="#94889e" stroke-width="1" opacity="0.3"/>
  <line x1="215" y1="130" x2="255" y2="130" stroke="#94889e" stroke-width="1" opacity="0.3"/>
  <!-- Reloj arriba-izq -->
  <circle cx="95" cy="105" r="26" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
  <line x1="95" y1="105" x2="95" y2="90" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="95" y1="105" x2="105" y2="110" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="95" cy="105" r="2" fill="#10b981"/>
  <!-- Stethoscope diagonal fondo -->
  <path d="M 280 88 Q 335 125 310 200" stroke="#047857" stroke-width="4"
        fill="none" stroke-linecap="round" opacity="0.4"/>
  <circle cx="310" cy="205" r="10" fill="#047857" opacity="0.4"/>
  <!-- Hueco dashed -->
  <rect x="150" y="160" width="100" height="45" rx="6" fill="none"
        stroke="#9333ea" stroke-width="2" stroke-dasharray="5,4" opacity="0.55"/>
  <text x="200" y="188" text-anchor="middle" font-family="Fredoka, sans-serif"
        font-size="12" font-weight="500" fill="#9333ea" opacity="0.55">sin cita</text>
  <!-- Sparkle -->
  <path d="M 58 247 L 60.4 252.6 L 66 255 L 60.4 257.4 L 58 263 L 55.6 257.4 L 50 255 L 55.6 252.6 Z" fill="#eab308"/>
</svg>
