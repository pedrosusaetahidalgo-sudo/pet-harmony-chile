<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <title>Paw Company — GOLD — Instagram Post</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3E8FF"/>
      <stop offset="60%" stop-color="#FAF7FF"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#581C87"/><stop offset="50%" stop-color="#9333EA"/><stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="metalTier" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78350F"/><stop offset="22%" stop-color="#D97706"/><stop offset="42%" stop-color="#FACC15"/><stop offset="50%" stop-color="#FEF3C7"/><stop offset="58%" stop-color="#FACC15"/><stop offset="78%" stop-color="#D97706"/><stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="goldPill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBBF24"/><stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <path id="outerSq" d="M 512 120 C 712 120, 812 220, 812 420 C 812 620, 712 720, 512 720 C 312 720, 212 620, 212 420 C 212 220, 312 120, 512 120 Z"/>
    <path id="innerSq" d="M 512 144 C 696 144, 788 236, 788 420 C 788 604, 696 696, 512 696 C 328 696, 236 604, 236 420 C 236 236, 328 144, 512 144 Z"/>
    <clipPath id="innerClip"><use href="#innerSq"/></clipPath>
    <mask id="heartMask">
      <rect x="-200" y="-200" width="1400" height="1400" fill="white"/>
      <path d="M 512 560 C 504 550, 490 540, 482 530 C 474 520, 477 505, 490 502 C 499 500, 507 505, 512 512 C 517 505, 525 500, 534 502 C 547 505, 550 520, 542 530 C 534 540, 520 550, 512 560 Z" fill="black"/>
    </mask>
    <g id="pawContent">
      <ellipse cx="512" cy="510" rx="155" ry="135" fill="#FFFFFF" mask="url(#heartMask)"/>
      <ellipse cx="372" cy="350" rx="55" ry="68" transform="rotate(-22 372 350)" fill="#FFFFFF"/>
      <ellipse cx="460" cy="260" rx="50" ry="62" transform="rotate(-10 460 260)" fill="#FFFFFF"/>
      <ellipse cx="564" cy="260" rx="50" ry="62" transform="rotate(10 564 260)" fill="#FFFFFF"/>
      <ellipse cx="652" cy="350" rx="55" ry="68" transform="rotate(22 652 350)" fill="#FFFFFF"/>
    </g>
  </defs>

  <rect width="1080" height="1080" fill="url(#bgGrad)"/>

  <!-- Tier squircle 420px centered at top (x=330, y=110) -->
  <g transform="translate(181.6 26) scale(0.7)">
    <use href="#outerSq" fill="url(#metalTier)"/>
    <use href="#innerSq" fill="url(#tileGrad)"/>
    <use href="#innerSq" fill="none" stroke="rgba(0,0,0,0.22)" stroke-width="1.5"/>
    <g clip-path="url(#innerClip)"><use href="#pawContent"/></g>
    <ellipse cx="360" cy="190" rx="160" ry="32" fill="white" fill-opacity="0.28" transform="rotate(-32 360 190)" clip-path="url(#innerClip)"/>
  </g>

  <!-- Tier label -->
  <text x="540" y="620" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="34" font-weight="700" fill="#A16207" text-anchor="middle" letter-spacing="6">GOLD</text>

  <!-- Empresa logo slot (dashed frame placeholder) -->
  <g transform="translate(540, 720)">
    <rect x="-180" y="0" width="360" height="120" rx="16" fill="none" stroke="#9333EA" stroke-width="2" stroke-dasharray="6,6" opacity="0.5"/>
    <text x="0" y="70" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="22" font-weight="500" fill="#9333EA" text-anchor="middle" opacity="0.6" letter-spacing="2">LOGO DE TU EMPRESA</text>
  </g>

  <!-- Gold pill "Orgullosa Paw Company" -->
  <g transform="translate(540, 910)">
    <rect x="-265" y="-34" width="530" height="68" rx="34" fill="url(#goldPill)"/>
    <text x="0" y="9" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="28" font-weight="700" fill="#1A102B" text-anchor="middle" letter-spacing="-0.3">💛 Orgullosa Paw Company</text>
  </g>

  <!-- Bottom footer -->
  <text x="540" y="1020" font-family="Fredoka, 'Nunito', ui-rounded, sans-serif" font-size="22" font-weight="600" fill="#9333EA" text-anchor="middle" letter-spacing="4">PAWFRIEND.CL</text>
</svg>
