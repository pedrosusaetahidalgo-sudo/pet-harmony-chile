<!-- 07_paw_member.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1242 2688" role="img" aria-label="Paw Member benefits" width="1242" height="2688">
  <title>Paw Member benefits</title>
  <desc>App Store screenshot 6.5" slide 07 — Paw Member (donación opcional).</desc>
  <defs><radialGradient id="ios7bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#fef3c7" stop-opacity="1"/><stop offset="100%" stop-color="#f3e8ff" stop-opacity="1"/></radialGradient></defs>
  <rect width="1242" height="2688" fill="url(#ios7bg)"/>
  <!-- Status bar safe area -->
  <rect width="1242" height="80" fill="#1a102b" opacity="0.04"/>
  <rect x="0" y="2608" width="1242" height="80" fill="#1a102b" opacity="0.04"/>
  <!-- Eyebrow pill -->
  <rect x="360" y="180" width="520" height="70" rx="35"
        fill="#ffffff" fill-opacity="0.6" stroke="#9333ea" stroke-opacity="0.35" stroke-width="2"/>
  <text x="621" y="226" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif"
        font-weight="800" font-size="22" letter-spacing="6" fill="#b45309">PAW MEMBER · APOYO OPCIONAL</text>
  <text x="621" y="440" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="112" fill="#1a102b">Sostén el</text>
  <text x="621" y="570" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="112" fill="#eab308">proyecto</text>
  <text x="621" y="700" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="112" fill="#1a102b">sin bloqueos.</text>

  <text x="621" y="820" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif"
        font-weight="500" font-size="38" fill="#4b3b66">Donación opcional. Features siempre libres.</text>
  <!-- Phone mockup iPhone 15 Pro style -->
  <g transform="translate(301, 900)">
    <rect x="0" y="0" width="640" height="1560" rx="90" fill="#1a102b"/>
    <rect x="20" y="20" width="600" height="1520" rx="75" fill="#ffffff"/>
    <!-- Dynamic island -->
    <rect x="250" y="45" width="140" height="32" rx="16" fill="#1a102b"/>
    
    <!-- Header gold -->
    <rect x="20" y="20" width="600" height="150" rx="75" fill="#eab308"/>
    <rect x="20" y="100" width="600" height="70" fill="#eab308"/>
    <text x="320" y="145" text-anchor="middle" font-family="Fredoka, sans-serif"
          font-weight="600" font-size="38" fill="#b45309">Paw Member</text>
    <!-- Badge gold gradient grande -->
    <defs>
      <linearGradient id="ios7mb" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#eab308"/>
        <stop offset="100%" stop-color="#b45309"/>
      </linearGradient>
    </defs>
    <g transform="translate(320, 340)">
      <rect x="-120" y="-120" width="240" height="240" rx="55" fill="url(#ios7mb)"/>
      <path d="M 0 -40 C -22 -56, -26 -76, -17 -80 C -10 -82, -5 -78, 0 -74 C 5 -78, 10 -82, 17 -80 C 26 -76, 22 -56, 0 -40 Z" fill="#ffffff"/>
      <g transform="translate(0, 25) scale(1.4)">
        <ellipse cx="0" cy="10" rx="18" ry="15" fill="#ffffff"/>
        <ellipse cx="-16" cy="-5" rx="6" ry="8" transform="rotate(-22 -16 -5)" fill="#ffffff"/>
        <ellipse cx="-6" cy="-14" rx="5.5" ry="7" transform="rotate(-10 -6 -14)" fill="#ffffff"/>
        <ellipse cx="6" cy="-14" rx="5.5" ry="7" transform="rotate(10 6 -14)" fill="#ffffff"/>
        <ellipse cx="16" cy="-5" rx="6" ry="8" transform="rotate(22 16 -5)" fill="#ffffff"/>
      </g>
      <text x="0" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif"
            font-weight="800" font-size="26" letter-spacing="7" fill="#ffffff">MEMBER</text>
    </g>
    <!-- Benefits list -->
    <g transform="translate(70, 580)">
      <g transform="translate(0, 0)">
        <circle cx="25" cy="25" r="20" fill="#eab308"/>
        <path d="M 17 25 L 23 31 L 34 19" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="65" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="24" fill="#1a102b">Badge oficial en tu perfil</text>
      </g>
      <g transform="translate(0, 60)">
        <circle cx="25" cy="25" r="20" fill="#eab308"/>
        <path d="M 17 25 L 23 31 L 34 19" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="65" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="24" fill="#1a102b">Acceso a alianzas exclusivas</text>
      </g>
      <g transform="translate(0, 120)">
        <circle cx="25" cy="25" r="20" fill="#eab308"/>
        <path d="M 17 25 L 23 31 L 34 19" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="65" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="24" fill="#1a102b">Kit físico de agradecimiento</text>
      </g>
      <g transform="translate(0, 180)">
        <circle cx="25" cy="25" r="20" fill="#eab308"/>
        <path d="M 17 25 L 23 31 L 34 19" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="65" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="24" fill="#1a102b">Soporte prioritario</text>
      </g>
    </g>
    <!-- Price -->
    <text x="320" y="920" text-anchor="middle" font-family="Fredoka, sans-serif"
          font-weight="600" font-size="52" fill="#9333ea">$3.990/mes</text>
    <text x="320" y="960" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif"
          font-weight="500" font-size="22" fill="#4b3b66">cancelable cuando quieras</text>
    <!-- Sub disclaimer -->
    <text x="320" y="1020" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif"
          font-weight="500" font-size="20" fill="#4b3b66">Todas las features siempre libres</text>
    <!-- CTA -->
    <rect x="70" y="1080" width="500" height="80" rx="40" fill="#9333ea"/>
    <text x="320" y="1132" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif"
          font-weight="800" font-size="26" fill="#ffffff">Convertirme en Member</text>
  </g>
</svg>
