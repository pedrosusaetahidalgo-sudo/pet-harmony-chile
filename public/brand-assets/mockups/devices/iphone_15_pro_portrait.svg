<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1200" width="600" height="1200" role="img" aria-label="iPhone 15 Pro portrait mockup">
  <title>iPhone 15 Pro · Portrait · Deep Purple</title>
  <desc>Mockup vectorial de iPhone 15 Pro portrait. Screenshot placeholder en el centro editable.</desc>
  <defs>
    <linearGradient id="iph-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3052"/>
      <stop offset="0.5" stop-color="#2a1046"/>
      <stop offset="1" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="iph-bezel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b4a7a"/>
      <stop offset="0.08" stop-color="#2a1046"/>
      <stop offset="0.92" stop-color="#2a1046"/>
      <stop offset="1" stop-color="#5b4a7a"/>
    </linearGradient>
  </defs>
  <!-- Outer body -->
  <rect x="30" y="30" width="540" height="1140" rx="80" fill="url(#iph-body)"/>
  <!-- Bezel lighting -->
  <rect x="32" y="32" width="536" height="1136" rx="78" fill="none" stroke="url(#iph-bezel)" stroke-width="3" opacity=".7"/>
  <!-- Inner frame (screen area) -->
  <rect x="48" y="48" width="504" height="1104" rx="66" fill="#000000"/>
  <!-- Screen placeholder -->
  <rect x="50" y="50" width="500" height="1100" rx="64" fill="#faf5ff" stroke="#9333ea" stroke-width="2" stroke-dasharray="8,6" opacity=".8"/>
  <text x="300" y="600" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="18" fill="#9333ea" letter-spacing="4">SCREENSHOT AQUÍ</text>
  <text x="300" y="630" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="14" fill="#9333ea" opacity=".7">1170 × 2532 (6.1")</text>
  <!-- Dynamic island -->
  <rect x="230" y="68" width="140" height="32" rx="16" fill="#0a0618"/>
  <!-- Buttons detail -->
  <rect x="30" y="200" width="4" height="50" rx="2" fill="#5b4a7a"/>
  <rect x="30" y="280" width="4" height="80" rx="2" fill="#5b4a7a"/>
  <rect x="30" y="380" width="4" height="80" rx="2" fill="#5b4a7a"/>
  <rect x="566" y="240" width="4" height="110" rx="2" fill="#5b4a7a"/>
  <!-- Camera bump simulated (top left) -->
  <circle cx="88" cy="88" r="3" fill="#0a0618" opacity=".6"/>
  <!-- Shadow -->
  <ellipse cx="300" cy="1185" rx="260" ry="8" fill="#000000" opacity=".25"/>
</svg>
