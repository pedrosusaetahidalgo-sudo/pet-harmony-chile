<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="Instagram feed template — Feature">
  <title>IG Feed · Feature del día</title>
  <desc>Template 1080×1080 para posts IG feed. Editable: headline, screenshot area, CTA.</desc>
  <defs>
    <radialGradient id="ig-bg" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.5" stop-color="#f3e8ff"/>
      <stop offset="1" stop-color="#581c87"/>
    </radialGradient>
    <linearGradient id="ig-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#ig-bg)"/>
  <!-- Safe zones guides (dashed) opacity 0 in production -->
  <rect x="60" y="60" width="960" height="960" fill="none" stroke="none"/>
  <!-- Eyebrow -->
  <rect x="80" y="100" width="260" height="44" rx="22" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <text x="210" y="130" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="16" fill="#ffffff" letter-spacing="5">FEATURE DEL DÍA</text>
  <!-- Headline -->
  <text x="80" y="240" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="72" fill="#ffffff" letter-spacing="-2">La ficha médica</text>
  <text x="80" y="320" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="72" fill="#ffffff" letter-spacing="-2">de tu peludo,</text>
  <text x="80" y="400" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="72" fill="url(#ig-accent)" letter-spacing="-2">en PDF.</text>
  <!-- Screenshot placeholder -->
  <rect x="180" y="470" width="720" height="420" rx="28" fill="#ffffff" opacity=".9" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <rect x="200" y="490" width="680" height="60" rx="12" fill="#f3e8ff"/>
  <text x="220" y="528" font-family="'Fredoka',sans-serif" font-weight="600" font-size="22" fill="#9333ea">Ficha clínica · Kai</text>
  <rect x="200" y="570" width="320" height="140" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="220" y="602" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="14" fill="#047857" letter-spacing="2">VACUNAS AL DÍA</text>
  <circle cx="240" cy="655" r="18" fill="#10b981"/>
  <path d="M232 655 L238 661 L250 649" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="270" y="662" font-family="'Plus Jakarta Sans',sans-serif" font-weight="700" font-size="22" fill="#047857">Séxtuple</text>
  <rect x="540" y="570" width="320" height="140" rx="12" fill="#fef3c7" stroke="#eab308" stroke-width="2"/>
  <text x="560" y="602" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="14" fill="#b45309" letter-spacing="2">PRÓXIMO CONTROL</text>
  <text x="560" y="650" font-family="'Fredoka',sans-serif" font-weight="600" font-size="30" fill="#b45309">En 14 días</text>
  <text x="560" y="680" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="18" fill="#78350f">Antiparasitario</text>
  <rect x="200" y="730" width="680" height="140" rx="12" fill="#faf7ff" stroke="#e9d5ff" stroke-width="2"/>
  <rect x="220" y="760" width="200" height="14" rx="7" fill="#9333ea" opacity=".5"/>
  <rect x="220" y="790" width="480" height="8" rx="4" fill="#4b3b66" opacity=".3"/>
  <rect x="220" y="810" width="380" height="8" rx="4" fill="#4b3b66" opacity=".3"/>
  <rect x="220" y="830" width="440" height="8" rx="4" fill="#4b3b66" opacity=".3"/>
  <!-- CTA pill -->
  <rect x="380" y="930" width="320" height="72" rx="36" fill="#ffffff"/>
  <text x="540" y="978" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="22" fill="#9333ea">Descarga en pawfriend.cl →</text>
</svg>
