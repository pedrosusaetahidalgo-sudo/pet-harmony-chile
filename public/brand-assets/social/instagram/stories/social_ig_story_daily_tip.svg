<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-label="IG story — daily tip">
  <title>IG story daily tip</title>
  <rect width="1080" height="1920" fill="#faf5ff"/>
  <!-- Top brand band -->
  <rect width="1080" height="320" fill="#9333EA"/>
  <text x="540" y="220" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="500" font-size="28" fill="#fde047" letter-spacing="4">TIP DEL DÍA</text>
  <text x="540" y="288" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="56" fill="#fff" letter-spacing="-1.5">3 pasos para hidratar</text>
  <!-- Icon left -->
  <g transform="translate(280 720)">
    <circle r="160" fill="#9333EA"/>
    <g fill="#fff" transform="scale(0.4) translate(-340 -340)">
      <ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)"/>
      <ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)"/>
      <ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)"/>
      <ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)"/>
      <ellipse cx="340" cy="430" rx="155" ry="135"/>
    </g>
  </g>
  <!-- 3 numbered steps right -->
  <g transform="translate(540 600)" font-family="'Plus Jakarta Sans', sans-serif" fill="#1a102b">
    <g transform="translate(0 0)">
      <circle r="32" fill="#9333EA"/>
      <text y="10" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="32" fill="#fff">1</text>
      <text x="56" y="-4" font-weight="600" font-size="28">Agua fresca</text>
      <text x="56" y="28" font-weight="400" font-size="20" fill="#6b21a8">cambiar 2× al día</text>
    </g>
    <g transform="translate(0 140)">
      <circle r="32" fill="#9333EA"/>
      <text y="10" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="32" fill="#fff">2</text>
      <text x="56" y="-4" font-weight="600" font-size="28">Bowl limpio</text>
      <text x="56" y="28" font-weight="400" font-size="20" fill="#6b21a8">acero o cerámica</text>
    </g>
    <g transform="translate(0 280)">
      <circle r="32" fill="#9333EA"/>
      <text y="10" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="32" fill="#fff">3</text>
      <text x="56" y="-4" font-weight="600" font-size="28">Sombra siempre</text>
      <text x="56" y="28" font-weight="400" font-size="20" fill="#6b21a8">en patio o terraza</text>
    </g>
  </g>
  <text x="540" y="1680" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="32" letter-spacing="-1.5">
    <tspan fill="#6B21A8" font-weight="600">paw</tspan><tspan fill="#9333EA" font-weight="500"> friend</tspan>
  </text>
  <text x="540" y="1720" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" fill="#9333EA" opacity=".6">@pawfriend_cl</text>
</svg>
