<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="Instagram feed template — Testimonial">
  <title>IG Feed · Testimonial</title>
  <desc>Template 1080×1080 para testimoniales. Quote centrado + foto placeholder + cite.</desc>
  <defs>
    <linearGradient id="igt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#f3e8ff"/>
    </linearGradient>
    <radialGradient id="igt-blob" cx="0.75" cy="0.25" r="0.5">
      <stop offset="0" stop-color="#9333ea" stop-opacity=".15"/>
      <stop offset="1" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#igt-bg)"/>
  <rect width="1080" height="1080" fill="url(#igt-blob)"/>
  <!-- Decorative paw -->
  <g transform="translate(80 80)" opacity=".12">
    <ellipse cx="0" cy="30" rx="24" ry="18" fill="#9333ea"/>
    <ellipse cx="-22" cy="8" rx="9" ry="12" transform="rotate(-18 -22 8)" fill="#9333ea"/>
    <ellipse cx="-8" cy="-5" rx="7" ry="9" transform="rotate(-6 -8 -5)" fill="#9333ea"/>
    <ellipse cx="8" cy="-5" rx="7" ry="9" transform="rotate(6 8 -5)" fill="#9333ea"/>
    <ellipse cx="22" cy="8" rx="9" ry="12" transform="rotate(18 22 8)" fill="#9333ea"/>
  </g>
  <g transform="translate(1000 1000) rotate(30)" opacity=".12">
    <ellipse cx="0" cy="30" rx="30" ry="22" fill="#ec4899"/>
    <ellipse cx="-28" cy="8" rx="11" ry="15" transform="rotate(-18 -28 8)" fill="#ec4899"/>
    <ellipse cx="-10" cy="-6" rx="8" ry="11" transform="rotate(-6 -10 -6)" fill="#ec4899"/>
    <ellipse cx="10" cy="-6" rx="8" ry="11" transform="rotate(6 10 -6)" fill="#ec4899"/>
    <ellipse cx="28" cy="8" rx="11" ry="15" transform="rotate(18 28 8)" fill="#ec4899"/>
  </g>
  <!-- Large quote mark -->
  <text x="120" y="340" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="700" font-size="220" fill="#9333ea" opacity=".2">"</text>
  <!-- Quote text -->
  <text x="540" y="360" text-anchor="middle" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="500" font-style="italic" font-size="52" fill="#1a102b" letter-spacing="-1">
    <tspan x="540" dy="0">"A Pepa la vacunaron hace</tspan>
    <tspan x="540" dy="70">6 meses y no sabía cuándo</tspan>
    <tspan x="540" dy="70">le tocaba la siguiente.</tspan>
    <tspan x="540" dy="80" fill="#9333ea">Ahora Paw Friend me avisa."</tspan>
  </text>
  <!-- Cite block -->
  <g transform="translate(540 780)">
    <circle cx="-100" cy="0" r="48" fill="#9333ea"/>
    <text x="-100" y="10" text-anchor="middle" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="700" font-size="32" fill="#ffffff">P</text>
    <text x="-40" y="-8" font-family="'Fredoka',sans-serif" font-weight="600" font-size="30" fill="#1a102b">Paloma</text>
    <text x="-40" y="22" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="18" fill="#4b3b66">Dueña · iPhone · 2 mascotas</text>
  </g>
  <!-- Rating stars -->
  <g transform="translate(540 870)" fill="#eab308">
    <path d="M-90 0 L-85 10 L-74 11 L-82 18 L-80 29 L-90 23 L-100 29 L-98 18 L-106 11 L-95 10 Z"/>
    <path d="M-45 0 L-40 10 L-29 11 L-37 18 L-35 29 L-45 23 L-55 29 L-53 18 L-61 11 L-50 10 Z"/>
    <path d="M0 0 L5 10 L16 11 L8 18 L10 29 L0 23 L-10 29 L-8 18 L-16 11 L-5 10 Z"/>
    <path d="M45 0 L50 10 L61 11 L53 18 L55 29 L45 23 L35 29 L37 18 L29 11 L40 10 Z"/>
    <path d="M90 0 L95 10 L106 11 L98 18 L100 29 L90 23 L80 29 L82 18 L74 11 L85 10 Z"/>
  </g>
  <!-- Brand watermark -->
  <g transform="translate(540 980)">
    <rect x="-140" y="-28" width="280" height="56" rx="28" fill="#1a102b"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="18" fill="#ffffff" letter-spacing="4">@PAWFRIEND.CL</text>
  </g>
</svg>
