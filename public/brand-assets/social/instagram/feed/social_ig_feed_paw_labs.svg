<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="IG feed — Paw Labs">
  <title>IG feed Paw Labs</title>
  <rect width="1080" height="1080" fill="#581c87"/>
  <rect width="1080" height="120" fill="#fde047"/>
  <text x="540" y="78" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="34" fill="#581c87" letter-spacing="6">PAW LABS · BETA</text>
  <g transform="translate(540 480)">
    <!-- Lab flask -->
    <path d="M -50 -100 L -50 -40 L -90 60 Q -90 100, -40 100 L 40 100 Q 90 100, 90 60 L 50 -40 L 50 -100 Z" fill="#9333EA" stroke="#fde047" stroke-width="3"/>
    <line x1="-60" y1="-100" x2="60" y2="-100" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
    <!-- Bubbles -->
    <circle cx="-20" cy="40" r="8" fill="#fde047" opacity=".7"/>
    <circle cx="20" cy="60" r="6" fill="#fff" opacity=".6"/>
    <circle cx="0" cy="20" r="5" fill="#fde047" opacity=".5"/>
    <!-- Paw inside flask -->
    <g fill="#fff" transform="translate(-22 -32) scale(0.064)">
      <ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)"/>
      <ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)"/>
      <ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)"/>
      <ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)"/>
      <ellipse cx="340" cy="430" rx="155" ry="135"/>
    </g>
  </g>
  <text x="540" y="780" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="48" fill="#fff" letter-spacing="-1.5">Paw Shield biometría</text>
  <text x="540" y="830" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="22" fill="#fde047">primera versión · piloto cerrado</text>
  <g transform="translate(60 1020)">
    <g fill="#fff" transform="scale(0.05)">
      <ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)"/>
      <ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)"/>
      <ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)"/>
      <ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)"/>
      <ellipse cx="340" cy="430" rx="155" ry="135"/>
    </g>
    <text x="50" y="32" font-family="Fredoka, sans-serif" font-size="22" letter-spacing="-1.5">
      <tspan fill="#fff" font-weight="600">paw</tspan><tspan fill="#fde047" font-weight="500"> friend</tspan>
    </text>
    <text x="900" y="32" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="13" fill="#fff" opacity=".7">@pawfriend_cl</text>
  </g>
</svg>
