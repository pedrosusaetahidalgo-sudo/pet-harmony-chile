<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="IG feed — health tip">
  <title>IG feed health tip</title>
  <rect width="1080" height="1080" fill="#faf5ff"/>
  <rect x="60" y="60" width="960" height="900" rx="32" fill="#fff" stroke="#e9d5ff" stroke-width="3"/>
  <!-- Big icon -->
  <g transform="translate(540 240)">
    <rect x="-90" y="-90" width="180" height="180" rx="40" fill="#9333EA"/>
