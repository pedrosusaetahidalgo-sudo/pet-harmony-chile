    </g>
  </g>
  <text x="540" y="450" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="500" font-size="20" fill="#9333EA" letter-spacing="3">TIP DE SALUD</text>
  <text x="540" y="510" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="46" fill="#1a102b" letter-spacing="-1.5">3 vacunas que no fallan</text>
  <!-- Bullets -->
  <g transform="translate(160 600)" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" fill="#1a102b">
