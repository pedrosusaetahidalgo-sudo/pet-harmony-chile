    </g>
    <g transform="translate(0 160)">
      <circle r="14" fill="#10b981"/>
      <path d="M -7 0 L -2 6 L 8 -6" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
