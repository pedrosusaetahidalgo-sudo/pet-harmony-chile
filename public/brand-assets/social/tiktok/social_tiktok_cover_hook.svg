<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-label="TikTok cover — hook">
  <title>TikTok cover hook</title>
  <defs>
    <linearGradient id="tth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="#1a102b"/>
  <!-- Phone mockup blurred behind -->
  <g transform="translate(540 1100)" opacity=".5">
    <rect x="-160" y="-340" width="320" height="680" rx="40" fill="#581c87"/>
    <rect x="-150" y="-330" width="300" height="660" rx="32" fill="#3b0764"/>
  </g>
  <!-- Big stacked text -->
  <g transform="translate(80 480)">
    <text font-family="Fredoka, sans-serif" font-weight="600" font-size="120" fill="#fff" letter-spacing="-4">
      <tspan x="0">¿Tu peludo</tspan>
      <tspan x="0" dy="140" fill="url(#tth)">tiene</tspan>
      <tspan x="0" dy="140" fill="#fde047">historia</tspan>
      <tspan x="0" dy="140">clínica?</tspan>
    </text>
  </g>
</svg>
