<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Paw dots pattern">
  <title>Paw dots pattern</title>
  <defs>
    <pattern id="pd" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <g fill="#9333EA" opacity=".06" transform="translate(20 20) scale(0.06)">
        <ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)"/>
        <ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)"/>
        <ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)"/>
        <ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)"/>
        <ellipse cx="340" cy="430" rx="155" ry="135"/>
      </g>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="#faf5ff"/>
  <rect width="800" height="800" fill="url(#pd)"/>
</svg>
