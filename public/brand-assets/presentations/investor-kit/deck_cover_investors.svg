<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Paw Friend investor deck cover">
  <title>Paw Friend — Investor deck cover</title>
  <defs>
    <radialGradient id="ic-bg" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="35%" stop-color="#7e22ce"/>
      <stop offset="70%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#0a0118"/>
    </radialGradient>
    <radialGradient id="ic-glow" cx="78%" cy="22%" r="38%">
      <stop offset="0%" stop-color="#fde047" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ic-glow2" cx="18%" cy="80%" r="32%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="ic-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="ic-paws" x="0" y="0" width="140" height="140" patternUnits="userSpaceOnUse">
      <g fill="#fff" opacity=".035" transform="translate(40 40) scale(0.09)">
        <ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)"/>
        <ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)"/>
        <ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)"/>
        <ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)"/>
        <ellipse cx="340" cy="430" rx="155" ry="135"/>
      </g>
    </pattern>
    <mask id="hc-deck">
      <rect width="1920" height="1080" fill="white"/>
      <path d="M 960 540 C 956 535, 948 530, 944 525 C 940 520, 941 513, 947 511 C 951 510, 956 513, 960 517 C 964 513, 969 510, 973 511 C 979 513, 980 520, 976 525 C 972 530, 964 535, 960 540 Z" fill="black"/>
    </mask>
  </defs>

  <rect width="1920" height="1080" fill="url(#ic-bg)"/>
  <rect width="1920" height="1080" fill="url(#ic-paws)"/>
  <rect width="1920" height="1080" fill="url(#ic-glow)"/>
  <rect width="1920" height="1080" fill="url(#ic-glow2)"/>

  <line x1="160" y1="120" x2="280" y2="120" stroke="#eab308" stroke-width="2"/>
  <line x1="1640" y1="960" x2="1760" y2="960" stroke="#eab308" stroke-width="2"/>

  <text x="160" y="160" font-family="Fredoka, sans-serif" font-weight="500" font-size="22" fill="#fde047" letter-spacing="6">PAW FRIEND · HECHO EN CHILE</text>

  <g transform="translate(960 470) scale(0.41) translate(-340 -340)" filter="url(#ic-shadow)">
    <g fill="#fff">
      <ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)"/>
      <ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)"/>
      <ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)"/>
      <ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)"/>
    </g>
  </g>
  <ellipse cx="960" cy="525" rx="64" ry="56" fill="#fff" mask="url(#hc-deck)" filter="url(#ic-shadow)"/>

  <text x="960" y="700" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="92" letter-spacing="-3">
    <tspan fill="#fff">La ficha médica de tu mascota</tspan>
  </text>
  <text x="960" y="772" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="32" fill="#e9d5ff" letter-spacing=".5">Gratis para dueños · Sostenida por la comunidad B2B</text>

  <g transform="translate(960 830)">
    <circle r="3" fill="#fde047"/>
    <circle cx="-30" r="3" fill="#fff" opacity=".5"/>
    <circle cx="30" r="3" fill="#fff" opacity=".5"/>
  </g>

  <text x="960" y="888" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="20" fill="#fde047" letter-spacing="2">DECK PARA CORFO · START-UP CHILE · ÁNGELES LATAM</text>

  <text x="160" y="1000" font-family="'JetBrains Mono', monospace" font-size="16" fill="#fff" opacity=".6">2026 · Confidencial</text>
  <text x="1760" y="1000" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="16" fill="#fff" opacity=".6">pawfriend.cl</text>
</svg>
