<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Paw Friend partnership banner">
  <title>Paw Friend × Partner banner</title>
  <defs>
    <linearGradient id="pb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity=".5"/>
      <stop offset="50%" stop-color="#9333EA" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#9333EA" stop-opacity=".5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="#faf5ff"/>
  <rect width="1200" height="400" fill="url(#pb)"/>

  <!-- Left: mark + wordmark -->
  <g transform="translate(80 130)">
    <path d="M 70 0 C 112 0, 140 21, 140 70 C 140 119, 112 140, 70 140 C 28 140, 0 119, 0 70 C 0 21, 28 0, 70 0 Z" fill="#9333EA"/>
    <g fill="#fff" transform="translate(15 18) scale(0.16)">
      <ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)"/>
      <ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)"/>
      <ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)"/>
      <ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)"/>
      <ellipse cx="340" cy="430" rx="155" ry="135"/>
    </g>
    <text x="166" y="68" font-family="Fredoka, sans-serif" font-size="38" letter-spacing="-1.5">
      <tspan fill="#6B21A8" font-weight="600">paw</tspan><tspan fill="#9333EA" font-weight="500"> friend</tspan>
    </text>
    <text x="166" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="14" fill="#6b21a8">La ficha médica de tu mascota</text>
  </g>

  <!-- Center: × Paw Friend partner placeholder -->
  <g transform="translate(600 200)">
    <text x="-90" y="6" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="500" font-size="44" fill="#9333EA">×</text>
    <rect x="-50" y="-60" width="220" height="120" rx="12" fill="#fff" stroke="#e9d5ff" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="60" y="0" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9333EA" opacity=".6">logo partner aquí</text>
    <text x="60" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9333EA" opacity=".4">220 × 120</text>
  </g>

  <!-- Right: CTA -->
  <g transform="translate(1000 200)">
    <rect x="-90" y="-30" width="180" height="60" rx="30" fill="#9333EA"/>
    <text x="0" y="6" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="20" fill="#fff">Hablemos →</text>
  </g>

  <!-- Subtle gold accent corner -->
  <line x1="60" y1="60" x2="160" y2="60" stroke="#eab308" stroke-width="2"/>
  <line x1="1040" y1="340" x2="1140" y2="340" stroke="#eab308" stroke-width="2"/>
  <text x="1140" y="370" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9333EA" opacity=".5">pawfriend.cl</text>
</svg>
