      <tspan x="0" dy="22">en 2 meses, de cero a producto en 3 plataformas, apoyado por Claude (Anthropic).</tspan>
      <tspan x="0" dy="22">Dueño de Kai (perro) y Ema (gata), clientes #1 y #2 del proyecto.</tspan>
