    <text x="0" y="52" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="40" fill="#1a102b" letter-spacing="-1.5">La ficha médica digital de tu mascota,</text>
    <text x="0" y="102" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="40" fill="#9333ea" letter-spacing="-1.5">hecha en Chile, gratis para siempre.</text>
