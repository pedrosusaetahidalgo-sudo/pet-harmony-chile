    </text>
  </g>
  <g transform="translate(630 640)">
    <rect x="0" y="0" width="530" height="420" rx="24" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <rect x="24" y="24" width="120" height="32" rx="16" fill="#9333ea"/>
    <text x="84" y="45" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="12" fill="#ffffff" letter-spacing="2">TÚ RECIBES</text>
    <text x="24" y="110" font-family="'Fredoka',sans-serif" font-weight="600" font-size="34" fill="#1a102b">Visibilidad gratis.</text>
    <g transform="translate(24 160)">
