      <path d="M12 4 L15 10 L21 11 L17 15 L18 21 L12 18 L6 21 L7 15 L3 11 L9 10 Z" fill="#9333ea"/>
      <text x="38" y="17" font-family="'Plus Jakarta Sans',sans-serif" font-weight="600" font-size="17" fill="#1a102b">Badge oficial Paw Partner</text>
