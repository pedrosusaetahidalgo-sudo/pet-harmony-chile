<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" width="1240" height="1754" role="img" aria-label="Paw Partner one-pager A4">
  <title>Paw Partner · One-pager A4</title>
  <desc>One-pager A4 (210x297mm a 150dpi) para outreach a partners: descuento ↔ publicidad.</desc>
  <defs>
    <linearGradient id="pp-header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="pp-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="1240" height="1754" fill="#faf7ff"/>
  <!-- Header gradient bar -->
  <rect x="0" y="0" width="1240" height="260" fill="url(#pp-header)"/>
  <!-- Logo -->
  <g transform="translate(80 90)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="#ffffff"/>
    <ellipse cx="40" cy="56" rx="18" ry="14" fill="#047857"/>
    <ellipse cx="20" cy="30" rx="7" ry="9" transform="rotate(-18 20 30)" fill="#047857"/>
    <ellipse cx="32" cy="20" rx="6" ry="8" transform="rotate(-6 32 20)" fill="#047857"/>
    <ellipse cx="48" cy="20" rx="6" ry="8" transform="rotate(6 48 20)" fill="#047857"/>
    <ellipse cx="60" cy="30" rx="7" ry="9" transform="rotate(18 60 30)" fill="#047857"/>
  </g>
  <text x="190" y="130" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="34" fill="#ffffff" letter-spacing="-0.5">Paw Friend × Paw Partners</text>
  <text x="190" y="168" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="18" fill="rgba(255,255,255,0.9)">Barter sin plata · descuento ↔ publicidad</text>
  <!-- Title block -->
  <text x="80" y="380" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="68" fill="#1a102b" letter-spacing="-2">Tu negocio gana visibilidad.</text>
  <text x="80" y="452" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="68" letter-spacing="-2">
    <tspan fill="#1a102b">Paw Members ganan </tspan>
    <tspan fill="url(#pp-accent)">descuentos.</tspan>
  </text>
  <text x="80" y="520" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="24" fill="#4b3b66" style="line-height:1.5">
