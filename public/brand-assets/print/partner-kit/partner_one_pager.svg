  <!-- Call to action footer -->
  <rect x="80" y="1420" width="1080" height="200" rx="32" fill="url(#pp-header)"/>
  <text x="130" y="1490" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="40" fill="#ffffff">Hablemos.</text>
  <text x="130" y="1540" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="20" fill="rgba(255,255,255,0.92)">Una reunión de 20 min, firma simple, vivo en 48 h.</text>
  <rect x="130" y="1560" width="300" height="48" rx="24" fill="#ffffff"/>
  <text x="280" y="1591" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="16" fill="#047857">pawfriendcl@gmail.com</text>
  <text x="130" y="1720" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="12" fill="#4b3b66" opacity=".7">SpA SUSAETA GARNHAM SOFTWARE ENGINEERING · RUT 78.328.659-9 · Luis Pasteur 6111 Dp 201, Vitacura · pawfriend.cl</text>
</svg>
