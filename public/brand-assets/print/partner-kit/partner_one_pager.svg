      <rect x="670" y="0" width="200" height="50" rx="25" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/>
      <text x="770" y="32" text-anchor="middle">🛡️ Seguros pet</text>
      <rect x="890" y="0" width="240" height="50" rx="25" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/>
      <text x="1010" y="32" text-anchor="middle">🏨 Hoteles pet-friendly</text>
      <rect x="0" y="70" width="220" height="50" rx="25" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/>
      <text x="110" y="102" text-anchor="middle">✂️ Peluquerías</text>
      <rect x="240" y="70" width="220" height="50" rx="25" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/>
      <text x="350" y="102" text-anchor="middle">🚶 Paseadores</text>
      <rect x="480" y="70" width="200" height="50" rx="25" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/>
      <text x="580" y="102" text-anchor="middle">🏫 Entrenadores</text>
      <rect x="700" y="70" width="250" height="50" rx="25" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/>
      <text x="825" y="102" text-anchor="middle">🏥 Clínicas de urgencia</text>
    </g>
