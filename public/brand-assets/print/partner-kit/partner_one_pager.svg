      <path d="M6 12 L10 16 L18 8" stroke="#047857" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="17" font-family="'Plus Jakarta Sans',sans-serif" font-weight="600" font-size="17" fill="#1a102b">O combo especial pet</text>
    </g>
    <text x="24" y="310" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="14" fill="#4b3b66" opacity=".75">
      Nosotros te ayudamos a definir
    </text>
    <text x="24" y="332" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="14" fill="#4b3b66" opacity=".75">
