      <text x="38" y="17" font-family="'Plus Jakarta Sans',sans-serif" font-weight="600" font-size="17" fill="#1a102b">15-20% descuento</text>
    </g>
    <g transform="translate(24 200)">
      <circle cx="12" cy="12" r="12" fill="#d1fae5"/>
      <path d="M6 12 L10 16 L18 8" stroke="#047857" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="17" font-family="'Plus Jakarta Sans',sans-serif" font-weight="600" font-size="17" fill="#1a102b">O producto gratis con compra</text>
    </g>
    <g transform="translate(24 240)">
