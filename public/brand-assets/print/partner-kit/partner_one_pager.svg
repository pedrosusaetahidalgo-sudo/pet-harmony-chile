  </text>
  <text x="80" y="558" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="24" fill="#4b3b66">
    ofreces un beneficio a nuestra comunidad, te mostramos en la app.
  </text>
  <!-- 2 columns: tú das / tú recibes -->
  <g transform="translate(80 640)">
    <rect x="0" y="0" width="530" height="420" rx="24" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
    <rect x="24" y="24" width="80" height="32" rx="16" fill="#10b981"/>
    <text x="64" y="45" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="12" fill="#ffffff" letter-spacing="2">TÚ DAS</text>
    <text x="24" y="110" font-family="'Fredoka',sans-serif" font-weight="600" font-size="34" fill="#1a102b">Un beneficio real.</text>
