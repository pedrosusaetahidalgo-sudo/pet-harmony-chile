    </g>
    <g transform="translate(24 240)">
      <circle cx="12" cy="12" r="12" fill="#f3e8ff"/>
      <path d="M12 4 L15 10 L21 11 L17 15 L18 21 L12 18 L6 21 L7 15 L3 11 L9 10 Z" fill="#9333ea"/>
      <text x="38" y="17" font-family="'Plus Jakarta Sans',sans-serif" font-weight="600" font-size="17" fill="#1a102b">Push mensual a Paw Members</text>
    </g>
    <g transform="translate(24 280)">
      <circle cx="12" cy="12" r="12" fill="#f3e8ff"/>
      <path d="M12 4 L15 10 L21 11 L17 15 L18 21 L12 18 L6 21 L7 15 L3 11 L9 10 Z" fill="#9333ea"/>
      <text x="38" y="17" font-family="'Plus Jakarta Sans',sans-serif" font-weight="600" font-size="17" fill="#1a102b">Mención en newsletter</text>
    </g>
    <text x="24" y="368" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="14" fill="#4b3b66" opacity=".75">Los primeros 20 partners</text>
    <text x="24" y="390" font-family="'Plus Jakarta Sans',sans-serif" font-weight="700" font-size="14" fill="#b45309">entran con 0% comisión perpetua.</text>
  </g>
  <!-- Verticals we want -->
  <text x="80" y="1160" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="13" fill="#9333ea" letter-spacing="4">VERTICALES BUSCADOS</text>
  <g transform="translate(80 1190)">
