<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="Paw Voice promo code card">
  <title>Paw Voice · Promo Code Card</title>
  <desc>Tarjeta shareable 1:1 para que un Paw Voice comparta su código promo con su audiencia.</desc>
  <defs>
    <linearGradient id="pvc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f0738"/>
      <stop offset="0.5" stop-color="#581c87"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="pvc-glow" cx="0.5" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#eab308" stop-opacity=".4"/>
      <stop offset="1" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#pvc-bg)"/>
  <rect width="1080" height="1080" fill="url(#pvc-glow)"/>
  <!-- Watermark pattern -->
  <g fill="rgba(255,255,255,0.04)">
    <circle cx="80" cy="120" r="2.5"/><circle cx="200" cy="90" r="2"/><circle cx="380" cy="140" r="2.5"/>
    <circle cx="560" cy="110" r="2"/><circle cx="740" cy="130" r="2.5"/><circle cx="920" cy="95" r="2"/>
    <circle cx="150" cy="950" r="2.5"/><circle cx="400" cy="980" r="2"/><circle cx="700" cy="960" r="2.5"/>
  </g>
  <!-- Eyebrow -->
  <g transform="translate(540 180)">
    <rect x="-160" y="-30" width="320" height="60" rx="30" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="20" fill="#ffffff" letter-spacing="6">PAW VOICE OFICIAL</text>
  </g>
  <!-- Creator avatar placeholder -->
  <circle cx="540" cy="340" r="80" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.35)" stroke-width="3" stroke-dasharray="6,5"/>
  <text x="540" y="350" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="700" font-size="14" fill="rgba(255,255,255,0.6)" letter-spacing="3">TU FOTO</text>
  <!-- Handle placeholder -->
  <text x="540" y="470" text-anchor="middle" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="52" fill="#ffffff" letter-spacing="-1">@tunombre</text>
  <!-- Promo code block -->
  <rect x="120" y="540" width="840" height="200" rx="32" fill="#ffffff"/>
  <text x="540" y="600" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="22" fill="#ec4899" letter-spacing="5">TU CÓDIGO PROMO</text>
  <text x="540" y="700" text-anchor="middle" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="92" fill="#1a102b" letter-spacing="8">KAI10</text>
  <!-- Description -->
  <text x="540" y="820" text-anchor="middle" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="500" font-size="42" fill="#ffffff">Tu audiencia recibe beneficios.</text>
  <text x="540" y="870" text-anchor="middle" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="500" font-size="42" fill="#fde68a">Tú recibes reconocimiento.</text>
  <!-- CTA -->
  <rect x="290" y="920" width="500" height="80" rx="40" fill="#ffffff"/>
  <text x="540" y="972" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="26" fill="#be185d">pawfriend.cl →</text>
  <!-- Brand watermark -->
  <g transform="translate(60 1020)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="#ffffff"/>
    <ellipse cx="16" cy="23" rx="7" ry="5" fill="#9333ea"/>
    <ellipse cx="9" cy="13" rx="2.5" ry="3.5" transform="rotate(-18 9 13)" fill="#9333ea"/>
    <ellipse cx="13" cy="9" rx="2" ry="2.5" transform="rotate(-6 13 9)" fill="#9333ea"/>
    <ellipse cx="19" cy="9" rx="2" ry="2.5" transform="rotate(6 19 9)" fill="#9333ea"/>
    <ellipse cx="23" cy="13" rx="2.5" ry="3.5" transform="rotate(18 23 13)" fill="#9333ea"/>
    <text x="44" y="23" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="2">PAW FRIEND</text>
  </g>
</svg>
