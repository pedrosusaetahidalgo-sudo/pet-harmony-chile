<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Landing hero main">
  <title>Landing hero · smartphone + peludos</title>
  <desc>Composición hero del landing: smartphone con ficha médica, perrito chileno a la izquierda, gato a la derecha, cielo gradient warm.</desc>
  <defs>
    <radialGradient id="lh-sky" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.55" stop-color="#f3e8ff"/>
      <stop offset="1" stop-color="#faf5ff"/>
    </radialGradient>
    <linearGradient id="lh-phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1046"/>
      <stop offset="1" stop-color="#581c87"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#lh-sky)" rx="24"/>
  <!-- Sun glow -->
  <circle cx="600" cy="120" r="70" fill="#fef3c7" opacity=".7"/>
  <circle cx="600" cy="120" r="50" fill="#fde68a" opacity=".5"/>
  <!-- Ground shadow -->
  <ellipse cx="400" cy="540" rx="320" ry="22" fill="#9333ea" opacity=".12"/>
  <!-- Phone -->
  <g transform="translate(400 280) rotate(-6)">
    <rect x="-100" y="-170" width="200" height="340" rx="28" fill="url(#lh-phone)"/>
    <rect x="-90" y="-135" width="180" height="265" rx="10" fill="#ffffff"/>
    <rect x="-25" y="-165" width="50" height="6" rx="3" fill="#4b3b66"/>
    <!-- App screen: ficha card -->
    <rect x="-80" y="-118" width="160" height="100" rx="10" fill="#f3e8ff"/>
    <circle cx="-50" cy="-88" r="18" fill="#9333ea"/>
    <ellipse cx="-50" cy="-84" rx="8" ry="6" fill="#ffffff"/>
    <ellipse cx="-58" cy="-95" rx="2.5" ry="4" transform="rotate(-18 -58 -95)" fill="#ffffff"/>
    <ellipse cx="-50" cy="-100" rx="2" ry="3" transform="rotate(-6 -50 -100)" fill="#ffffff"/>
    <ellipse cx="-42" cy="-100" rx="2" ry="3" transform="rotate(6 -42 -100)" fill="#ffffff"/>
    <ellipse cx="-35" cy="-95" rx="2.5" ry="4" transform="rotate(18 -35 -95)" fill="#ffffff"/>
    <rect x="-20" y="-105" width="90" height="5" rx="2.5" fill="#9333ea"/>
    <rect x="-20" y="-94" width="60" height="4" rx="2" fill="#9333ea" opacity=".5"/>
    <rect x="-20" y="-84" width="70" height="4" rx="2" fill="#9333ea" opacity=".5"/>
    <!-- Vaccine ticks -->
    <rect x="-75" y="-10" width="150" height="24" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="-58" cy="2" r="7" fill="#10b981"/>
    <path d="M-62 2 L-60 5 L-54 -1" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <rect x="-45" y="-2" width="100" height="3" rx="1.5" fill="#047857" opacity=".7"/>
    <rect x="-45" y="5" width="70" height="3" rx="1.5" fill="#047857" opacity=".5"/>
    <rect x="-75" y="25" width="150" height="24" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="-58" cy="37" r="7" fill="#10b981"/>
    <path d="M-62 37 L-60 40 L-54 34" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <rect x="-45" y="33" width="100" height="3" rx="1.5" fill="#047857" opacity=".7"/>
    <rect x="-45" y="40" width="85" height="3" rx="1.5" fill="#047857" opacity=".5"/>
    <!-- Download PDF button -->
    <rect x="-60" y="70" width="120" height="26" rx="13" fill="#9333ea"/>
    <text x="0" y="87" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="10" fill="#ffffff">DESCARGAR PDF</text>
  </g>
  <!-- Dog on left -->
  <g transform="translate(190 380)">
    <ellipse cx="0" cy="50" rx="65" ry="70" fill="#9333ea"/>
    <ellipse cx="0" cy="-10" rx="55" ry="50" fill="#9333ea"/>
    <ellipse cx="-38" cy="-38" rx="16" ry="28" transform="rotate(-18 -38 -38)" fill="#7e22ce"/>
    <ellipse cx="38" cy="-38" rx="16" ry="28" transform="rotate(18 38 -38)" fill="#7e22ce"/>
    <ellipse cx="-36" cy="-32" rx="9" ry="18" transform="rotate(-18 -36 -32)" fill="#ec4899"/>
    <ellipse cx="36" cy="-32" rx="9" ry="18" transform="rotate(18 36 -32)" fill="#ec4899"/>
    <circle cx="-14" cy="-6" r="5" fill="#1a102b"/>
    <circle cx="14" cy="-6" r="5" fill="#1a102b"/>
    <circle cx="-13" cy="-8" r="1.5" fill="#ffffff"/>
    <circle cx="15" cy="-8" r="1.5" fill="#ffffff"/>
    <ellipse cx="0" cy="14" rx="7" ry="5" fill="#1a102b"/>
    <path d="M-10 26 Q0 34, 10 26" stroke="#1a102b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Collar with tag -->
    <rect x="-40" y="44" width="80" height="12" rx="6" fill="#eab308"/>
    <circle cx="0" cy="56" r="8" fill="#f59e0b"/>
  </g>
  <!-- Cat on right -->
  <g transform="translate(620 410)">
    <ellipse cx="0" cy="40" rx="50" ry="62" fill="#eab308"/>
    <ellipse cx="0" cy="-15" rx="46" ry="45" fill="#eab308"/>
    <path d="M-28 -40 L-36 -76 L-6 -48 Z" fill="#eab308"/>
    <path d="M28 -40 L36 -76 L6 -48 Z" fill="#eab308"/>
    <path d="M-25 -42 L-30 -64 L-10 -48 Z" fill="#ec4899"/>
    <path d="M25 -42 L30 -64 L10 -48 Z" fill="#ec4899"/>
    <ellipse cx="-14" cy="-12" rx="5" ry="8" fill="#1a102b"/>
    <ellipse cx="14" cy="-12" rx="5" ry="8" fill="#1a102b"/>
    <circle cx="-13" cy="-14" r="1.3" fill="#ffffff"/>
    <circle cx="15" cy="-14" r="1.3" fill="#ffffff"/>
    <path d="M-4 2 L0 8 L4 2 Z" fill="#ec4899"/>
    <path d="M0 8 Q-5 14, -10 16" stroke="#1a102b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M0 8 Q5 14, 10 16" stroke="#1a102b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Whiskers -->
    <line x1="-28" y1="-2" x2="-50" y2="-4" stroke="#1a102b" stroke-width="1" stroke-linecap="round"/>
    <line x1="-28" y1="4" x2="-50" y2="6" stroke="#1a102b" stroke-width="1" stroke-linecap="round"/>
    <line x1="28" y1="-2" x2="50" y2="-4" stroke="#1a102b" stroke-width="1" stroke-linecap="round"/>
    <line x1="28" y1="4" x2="50" y2="6" stroke="#1a102b" stroke-width="1" stroke-linecap="round"/>
  </g>
  <!-- Floating hearts -->
  <path d="M480 180 C474 172, 460 172, 460 184 C460 192, 480 206, 480 206 C480 206, 500 192, 500 184 C500 172, 486 172, 480 180 Z" fill="#ec4899" opacity=".7"/>
  <path d="M160 180 C157 176, 150 176, 150 182 C150 186, 160 193, 160 193 C160 193, 170 186, 170 182 C170 176, 163 176, 160 180 Z" fill="#ec4899" opacity=".5"/>
  <!-- Sparkles -->
  <path d="M80 200 l4 10 10 1 -8 7 2 11 -8 -6 -8 6 2 -11 -8 -7 10 -1 z" fill="#eab308"/>
  <path d="M720 230 l4 10 10 1 -8 7 2 11 -8 -6 -8 6 2 -11 -8 -7 10 -1 z" fill="#eab308"/>
  <path d="M370 90 l2 5 5 1 -4 3 1 5 -4 -2 -4 2 1 -5 -4 -3 5 -1 z" fill="#eab308"/>
</svg>
