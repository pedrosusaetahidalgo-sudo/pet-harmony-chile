<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Empty state: no donations yet">
  <title>Sin donaciones aún · Empty state</title>
  <desc>Corazón contorneado grande con chispa dorada invitando a aportar.</desc>
  <defs>
    <linearGradient id="nd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf2f8"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="nd-heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#nd-bg)" rx="20"/>
  <!-- Heart outline -->
  <path d="M200 230 C130 170, 80 125, 80 95 C80 75, 100 55, 125 55 C150 55, 170 70, 200 100 C230 70, 250 55, 275 55 C300 55, 320 75, 320 95 C320 125, 270 170, 200 230 Z" fill="none" stroke="url(#nd-heart)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Tiny paw inside -->
  <g transform="translate(200 140)">
    <ellipse cx="0" cy="15" rx="20" ry="15" fill="#ec4899" opacity=".25"/>
    <ellipse cx="-17" cy="-2" rx="7" ry="9" transform="rotate(-18 -17 -2)" fill="#ec4899" opacity=".25"/>
    <ellipse cx="-7" cy="-12" rx="6" ry="7" transform="rotate(-6 -7 -12)" fill="#ec4899" opacity=".25"/>
    <ellipse cx="7" cy="-12" rx="6" ry="7" transform="rotate(6 7 -12)" fill="#ec4899" opacity=".25"/>
    <ellipse cx="17" cy="-2" rx="7" ry="9" transform="rotate(18 17 -2)" fill="#ec4899" opacity=".25"/>
  </g>
  <!-- Gold sparkle near heart -->
  <g transform="translate(285 75)">
    <path d="M0 -14 L4 -4 L14 0 L4 4 L0 14 L-4 4 L-14 0 L-4 -4 z" fill="#eab308"/>
  </g>
  <path d="M80 195 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1 z" fill="#eab308" opacity=".7"/>
  <path d="M320 240 l2 5 5 1 -4 3 1 5 -4 -2 -4 2 1 -5 -4 -3 5 -1 z" fill="#eab308" opacity=".7"/>
</svg>
