<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Empty state: no pets yet">
  <title>Aún no tienes peludos · Empty state</title>
  <desc>Ilustración flat warm para cuando el usuario no tiene mascotas. Perrito sonriente saludando con la pata.</desc>
  <defs>
    <linearGradient id="np-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf5ff"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#np-bg)" rx="20"/>
  <!-- Cloud decoration -->
  <ellipse cx="80" cy="70" rx="28" ry="14" fill="#ffffff" opacity=".7"/>
  <ellipse cx="62" cy="72" rx="18" ry="10" fill="#ffffff" opacity=".7"/>
  <!-- Cloud 2 -->
  <ellipse cx="330" cy="55" rx="22" ry="11" fill="#ffffff" opacity=".6"/>
  <ellipse cx="345" cy="58" rx="15" ry="8" fill="#ffffff" opacity=".6"/>
  <!-- Dog body -->
  <ellipse cx="200" cy="210" rx="68" ry="54" fill="#9333ea"/>
  <!-- Dog belly lighter -->
  <ellipse cx="200" cy="225" rx="45" ry="30" fill="#c084fc"/>
  <!-- Dog head -->
  <ellipse cx="200" cy="150" rx="58" ry="52" fill="#9333ea"/>
  <!-- Ears -->
  <ellipse cx="155" cy="110" rx="18" ry="32" transform="rotate(-18 155 110)" fill="#7e22ce"/>
  <ellipse cx="245" cy="110" rx="18" ry="32" transform="rotate(18 245 110)" fill="#7e22ce"/>
  <!-- Inner ears -->
  <ellipse cx="157" cy="118" rx="10" ry="20" transform="rotate(-18 157 118)" fill="#ec4899"/>
  <ellipse cx="243" cy="118" rx="10" ry="20" transform="rotate(18 243 118)" fill="#ec4899"/>
  <!-- Eyes closed (smile curves) -->
  <path d="M175 145 C178 141, 186 141, 189 145" stroke="#1a102b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M211 145 C214 141, 222 141, 225 145" stroke="#1a102b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="200" cy="162" rx="7" ry="5" fill="#1a102b"/>
  <!-- Smile -->
  <path d="M190 176 Q200 184, 210 176" stroke="#1a102b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Tongue -->
  <path d="M195 178 Q200 186, 205 178" fill="#ec4899"/>
  <!-- Waving paw -->
  <g transform="translate(275 175) rotate(25)">
    <rect x="-8" y="0" width="16" height="45" rx="8" fill="#9333ea"/>
    <circle cx="0" cy="-8" r="14" fill="#9333ea"/>
    <!-- Paw pads -->
    <ellipse cx="0" cy="-4" rx="6" ry="4" fill="#fef3c7"/>
    <ellipse cx="-6" cy="-12" rx="2.5" ry="3" fill="#fef3c7"/>
    <ellipse cx="-2" cy="-16" rx="2" ry="2.5" fill="#fef3c7"/>
    <ellipse cx="4" cy="-16" rx="2" ry="2.5" fill="#fef3c7"/>
    <ellipse cx="8" cy="-12" rx="2.5" ry="3" fill="#fef3c7"/>
  </g>
  <!-- Other paw (planted) -->
  <ellipse cx="150" cy="265" rx="18" ry="10" fill="#7e22ce"/>
  <ellipse cx="250" cy="265" rx="18" ry="10" fill="#7e22ce"/>
  <!-- Decorative stars -->
  <path d="M60 170 l3 6 6 1 -5 4 1 6 -5 -3 -5 3 1 -6 -5 -4 6 -1 z" fill="#eab308"/>
  <path d="M340 195 l2 4 4 0 -3 3 1 4 -4 -2 -4 2 1 -4 -3 -3 4 0 z" fill="#eab308"/>
  <!-- Hello bubble -->
  <rect x="285" y="120" width="88" height="34" rx="17" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
  <path d="M295 150 L290 160 L302 153 Z" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
  <text x="329" y="143" text-anchor="middle" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="16" fill="#9333ea">¡Hola!</text>
</svg>
