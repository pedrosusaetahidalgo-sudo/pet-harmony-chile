<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Onboarding first medical record">
  <title>Tu primera ficha clínica</title>
  <desc>PDF estilizado con contenido de ficha médica y check verde de completitud.</desc>
  <defs>
    <linearGradient id="of-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#faf5ff"/><stop offset="1" stop-color="#ecfdf5"/></linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#of-bg)" rx="24"/>
  <!-- PDF paper -->
  <rect x="120" y="70" width="160" height="220" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="2.5"/>
  <path d="M250 70 L280 100 L250 100 Z" fill="#e9d5ff"/>
  <!-- PDF ribbon header -->
  <rect x="140" y="90" width="120" height="10" rx="5" fill="#9333ea"/>
  <text x="142" y="118" font-family="'Fredoka',sans-serif" font-weight="600" font-size="10" fill="#9333ea">FICHA CLÍNICA</text>
  <!-- Pet photo circle -->
  <circle cx="170" cy="150" r="22" fill="#fef3c7"/>
  <ellipse cx="170" cy="158" rx="12" ry="9" fill="#9333ea"/>
  <ellipse cx="170" cy="144" rx="9" ry="9" fill="#9333ea"/>
  <ellipse cx="161" cy="134" rx="3" ry="5" transform="rotate(-18 161 134)" fill="#7e22ce"/>
  <ellipse cx="179" cy="134" rx="3" ry="5" transform="rotate(18 179 134)" fill="#7e22ce"/>
  <!-- Info lines -->
  <rect x="200" y="140" width="60" height="5" rx="2.5" fill="#9333ea" opacity=".5"/>
  <rect x="200" y="150" width="45" height="4" rx="2" fill="#4b3b66" opacity=".4"/>
  <rect x="200" y="162" width="55" height="4" rx="2" fill="#4b3b66" opacity=".4"/>
  <!-- Table rows -->
  <rect x="140" y="190" width="120" height="2" fill="#e9d5ff"/>
  <rect x="145" y="200" width="60" height="4" rx="2" fill="#4b3b66" opacity=".4"/>
  <rect x="215" y="200" width="40" height="4" rx="2" fill="#10b981"/>
  <rect x="140" y="215" width="120" height="2" fill="#e9d5ff"/>
  <rect x="145" y="225" width="70" height="4" rx="2" fill="#4b3b66" opacity=".4"/>
  <rect x="225" y="225" width="30" height="4" rx="2" fill="#10b981"/>
  <rect x="140" y="240" width="120" height="2" fill="#e9d5ff"/>
  <rect x="145" y="250" width="55" height="4" rx="2" fill="#4b3b66" opacity=".4"/>
  <rect x="210" y="250" width="45" height="4" rx="2" fill="#eab308"/>
  <!-- Floating check -->
  <circle cx="315" cy="110" r="32" fill="#10b981"/>
  <path d="M300 112 L312 124 L330 100" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Download arrow -->
  <g transform="translate(200 330)">
    <rect x="-30" y="-4" width="60" height="28" rx="14" fill="#9333ea"/>
    <text x="0" y="14" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="700" font-size="11" fill="#ffffff">DESCARGAR PDF</text>
  </g>
  <!-- Sparkles -->
  <path d="M70 90 l3 6 6 1 -5 4 1 6 -5 -3 -5 3 1 -6 -5 -4 6 -1 z" fill="#eab308"/>
  <path d="M335 260 l2 4 4 1 -3 3 1 4 -4 -2 -4 2 1 -4 -3 -3 4 -1 z" fill="#eab308"/>
</svg>
