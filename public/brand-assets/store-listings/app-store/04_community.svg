<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1242 2688" width="1242" height="2688" role="img" aria-label="App Store screenshot 4 — Community">
  <title>App Store iPhone 6.5" · Slide 4 · Comunidad + donantes sangre</title>
  <desc>Comunidad peluda: adopción, donantes de sangre, memorial, rutinas.</desc>
  <defs>
    <radialGradient id="as4-bg" cx="0.5" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#f3e8ff"/>
      <stop offset="0.5" stop-color="#fdf2f8"/>
      <stop offset="1" stop-color="#9333ea"/>
    </radialGradient>
  </defs>
  <rect width="1242" height="2688" fill="url(#as4-bg)"/>
  <rect x="0" y="0" width="1242" height="80" fill="rgba(255,255,255,0.08)"/>
  <g transform="translate(621 220)">
    <rect x="-140" y="-30" width="280" height="60" rx="30" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="22" fill="#ffffff" letter-spacing="6">COMUNIDAD PELUDA</text>
  </g>
  <text x="621" y="440" text-anchor="middle" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="112" fill="#1a102b" letter-spacing="-4">Donantes de sangre.</text>
  <text x="621" y="570" text-anchor="middle" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="112" fill="#1a102b" letter-spacing="-4">Refugios.</text>
  <text x="621" y="700" text-anchor="middle" font-family="'Fredoka','Plus Jakarta Sans',sans-serif" font-weight="600" font-size="112" fill="#9333ea" letter-spacing="-4">Memoria.</text>
  <text x="621" y="820" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="38" fill="#4b3b66">Toda la comunidad peluda de Chile, en una app.</text>
  <!-- Phone mockup -->
  <g transform="translate(621 1700)">
    <rect x="-340" y="-820" width="680" height="1560" rx="90" fill="#581c87"/>
    <rect x="-310" y="-780" width="620" height="1480" rx="58" fill="#ffffff"/>
    <rect x="-90" y="-800" width="180" height="28" rx="14" fill="#1a102b"/>
    <!-- Header -->
    <rect x="-310" y="-770" width="620" height="100" fill="#9333ea"/>
    <text x="-260" y="-710" font-family="'Fredoka',sans-serif" font-weight="600" font-size="36" fill="#ffffff">Causas pet lovers</text>
    <!-- Donante sangre card -->
    <rect x="-290" y="-640" width="580" height="170" rx="24" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <g transform="translate(-210 -555)">
      <path d="M0 -50 C-30 -50, -50 -20, -50 10 C-50 40, 0 70, 0 70 C0 70, 50 40, 50 10 C50 -20, 30 -50, 0 -50 Z" fill="#dc2626"/>
      <ellipse cx="-8" cy="5" rx="8" ry="10" fill="#ffffff" opacity=".85"/>
    </g>
    <text x="-130" y="-600" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="16" fill="#dc2626" letter-spacing="3">DONANTES DE SANGRE</text>
    <text x="-130" y="-560" font-family="'Fredoka',sans-serif" font-weight="600" font-size="30" fill="#1a102b">Red activa en Chile</text>
    <text x="-130" y="-525" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="20" fill="#991b1b">Si tu peludo califica, salva una vida.</text>
    <rect x="170" y="-540" width="100" height="40" rx="20" fill="#dc2626"/>
    <text x="220" y="-514" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="14" fill="#ffffff">SUMARME</text>
    <!-- Adoption card -->
    <rect x="-290" y="-450" width="580" height="170" rx="24" fill="#fef3c7" stroke="#eab308" stroke-width="3"/>
    <g transform="translate(-210 -365)">
      <ellipse cx="0" cy="10" rx="35" ry="28" fill="#eab308"/>
      <ellipse cx="0" cy="-30" rx="30" ry="28" fill="#eab308"/>
      <ellipse cx="-22" cy="-50" rx="10" ry="16" transform="rotate(-18 -22 -50)" fill="#b45309"/>
      <ellipse cx="22" cy="-50" rx="10" ry="16" transform="rotate(18 22 -50)" fill="#b45309"/>
      <ellipse cx="0" cy="-18" rx="4" ry="3" fill="#1a102b"/>
      <circle cx="-9" cy="-30" r="3" fill="#1a102b"/>
      <circle cx="9" cy="-30" r="3" fill="#1a102b"/>
