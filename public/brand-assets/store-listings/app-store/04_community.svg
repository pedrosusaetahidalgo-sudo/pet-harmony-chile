    <text x="-130" y="-410" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="16" fill="#b45309" letter-spacing="3">ADOPCIÓN</text>
    <text x="-130" y="-370" font-family="'Fredoka',sans-serif" font-weight="600" font-size="30" fill="#1a102b">Refugios verificados</text>
    <text x="-130" y="-335" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="20" fill="#92400e">Cerca tuyo, con seguimiento post-adopción.</text>
    <rect x="170" y="-350" width="100" height="40" rx="20" fill="#b45309"/>
    <text x="220" y="-324" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="14" fill="#ffffff">VER</text>
    <!-- Memorial card -->
    <rect x="-290" y="-260" width="580" height="170" rx="24" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/>
    <g transform="translate(-210 -175)">
      <path d="M0 -50 C-10 -45, -25 -35, -28 -20 C-30 -5, -20 15, 0 30 C20 15, 30 -5, 28 -20 C25 -35, 10 -45, 0 -50 Z" fill="#9333ea"/>
      <path d="M-10 -10 L0 -30 L10 -10 Z M-14 10 L14 10 L10 0 L-10 0 Z" fill="#ffffff"/>
    </g>
    <text x="-130" y="-220" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="16" fill="#7e22ce" letter-spacing="3">MEMORIAL</text>
    <text x="-130" y="-180" font-family="'Fredoka',sans-serif" font-weight="600" font-size="30" fill="#1a102b">En memoria</text>
    <text x="-130" y="-145" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="20" fill="#6b21a8">Cápsulas del alma para los que se fueron.</text>
    <!-- Rutinas card -->
    <rect x="-290" y="-70" width="580" height="170" rx="24" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
    <g transform="translate(-210 15)">
      <circle cx="0" cy="0" r="40" fill="#10b981"/>
      <path d="M-18 0 L-5 12 L20 -15" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="-130" y="-30" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="16" fill="#047857" letter-spacing="3">RUTINAS DIARIAS</text>
    <text x="-130" y="10" font-family="'Fredoka',sans-serif" font-weight="600" font-size="30" fill="#1a102b">Paseos, comida, juego</text>
    <text x="-130" y="45" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500" font-size="20" fill="#065f46">Con recordatorios por mascota.</text>
    <!-- Bottom nav -->
    <rect x="-310" y="620" width="620" height="90" fill="#faf5ff"/>
    <line x1="-310" y1="620" x2="310" y2="620" stroke="#e9d5ff" stroke-width="1"/>
    <circle cx="110" cy="660" r="14" fill="#9333ea"/>
    <rect x="-70" y="700" width="140" height="4" rx="2" fill="#1a102b" opacity=".3"/>
  </g>
  <rect x="0" y="2608" width="1242" height="80" fill="rgba(255,255,255,0.08)"/>
