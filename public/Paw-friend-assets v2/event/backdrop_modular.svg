<!-- backdrop_modular.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1250" role="img" aria-label="Paw Friend Backdrop Modular" width="1500" height="1250">
  <title>Paw Friend Backdrop Modular</title>
  <desc>Backdrop 3×2.5m para ferias, entrevistas y eventos con isotipo hero, wordmark y URL.</desc>
  <defs><linearGradient id="bd-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2a1046" stop-opacity="1"/><stop offset="100%" stop-color="#9333ea" stop-opacity="1"/></linearGradient><radialGradient id="bd-glow" cx="75%" cy="30%" r="40%"><stop offset="0%" stop-color="#eab308" stop-opacity="0.2"/><stop offset="100%" stop-color="#eab308" stop-opacity="0"/></radialGradient></defs>
  <rect width="1500" height="1250" fill="url(#bd-bg)"/>
  <rect width="1500" height="1250" fill="url(#bd-glow)"/>

  <!-- Repeating isotype pattern muy grande -->
  <g opacity="0.08" fill="#ffffff">
    <g transform="translate(100, 150) scale(0.18)">
      <ellipse cx="340" cy="430" rx="155" ry="135" fill="#ffffff"/>
<ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)" fill="#ffffff"/>
<ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)" fill="#ffffff"/>
<ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)" fill="#ffffff"/>
<ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)" fill="#ffffff"/>
    </g>
    <g transform="translate(1250, 200) scale(0.15)">
      <ellipse cx="340" cy="430" rx="155" ry="135" fill="#ffffff"/>
<ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)" fill="#ffffff"/>
<ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)" fill="#ffffff"/>
<ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)" fill="#ffffff"/>
<ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)" fill="#ffffff"/>
    </g>
    <g transform="translate(200, 950) scale(0.2)">
      <ellipse cx="340" cy="430" rx="155" ry="135" fill="#ffffff"/>
<ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)" fill="#ffffff"/>
<ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)" fill="#ffffff"/>
<ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)" fill="#ffffff"/>
<ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)" fill="#ffffff"/>
    </g>
    <g transform="translate(1200, 900) scale(0.16)">
      <ellipse cx="340" cy="430" rx="155" ry="135" fill="#ffffff"/>
<ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)" fill="#ffffff"/>
<ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)" fill="#ffffff"/>
<ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)" fill="#ffffff"/>
<ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)" fill="#ffffff"/>
    </g>
  </g>

  <!-- Central hero lockup -->
  <g transform="translate(630, 380)">
    <rect x="0" y="0" width="240" height="240" rx="53" fill="#ffffff"/>
    <g transform="translate(120, 125) scale(0.3)"><ellipse cx="340" cy="430" rx="155" ry="135" fill="#9333ea"/>
<ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)" fill="#9333ea"/>
<ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)" fill="#9333ea"/>
<ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)" fill="#9333ea"/>
<ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)" fill="#9333ea"/></g>
  </g>
  <text x="750" y="740" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="96" fill="#ffffff">paw friend</text>
  <text x="750" y="820" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="32" fill="#fde68a" letter-spacing="8">HECHA EN CHILE</text>

  <!-- Sparkles gold -->
  <path d="M 250 400 L 260 420 L 280 430 L 260 440 L 250 460 L 240 440 L 220 430 L 240 420 Z" fill="#fbbf24"/>
  <path d="M 1220 550 L 1230 570 L 1250 580 L 1230 590 L 1220 610 L 1210 590 L 1190 580 L 1210 570 Z" fill="#fbbf24"/>

  <!-- URL bottom -->
  <rect x="500" y="1080" width="500" height="90" rx="45" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
  <text x="750" y="1138" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="38" fill="#ffffff">pawfriend.cl</text>
</svg>
