<!-- cover.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 664" role="img" aria-label="Paw Friend Facebook Cover" width="1640" height="664">
  <title>Paw Friend Facebook Cover</title>
  <desc>Cover FB Page con safe zone centered: logo, headline, sub y CTA. Edges decorativos cropeables en mobile.</desc>
  <defs><radialGradient id="fbbg" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#9333ea" stop-opacity="1"/><stop offset="60%" stop-color="#581c87" stop-opacity="1"/><stop offset="100%" stop-color="#2a1046" stop-opacity="1"/></radialGradient><radialGradient id="fbglow" cx="85%" cy="30%" r="40%"><stop offset="0%" stop-color="#eab308" stop-opacity="0.25"/><stop offset="100%" stop-color="#eab308" stop-opacity="0"/></radialGradient><radialGradient id="fbiso" cx="50%" cy="45%" r="70%"><stop offset="0%" stop-color="#9333ea" stop-opacity="1"/><stop offset="100%" stop-color="#581c87" stop-opacity="1"/></radialGradient><mask id="fb-heart"><rect width="100" height="100" fill="white"/><path d="M 50 73 C 46 68, 39 65, 37.5 60 C 36 54, 40 50, 43 50 C 45.5 50, 48 52, 50 54 C 52 52, 54.5 50, 57 50 C 60 50, 64 54, 62.5 60 C 61 65, 54 68, 50 73 Z" fill="black"/></mask></defs>
  <rect width="1640" height="664" fill="url(#fbbg)"/>
  <rect width="1640" height="664" fill="url(#fbglow)"/>
  <!-- Decorative paws fuera safe zone -->
  <g opacity="0.08" fill="#ffffff">
    <ellipse cx="120" cy="120" rx="28" ry="24"/>
    <ellipse cx="95" cy="95"  rx="10" ry="13" transform="rotate(-22 95 95)"/>
    <ellipse cx="110" cy="82" rx="9"  ry="12" transform="rotate(-10 110 82)"/>
    <ellipse cx="130" cy="82" rx="9"  ry="12" transform="rotate(10 130 82)"/>
    <ellipse cx="145" cy="95" rx="10" ry="13" transform="rotate(22 145 95)"/>
    <ellipse cx="1520" cy="544" rx="28" ry="24"/>
    <ellipse cx="1495" cy="519" rx="10" ry="13" transform="rotate(-22 1495 519)"/>
    <ellipse cx="1545" cy="519" rx="10" ry="13" transform="rotate(22 1545 519)"/>
  </g>
  <path d="M 1500 130 L 1506.0 144.0 L 1520 150 L 1506.0 156.0 L 1500 170 L 1494.0 156.0 L 1480 150 L 1494.0 144.0 Z" fill="#eab308" opacity="0.6"/>
  <path d="M 150 532 L 155.4 544.6 L 168 550 L 155.4 555.4 L 150 568 L 144.6 555.4 L 132 550 L 144.6 544.6 Z" fill="#eab308" opacity="0.6"/>

  <!-- SAFE ZONE CONTENT: logo + headline + sub + CTA -->
  <!-- Isotipo 100×100 -->
  <g transform="translate(440, 230)">
    <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#fbiso)"/>
    <!-- Mini paw inscrita -->
    <g transform="translate(50, 55) scale(0.85)">
      <ellipse cx="0" cy="6" rx="5" ry="4.2" fill="#ffffff" mask="url(#fb-heart)"/>
      <ellipse cx="-4" cy="0" rx="1.8" ry="2.5" transform="rotate(-22)" fill="#ffffff"/>
      <ellipse cx="-1.5" cy="-3.5" rx="1.5" ry="2" transform="rotate(-10)" fill="#ffffff"/>
      <ellipse cx="1.5" cy="-3.5" rx="1.5" ry="2" transform="rotate(10)" fill="#ffffff"/>
      <ellipse cx="4" cy="0" rx="1.8" ry="2.5" transform="rotate(22)" fill="#ffffff"/>
    </g>
  </g>
  <!-- Headline -->
  <text x="575" y="280" font-family="Fredoka, sans-serif"
        font-weight="600" font-size="48" fill="#ffffff">La ficha médica de tu mascota</text>
  <text x="575" y="335" font-family="'Plus Jakarta Sans', sans-serif"
        font-weight="500" font-size="22" fill="#ffffff" fill-opacity="0.85">Hecha en Chile · gratis para siempre</text>
  <!-- CTA pill -->
  <rect x="1040" y="270" width="190" height="56" rx="28" fill="#ffffff"/>
  <text x="1135" y="308" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif"
        font-weight="800" font-size="18" fill="#9333ea">Descarga la app →</text>
</svg>
