<!-- partner_welcome_kit_cover.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" role="img" aria-label="Paw Friend Partner Welcome Kit Cover" width="1240" height="1754">
  <title>Paw Friend Partner Welcome Kit Cover</title>
  <desc>Cover A4 del welcome kit para nuevos partners con 4 secciones: guidelines, assets, contrato y contacto.</desc>
  <defs><linearGradient id="prt3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#047857" stop-opacity="1"/><stop offset="50%" stop-color="#10b981" stop-opacity="1"/><stop offset="100%" stop-color="#9333ea" stop-opacity="1"/></linearGradient><radialGradient id="prt3-g" cx="75%" cy="25%" r="50%"><stop offset="0%" stop-color="#eab308" stop-opacity="0.3"/><stop offset="100%" stop-color="#eab308" stop-opacity="0"/></radialGradient></defs>
  <rect width="1240" height="1754" fill="url(#prt3)"/>
  <rect width="1240" height="1754" fill="url(#prt3-g)"/>

  <!-- Logo top -->
  <g transform="translate(560, 150)">
    <rect x="0" y="0" width="120" height="120" rx="27" fill="#ffffff"/>
    <g transform="translate(60, 62) scale(0.15)"><ellipse cx="340" cy="430" rx="155" ry="135" fill="#10b981"/>
<ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)" fill="#10b981"/>
<ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)" fill="#10b981"/>
<ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)" fill="#10b981"/>
<ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)" fill="#10b981"/></g>
  </g>
  <text x="620" y="330" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="48" fill="#ffffff">Paw Friend</text>

  <!-- Welcome badge -->
  <rect x="420" y="400" width="400" height="56" rx="28" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
  <text x="620" y="438" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" letter-spacing="6" fill="#fde68a">WELCOME PARTNER</text>

  <!-- Hero -->
  <text x="620" y="600" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="110" fill="#ffffff">Bienvenido a la</text>
  <text x="620" y="710" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="110" fill="#fde68a">manada.</text>

  <text x="620" y="830" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="22" fill="#ffffff" fill-opacity="0.85">Gracias por confiar en nosotros para llegar a los tutores chilenos.</text>
  <text x="620" y="865" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="22" fill="#ffffff" fill-opacity="0.85">Este kit contiene todo lo que necesitas para activar tu partnership.</text>

  <!-- 4 kit items -->
  <g transform="translate(100, 950)">
    <rect x="0" y="0" width="510" height="160" rx="16" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="30" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" letter-spacing="3" fill="#fde68a">01 · GUIDELINES</text>
    <text x="30" y="85" font-family="Fredoka, sans-serif" font-weight="600" font-size="28" fill="#ffffff">Manual de marca</text>
    <text x="30" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="15" fill="#ffffff" fill-opacity="0.75">Uso de logos, colores y tono de voz para co-branding consistente.</text>
  </g>
  <g transform="translate(630, 950)">
    <rect x="0" y="0" width="510" height="160" rx="16" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="30" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" letter-spacing="3" fill="#fde68a">02 · ASSETS</text>
    <text x="30" y="85" font-family="Fredoka, sans-serif" font-weight="600" font-size="28" fill="#ffffff">Biblioteca gráfica</text>
    <text x="30" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="15" fill="#ffffff" fill-opacity="0.75">Banners, stories y templates editables en Figma y Canva.</text>
  </g>
  <g transform="translate(100, 1140)">
    <rect x="0" y="0" width="510" height="160" rx="16" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="30" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" letter-spacing="3" fill="#fde68a">03 · CONTRATO</text>
    <text x="30" y="85" font-family="Fredoka, sans-serif" font-weight="600" font-size="28" fill="#ffffff">Términos comerciales</text>
    <text x="30" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="15" fill="#ffffff" fill-opacity="0.75">Acuerdo de partnership, SLA, métricas y revenue share.</text>
  </g>
  <g transform="translate(630, 1140)">
    <rect x="0" y="0" width="510" height="160" rx="16" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="30" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" letter-spacing="3" fill="#fde68a">04 · CONTACTO</text>
    <text x="30" y="85" font-family="Fredoka, sans-serif" font-weight="600" font-size="28" fill="#ffffff">Tu partner manager</text>
    <text x="30" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="15" fill="#ffffff" fill-opacity="0.75">Canal directo para activación, soporte y reportes mensuales.</text>
  </g>

  <!-- Kai + Ema signature -->
  <rect x="340" y="1380" width="560" height="120" rx="16" fill="#fef3c7" fill-opacity="0.2" stroke="#eab308" stroke-opacity="0.5" stroke-width="1"/>
  <text x="620" y="1420" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-style="italic" font-size="18" fill="#fde68a">Con cariño desde Chile,</text>
  <text x="620" y="1460" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="24" fill="#ffffff">— Paw Founder, Kai &amp; Ema</text>

  <!-- Footer -->
  <line x1="80" y1="1650" x2="1160" y2="1650" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="620" y="1690" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="12" fill="#ffffff" fill-opacity="0.6">SpA SUSAETA GARNHAM SOFTWARE ENGINEERING · RUT 78.328.659-9 · pawfriend.cl</text>
  <text x="620" y="1715" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#ffffff" fill-opacity="0.5">Partner Welcome Kit · Versión 2026-04-19</text>
</svg>
