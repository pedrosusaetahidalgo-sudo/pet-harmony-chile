<!-- email_banner.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Paw Friend Partner Email Banner" width="1200" height="400">
  <title>Paw Friend Partner Email Banner</title>
  <desc>Banner 1200×400 para outreach email a partners. Co-branding placeholder con emerald gradient.</desc>
  <defs><linearGradient id="prt1-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#047857" stop-opacity="1"/><stop offset="100%" stop-color="#10b981" stop-opacity="1"/></linearGradient><radialGradient id="prt1-glow" cx="85%" cy="30%" r="40%"><stop offset="0%" stop-color="#eab308" stop-opacity="0.2"/><stop offset="100%" stop-color="#eab308" stop-opacity="0"/></radialGradient></defs>
  <rect width="1200" height="400" fill="url(#prt1-bg)"/>
  <rect width="1200" height="400" fill="url(#prt1-glow)"/>
  <!-- Left brand area -->
  <g transform="translate(60, 145)">
    <rect x="0" y="0" width="80" height="80" rx="18" fill="#ffffff"/>
    <g transform="translate(40, 45) scale(0.1)"><ellipse cx="340" cy="430" rx="155" ry="135" fill="#10b981"/>
<ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)" fill="#10b981"/>
<ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)" fill="#10b981"/>
<ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)" fill="#10b981"/>
<ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)" fill="#10b981"/></g>
  </g>
  <text x="160" y="185" font-family="Fredoka, sans-serif" font-weight="600" font-size="36" fill="#ffffff">Paw Friend</text>
  <text x="160" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="14" fill="#ffffff" fill-opacity="0.85">Directorio vets de Chile</text>
  <!-- X symbol center -->
  <text x="580" y="240" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="120" fill="#ffffff" fill-opacity="0.5">×</text>
  <!-- Partner placeholder -->
  <rect x="700" y="150" width="200" height="100" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="800" y="205" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" letter-spacing="4" fill="#ffffff" fill-opacity="0.7">TU LOGO AQUÍ</text>
  <!-- CTA -->
  <rect x="950" y="300" width="200" height="56" rx="28" fill="#ffffff"/>
  <text x="1050" y="338" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="22" fill="#047857">Hablemos →</text>
</svg>
