<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-label="Paw Voice promo share card">
  <title>Paw Voice promo share card</title>
  <defs>
    <linearGradient id="pcs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="codbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#pcs)"/>

  <!-- Top: brand mark + Paw Voice -->
  <g transform="translate(80 100)">
    <g fill="#fff" transform="scale(0.13)">
      <ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)"/>
      <ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)"/>
      <ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)"/>
      <ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)"/>
      <ellipse cx="340" cy="430" rx="155" ry="135"/>
    </g>
    <text x="106" y="50" font-family="Fredoka, sans-serif" font-size="32" letter-spacing="-1.5">
      <tspan fill="#fff" font-weight="600">paw</tspan><tspan fill="#fde047" font-weight="500"> friend</tspan>
    </text>
    <text x="106" y="78" font-family="Fredoka, sans-serif" font-weight="500" font-size="13" fill="#fde047" letter-spacing="3">PAW VOICE · OFICIAL</text>
  </g>

  <!-- Creator photo placeholder -->
  <g transform="translate(540 460)">
    <circle r="170" fill="#fff" opacity=".08"/>
    <circle r="160" fill="none" stroke="#fde047" stroke-width="3" stroke-dasharray="6 6"/>
    <circle r="120" fill="#fff" opacity=".15"/>
    <text y="6" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#fff" opacity=".5">foto creator</text>
    <text y="28" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fff" opacity=".35">320 × 320</text>
  </g>

  <!-- Promo code block -->
  <g transform="translate(540 800)">
    <rect x="-380" y="-80" width="760" height="160" rx="24" fill="url(#codbg)"/>
    <text x="0" y="-30" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="500" font-size="20" fill="#fff" letter-spacing="3" opacity=".85">USA MI CÓDIGO</text>
    <text x="0" y="36" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="56" fill="#fff" letter-spacing="6">{CÓDIGO}</text>
  </g>

  <!-- Body text -->
  <text x="540" y="1000" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="42" fill="#fff" letter-spacing="-1">3 meses Paw Member gratis</text>
  <text x="540" y="1050" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="22" fill="#e9d5ff">Para tu primera mascota · sin tarjeta</text>

  <!-- CTA -->
  <g transform="translate(540 1180)">
    <rect x="-180" y="-32" width="360" height="64" rx="32" fill="#fde047"/>
    <text y="8" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="24" fill="#581c87">Aplicar el código</text>
  </g>

  <text x="540" y="1290" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#fff" opacity=".5">pawfriend.cl/paw-voice</text>
</svg>
