<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Sin recordatorios">
  <title>Sin recordatorios</title>
  <rect width="400" height="300" fill="#faf5ff"/>
  <ellipse cx="200" cy="260" rx="80" ry="8" fill="#9333EA" opacity=".15"/>
  <g transform="translate(200 160)">
    <!-- Calendar body -->
    <rect x="-70" y="-60" width="140" height="120" rx="12" fill="#fff" stroke="#9333EA" stroke-width="3"/>
    <rect x="-70" y="-60" width="140" height="32" rx="12" fill="#9333EA"/>
    <rect x="-70" y="-40" width="140" height="12" fill="#9333EA"/>
    <!-- Rings -->
    <rect x="-50" y="-72" width="6" height="20" rx="3" fill="#581c87"/>
    <rect x="44" y="-72" width="6" height="20" rx="3" fill="#581c87"/>
    <!-- Sleeping eyes (zzz mood) -->
    <path d="M -34 -10 Q -28 -6 -22 -10" fill="none" stroke="#1a102b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 22 -10 Q 28 -6 34 -10" fill="none" stroke="#1a102b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M -10 24 Q 0 32 10 24" fill="none" stroke="#1a102b" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Zzz -->
  <g fill="#9333EA" font-family="Fredoka, sans-serif" font-weight="600">
    <text x="280" y="100" font-size="24">z</text>
    <text x="296" y="78" font-size="32" opacity=".7">z</text>
    <text x="320" y="50" font-size="42" opacity=".5">z</text>
  </g>
</svg>
