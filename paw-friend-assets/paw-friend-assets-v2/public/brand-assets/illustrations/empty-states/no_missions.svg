<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Sin misiones">
  <title>Sin misiones</title>
  <rect width="400" height="300" fill="#faf5ff"/>
  <ellipse cx="200" cy="260" rx="80" ry="8" fill="#9333EA" opacity=".15"/>
  <g transform="translate(200 150)">
    <!-- Trophy -->
    <path d="M -42 -50 L -42 -10 C -42 14, -22 36, 0 36 C 22 36, 42 14, 42 -10 L 42 -50 Z" fill="#e9d5ff"/>
    <path d="M -42 -40 Q -68 -40, -68 -20 Q -68 0, -42 -8" fill="none" stroke="#e9d5ff" stroke-width="6" stroke-linecap="round"/>
    <path d="M 42 -40 Q 68 -40, 68 -20 Q 68 0, 42 -8" fill="none" stroke="#e9d5ff" stroke-width="6" stroke-linecap="round"/>
    <!-- Base -->
    <rect x="-12" y="36" width="24" height="14" fill="#e9d5ff"/>
    <rect x="-26" y="50" width="52" height="10" rx="3" fill="#9333EA" opacity=".25"/>
    <!-- Gold star hint inside -->
    <path d="M 0 -28 L 4 -16 L 16 -14 L 7 -6 L 10 6 L 0 -1 L -10 6 L -7 -6 L -16 -14 L -4 -16 Z" fill="#eab308" opacity=".6"/>
  </g>
  <!-- Z's hint of waiting -->
  <text x="280" y="80" font-family="Fredoka, sans-serif" font-weight="600" font-size="22" fill="#9333EA" opacity=".4">…pronto</text>
</svg>
