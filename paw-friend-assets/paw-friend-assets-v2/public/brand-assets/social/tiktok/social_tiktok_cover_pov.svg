<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-label="TikTok cover — POV">
  <title>TikTok cover POV</title>
  <defs>
    <radialGradient id="ttp" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#fde047" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="#1a102b"/>
  <rect width="1080" height="1920" fill="url(#ttp)"/>
  <!-- Polaroid frame tilted -->
  <g transform="translate(540 960) rotate(-5)">
    <rect x="-340" y="-440" width="680" height="800" rx="12" fill="#fff"/>
    <!-- Inner photo placeholder -->
    <rect x="-310" y="-410" width="620" height="620" rx="6" fill="#581c87"/>
    <!-- Pet silhouette inside photo -->
    <g transform="translate(0 -120)" fill="#fde047" opacity=".95">
      <ellipse cx="0" cy="80" rx="120" ry="100"/>
      <circle cx="-20" cy="-50" r="80"/>
      <path d="M -80 -90 L -60 -150 L -40 -90 Z"/>
      <path d="M 40 -90 L 60 -150 L 20 -90 Z"/>
    </g>
    <g fill="#1a102b">
      <circle cx="-44" cy="-58" r="6"/>
      <circle cx="6" cy="-58" r="6"/>
    </g>
    <!-- Paw prints around -->
    <g fill="#9333EA" opacity=".55">
      <g transform="translate(-260 280) scale(0.06)">
        <ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)"/>
        <ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)"/>
        <ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)"/>
        <ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)"/>
        <ellipse cx="340" cy="430" rx="155" ry="135"/>
      </g>
      <g transform="translate(180 280) scale(0.06) rotate(15 340 340)">
        <ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)"/>
        <ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)"/>
        <ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)"/>
        <ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)"/>
        <ellipse cx="340" cy="430" rx="155" ry="135"/>
      </g>
    </g>
    <!-- Caption -->
    <text y="318" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="40" fill="#1a102b" letter-spacing="-1">— mota, 4 años —</text>
  </g>
  <!-- Top hook -->
  <g transform="translate(540 280)" text-anchor="middle">
    <text font-family="Fredoka, sans-serif" font-weight="600" font-size="64" fill="#fff" letter-spacing="-2">POV: tu peludo</text>
    <text y="80" font-family="Fredoka, sans-serif" font-weight="600" font-size="64" fill="#fde047" letter-spacing="-2">tiene su carnet</text>
  </g>
</svg>
