<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-label="IG story — countdown">
  <title>IG story countdown</title>
  <defs>
    <radialGradient id="sct" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="55%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
    <radialGradient id="sct2" cx="78%" cy="22%" r="38%">
      <stop offset="0%" stop-color="#fde047" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#sct)"/>
  <rect width="1080" height="1920" fill="url(#sct2)"/>
  <text x="540" y="370" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="500" font-size="28" fill="#fde047" letter-spacing="6">FALTA POCO</text>
  <!-- Big mark centered -->
  <g transform="translate(540 800) scale(0.6) translate(-340 -340)">
    <g fill="#fff">
      <ellipse cx="200" cy="270" rx="55" ry="68" transform="rotate(-22 200 270)"/>
      <ellipse cx="288" cy="180" rx="50" ry="62" transform="rotate(-10 288 180)"/>
      <ellipse cx="392" cy="180" rx="50" ry="62" transform="rotate(10 392 180)"/>
      <ellipse cx="480" cy="270" rx="55" ry="68" transform="rotate(22 480 270)"/>
      <ellipse cx="340" cy="430" rx="155" ry="135"/>
    </g>
  </g>
  <text x="540" y="1180" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="64" fill="#fff" letter-spacing="-2">Lanzamiento</text>
  <text x="540" y="1260" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="64" fill="#fde047" letter-spacing="-2">junio 2026</text>
  <!-- Countdown sticker zone -->
  <g transform="translate(540 1480)">
    <rect x="-200" y="-60" width="400" height="120" rx="20" fill="#fff" opacity=".15" stroke="#fde047" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="0" y="8" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" fill="#fde047" opacity=".7">sticker countdown IG</text>
  </g>
</svg>
